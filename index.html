/* 오더 행의 어느 필드에 있든 상관없이 특정 문구가 포함돼 있는지 확인 —
   컬럼명이 시트마다 바뀌어도(또는 아직 COLMAP에 없어도) 안전하게 찾기 위함 */
function botRowHasText(r,needle){
  var hay=Object.keys(r).map(function(k){ return r[k]; }).join(' ');
  return String(hay||'').indexOf(needle)!==-1;
}
/* ---------- 답변: 입고·오더 ---------- */
function botAnsInbound(e){
  ensureAllYears();
  var all=[];
  YEARS.forEach(function(y){
    (state.data[y]||[]).forEach(function(r){ r._sy=r._sy||y; all.push(r); });
  });
  if(!all.length) return '오더 데이터를 불러오는 중입니다. 잠시 후 다시 물어봐 주세요.';

  var wantDelay = /지연/.test(e.lq);
  var wantCarry = /이월/.test(e.lq);
  /* "송금완료된 게 언제 입고되는지"처럼, 결제(송금/입금) 상태를 기준으로 입고 시점을 묻는 질문 —
     어느 컬럼에 그 상태 문구가 들어있는지 시트마다 다를 수 있어, 특정 필드를 고정하지 않고
     행 전체 텍스트에서 문구가 있는지로 찾는다(컬럼명이 바뀌어도 안 깨짐). */
  var wantPaid = /송금\s*완료|입금\s*완료/.test(e.lq);
  /* PI/SC# (예: 320S0001788) — 상품명·브랜드보다 훨씬 정확한 단서라서 있으면 최우선으로 쓴다 */
  var piM = e.raw.match(/\b(\d{2,4}[A-Za-z]\d{4,})\b/);
  var pi = piM ? piM[1] : '';
  var ym = e.ym;
  if(!ym && /(이번|금월|이달)/.test(e.lq)) ym=nowYM();
  var curYear = String(new Date().getFullYear());

  var list=all.filter(function(r){
    if(pi) return String(r.sc||'').indexOf(pi)!==-1;
    if(e.brand && normBrand(r.br)!==e.brand) return false;
    if(e.bc && normBc(r.bc)!==normBc(e.bc)) return false;
    if(wantDelay) return isDelayed(r);
    if(wantCarry) return isCarry(r);
    /* wantDelay/wantCarry를 직접 물은 게 아니면(=지금 시점 이후 정상 입고 예정을 묻는 질문이면),
       이미 지연·이월로 분류된 건은 이 답변에서 제외한다 — 그 건들은 "지연 오더"/"이월 오더"로
       따로 물어봐야 나오는 별도 카테고리다. 섞어서 보여주면 틀린 답이 된다. */
    if(wantPaid){
      /* 입고예정 질문이므로 지난 연도 시트는 제외하고 올해 자료만 본다 */
      if(String(r._sy)!==curYear) return false;
      if(isDelayed(r)||isCarry(r)) return false;
      return botRowHasText(r,'송금완료')||botRowHasText(r,'입금완료');
    }
    if(ym) return parseYM(r.im)===ym && !r.ind && !isDelayed(r) && !isCarry(r);
    return !r.ind && !isDelayed(r) && !isCarry(r);
  });
  /* 지연·이월로 분류되어 이번 답변에서 빠진 건수 — 0건으로 답할 때 "아예 없다"고
     오해하지 않도록, 있으면 어디로 물어봐야 나오는지 알려준다. */
  var excludedStatusCount = 0;
  if(!pi && !wantDelay && !wantCarry){
    excludedStatusCount = all.filter(function(r){
      if(e.brand && normBrand(r.br)!==e.brand) return false;
      if(e.bc && normBc(r.bc)!==normBc(e.bc)) return false;
      if(!(isDelayed(r)||isCarry(r))) return false;
      if(wantPaid){
        if(String(r._sy)!==curYear) return false;
        return botRowHasText(r,'송금완료')||botRowHasText(r,'입금완료');
      }
      if(ym) return parseYM(r.im)===ym && !r.ind;
      return !r.ind;
    }).length;
  }

  /* 상품명 토큰은 '가장 많이 맞은 건'만 남기는 방식으로 좁힌다.
     전부 일치를 요구하면 질문의 잡음 단어 때문에 결과가 0건이 된다. */
  if(!pi && e.tokens.length && list.length){
    var sc=list.map(function(r){
      var hay=[r.name,r.desc,r.item,r.code,r.bc].filter(Boolean).join(' ').toLowerCase();
      var h=0;
      for(var t=0;t<e.tokens.length;t++){ if(hay.indexOf(e.tokens[t])!==-1) h++; }
      return {r:r,h:h};
    });
    var mx=0; sc.forEach(function(x){ if(x.h>mx) mx=x.h; });
    if(mx>0) list=sc.filter(function(x){ return x.h===mx; }).map(function(x){ return x.r; });
  }

  var label = wantPaid?'송금완료 건의 입고 예정':(wantDelay?'지연 오더':(wantCarry?'이월 오더':(ym?fmtYM(ym)+' 입고 예정':'미입고 오더')));

  /* 확실하지 않으면 틀린 걸 짚어주지 말고, 더 정확한 단서(PI 번호)를 물어본다 —
     특히 "송금완료" 같은 문구는 여러 건에 붙어 있을 수 있어, 브랜드·상품 특정 없이
     결과가 애매하게 많으면 아무거나 골라 보여주는 대신 되묻는다. */
  var ambiguous = wantPaid && !pi && !e.brand && !e.tokens.length && list.length>3;
  if(!list.length || ambiguous){
    var none='<span class="bLead">'+(ambiguous?'해당 건이 여러 개라 정확히 못 짚겠어요':esc(label)+' 없음')+'</span>'
      +(ambiguous?('일치하는 항목이 '+list.length+'건이라 잘못 짚어드릴 수 있어요.'):((e.brand?esc(e.brand)+' 기준 해당 건이 없습니다.':'해당 조건의 건이 없습니다.')));
    if(!list.length && !ambiguous && excludedStatusCount>0){
      none+='<span class="bNote">단, 지연·이월 상태인 건이 '+excludedStatusCount+'건 있습니다 — "지연 오더" 또는 "이월 오더"로 물어보시면 확인하실 수 있어요.</span>';
    }
    none+='<span class="bNote">PI 번호(SC/PI#, 예: 320S0001788)를 알려주시면 정확히 찾아드릴게요.</span>';
    if(!list.length && wantPaid) none+='<span class="bNote">혹시 "송금완료" 표기가 다른 문구(예: "결제완료")로 되어 있다면 그것도 알려주세요.</span>';
    return none;
  }

  list.sort(function(a,b){ return String(a.eta||a.im||'zz').localeCompare(String(b.eta||b.im||'zz')); });
  var qty=list.reduce(function(s,r){return s+amtNum(r.qty)},0);
  var amt=list.reduce(function(s,r){return s+amtNum(r.amt)},0);
  var n=e.topN||10;

  var h='<span class="bLead">'+esc(label)+' '+list.length+'건'+(e.brand?' · '+esc(e.brand):'')+(pi?' · PI '+esc(pi):'')+'</span>'
    +'수량 <b>'+bNum(qty)+'</b>개 · 금액 <b>'+fmtUSD(amt)+'</b>'
    +'<table class="bTbl"><thead><tr><th>상품</th><th>ETA</th><th class="num">수량</th><th>상태</th></tr></thead><tbody>';
  list.slice(0,n).forEach(function(r){
    var st = r.ind ? '입고완료('+r.ind+')' : (isDelayed(r)?'지연':(isCarry(r)?'이월':(ST[statusOf(r)]?ST[statusOf(r)].label:'')));
    h+='<tr><td>'+esc(String(r.name||r.desc||r.item||'—').slice(0,24))+'</td>'
      +'<td>'+esc(r.eta||r.im||'—')+'</td>'
      +'<td class="num">'+bNum(amtNum(r.qty))+'</td>'
      +'<td>'+esc(st)+'</td></tr>';
  });
  h+='</tbody></table>';
  if(list.length>n) h+='<span class="bNote">'+n+'건만 표시했습니다. 브랜드나 PI 번호를 알려주시면 더 좁혀집니다.</span>';
  if(excludedStatusCount>0) h+='<span class="bNote">지연·이월 상태인 '+excludedStatusCount+'건은 제외했습니다 — "지연 오더"/"이월 오더"로 물어보시면 확인하실 수 있어요.</span>';
  return h;
}

/* ---------- 답변: KC ---------- */
function botAnsKc(e){
  if(cert.status!=='ok') return 'KC 인증서 데이터를 불러오는 중입니다. 잠시 후 다시 물어봐 주세요.';

  /* 특정 상품의 KC — 먼저 상품을 찾아보고, 못 찾으면 만료 목록으로 넘어간다 */
  var askList = /만료|임박|유효기간|expire/i.test(e.lq) && !e.bc && !e.code;
  if(e.bc||e.code||e.tokens.length||e.brand){
    var hit=(e.bc||e.code||e.tokens.length)?botFind(e):[];
    if(hit.length===1 && !(askList&&!e.tokens.length)){
      var o=hit[0], od=ordAttr(o.bc)||{}, kn=knOf(o.bc)||{}, cd=catDetail(o)||{};
      var kcno=od.kcno||kn.kc||cd.kc||o.kcno||'';
      var ct=certOf(kcno, od.kcname);
      if(!kcno&&!ct) return '<span class="bLead">'+esc(o.name)+'</span>KC 번호가 등록되어 있지 않습니다.'+botCard(o);
      var rows=[];
      if(kcno) rows.push('<dt>KC 번호</dt><dd>'+esc(kcno)+'</dd>');
      if(od.kcname) rows.push('<dt>인증명</dt><dd>'+esc(od.kcname)+'</dd>');
      if(ct){
        if(ct.series) rows.push('<dt>시리즈</dt><dd>'+esc(ct.series)+'</dd>');
        if(ct.maker) rows.push('<dt>업체명</dt><dd>'+esc(ct.maker)+'</dd>');
        if(ct._iss) rows.push('<dt>발급일</dt><dd>'+fmtD(ct._iss)+'</dd>');
        if(ct._exp) rows.push('<dt>유효기간</dt><dd>'+fmtD(ct._exp)+'</dd>');
        rows.push('<dt>상태</dt><dd>'+CERT_ST[ct._st].label+(ct._dday!=null?' ('+ddayTx(ct)+')':'')+'</dd>');
      }
      return '<span class="bLead">'+esc(o.name)+' KC 현황</span>'+botCard(o)+'<dl class="bDl">'+rows.join('')+'</dl>'
        + (!ct?'<span class="bWarn">인증서 관리대장에서 이 KC 번호를 찾지 못했습니다. 대장 등록 여부를 확인해 주세요.</span>':'');
    }
    if(hit.length>1 && !askList) return '<span class="bLead">'+hit.length+'건이 검색됩니다</span>어느 상품인지 골라주세요.'+botList(hit);
  }

  /* 만료 임박 목록 */
  var months = e.months || 3;
  if(/만료된|만료됐|지난|경과/.test(e.lq)){
    var exp=cert.list.filter(function(c){ return c._st==='expired'; })
      .sort(function(a,b){ return b._exp-a._exp; });
    if(!exp.length) return '만료된 인증서가 없습니다.';
    var h0='<span class="bLead">이미 만료된 인증서 '+exp.length+'건</span>'
      +'<table class="bTbl"><thead><tr><th>KC 번호</th><th>시리즈</th><th>만료일</th></tr></thead><tbody>';
    exp.slice(0,e.topN||12).forEach(function(c){
      h0+='<tr><td>'+esc(c.kcno)+'</td><td>'+esc(String(c.series||'—').slice(0,18))+'</td><td>'+fmtD(c._exp)+'</td></tr>';
    });
    return h0+'</tbody></table>'+(exp.length>(e.topN||12)?'<span class="bNote">'+(e.topN||12)+'건만 표시했습니다.</span>':'');
  }

  var days = months*30;
  var soon = cert.list.filter(function(c){ return c._dday!=null && c._dday>=0 && c._dday<=days; })
    .sort(function(a,b){ return a._dday-b._dday; });
  if(!soon.length) return '<span class="bLead">'+months+'개월 내 만료 예정 없음</span>해당 기간에 만료되는 인증서가 없습니다.';

  var h='<span class="bLead">'+months+'개월 내 만료 예정 '+soon.length+'건</span>'
    +'<table class="bTbl"><thead><tr><th>KC 번호</th><th>시리즈</th><th>만료일</th><th class="num">D-day</th></tr></thead><tbody>';
  soon.slice(0,e.topN||12).forEach(function(c){
    var col=c._dday<=30?'var(--red)':(c._dday<=60?'var(--amber-tx)':'var(--ink-2)');
    h+='<tr><td>'+esc(c.kcno)+'</td><td>'+esc(String(c.series||'—').slice(0,18))+'</td>'
      +'<td>'+fmtD(c._exp)+'</td>'
      +'<td class="num" style="color:'+col+';font-weight:700">D-'+c._dday+'</td></tr>';
  });
  h+='</tbody></table>';
  if(soon.length>(e.topN||12)) h+='<span class="bNote">임박한 '+(e.topN||12)+'건만 표시했습니다. KC 인증 관리 화면에서 전체를 볼 수 있습니다.</span>';
  return h;
}

/* ---------- 답변: 원가·마진 ---------- */
function botAnsCost(e){
  var hit=botFind(e);
  if(hit.length===1){
    var o=hit[0], ci=costInfo(o), cd=catDetail(o)||{};
    if(!ci) return '<span class="bLead">'+esc(o.name)+'</span>원가 정보가 없습니다. 오더에 매입단가가 등록되어 있지 않습니다.'+botCard(o);
    var sp=cd.sp?Number(String(cd.sp).replace(/[^0-9.]/g,'')):null;
    var rrp=o.rrp?Number(String(o.rrp).replace(/[^0-9.]/g,'')):null;
    var rows=[];
    if(ci.krw!=null) rows.push('<dt>원가</dt><dd>'+bWon(ci.krw)+'</dd>');
    if(ci.usd) rows.push('<dt>매입단가</dt><dd>$'+ci.usd+'</dd>');
    if(ci.rate) rows.push('<dt>적용환율</dt><dd>'+bNum(ci.rate)+'원</dd>');
    rows.push('<dt>출처</dt><dd style="font-weight:400;color:var(--ink-2)">'+esc(ci.src)+'</dd>');
    if(sp) rows.push('<dt>판매가</dt><dd>'+bWon(sp)+'</dd>');
    /* 원가(원)가 없으면 마진을 계산하지 않는다.
       null 을 그대로 빼면 마진율이 100%로 나와 완전히 잘못된 숫자가 된다. */
    if(sp && ci.krw!=null){
      var m=sp-ci.krw;
      rows.push('<dt>마진액</dt><dd style="color:'+(m>0?'var(--g700)':'var(--red)')+'">'+bWon(m)+'</dd>');
      rows.push('<dt>마진율</dt><dd style="color:'+(m>0?'var(--g700)':'var(--red)')+'">'+(m/sp*100).toFixed(1)+'%</dd>');
    }
    if(rrp) rows.push('<dt>소비자가</dt><dd>'+bWon(rrp)+'</dd>');
    var warn='';
    if(ci.krw==null) warn='<span class="bWarn">환율을 아직 받지 못해 원화 원가를 계산하지 못했습니다. 잠시 후 다시 물어봐 주세요.</span>';
    else if(!sp) warn='<span class="bNote">판매가가 없어 마진은 계산하지 못했습니다.</span>';
    else if(ci.kind==='stock') warn='<span class="bNote">오더 매입단가가 없어 재고DB 평가액을 원가로 썼습니다. 실제 매입원가와 차이가 클 수 있습니다.</span>';
    return '<span class="bLead">'+esc(o.name)+' 원가·마진</span>'+botCard(o)+'<dl class="bDl">'+rows.join('')+'</dl>'+warn;
  }
  if(hit.length>1){
    var arr=hit.slice(0,400).map(function(o){
      var ci=costInfo(o), cd=catDetail(o)||{};
      var sp=cd.sp?Number(String(cd.sp).replace(/[^0-9.]/g,'')):null;
      var mr=(ci&&ci.krw!=null&&sp)?((sp-ci.krw)/sp*100):null;
      return {o:o,cost:(ci&&ci.krw!=null)?ci.krw:null,sp:sp,mr:mr};
    }).filter(function(x){return x.cost!=null});
    if(!arr.length) return '<span class="bLead">원가 정보 없음</span>검색된 '+hit.length+'건 모두 오더에 매입단가가 등록되어 있지 않습니다.';
    arr.sort(function(a,b){ return (a.mr==null?999:a.mr)-(b.mr==null?999:b.mr); });
    var h='<span class="bLead">'+(e.brand?esc(e.brand)+' ':'')+'원가·마진 '+arr.length+'건</span>'
      +'<span class="bNote">마진율 낮은 순'+(hit.length>arr.length?' · 검색 '+hit.length+'건 중 원가가 있는 '+arr.length+'건':'')+'</span>'
      +'<table class="bTbl"><thead><tr><th>상품</th><th class="num">원가</th><th class="num">판매가</th><th class="num">마진율</th></tr></thead><tbody>';
    arr.slice(0,e.topN||10).forEach(function(x){
      h+='<tr><td>'+esc(String(x.o.name||'—').slice(0,22))+'</td>'
        +'<td class="num">'+bNum(x.cost)+'</td>'
        +'<td class="num">'+(x.sp?bNum(x.sp):'—')+'</td>'
        +'<td class="num" style="'+(x.mr!=null&&x.mr<20?'color:var(--red);font-weight:700':'')+'">'+(x.mr!=null?x.mr.toFixed(1)+'%':'—')+'</td></tr>';
    });
    return h+'</tbody></table>';
  }
  return '<span class="bLead">어느 상품의 원가인가요?</span>바코드·ITEM#·상품명을 알려주시면 원가와 마진을 계산해 드립니다.'
    + botChips(['3467452081877 원가','마조렛 마진','FUNKO 원가']);
}

/* ---------- 답변: 매출 ---------- */
/* 포털이 이미 불러와 여러 페이지(판매 분석·브랜드 현황·대시보드)에서 쓰고 있는
   hy.agg(재고/발주 DB 집계)를 그대로 재사용한다 — 새 시트 연결 없이도
   "이번달 매출", "마조렛 매출", "매출 TOP 5 브랜드" 같은 질문에 정확한 숫자로 답할 수 있다. */
function botAnsSales(e){
  if(hy.status!=='ok'||!hy.agg){
    return '매출 데이터를 아직 불러오는 중입니다. 잠시 후 다시 물어봐 주세요.'+botPendNote();
  }
  var a=hy.agg;
  var allYM=Object.keys(a.mrev).sort();
  if(!allYM.length) return '<span class="bLead">판매 데이터가 없습니다</span>';

  function chTotal(map,y){ var o=(map||{})[y]||{},s=0; Object.keys(o).forEach(function(c){ s+=Math.max(0,o[c]||0); }); return s; }

  var ym = (e.ym && a.mrev[e.ym]!==undefined) ? e.ym : allYM[allYM.length-1];
  var wantTop = e.topN>0 || /top|상위|순위|랭킹/i.test(e.lq);

  /* 브랜드 매출 TOP N */
  if(wantTop && !e.brand){
    var M=brandMetrics([]);
    var names=Object.keys(M.by).filter(function(b){return M.by[b].rev>0})
      .sort(function(x,y){return M.by[y].rev-M.by[x].rev});
    if(!names.length) return '<span class="bLead">브랜드별 매출 데이터가 없습니다</span>';
    var n=e.topN>0?Math.min(e.topN,names.length):5;
    var top=names.slice(0,n);
    var rows=top.map(function(b,i){
      return '<tr><td class="num" style="color:var(--ink-3)">'+(i+1)+'</td><td>'+esc(b)+'</td>'
        +'<td class="num" style="font-weight:700">'+fmtKR(M.by[b].rev)+'</td></tr>';
    }).join('');
    return '<span class="bLead">최근 12개월 매출 TOP '+n+'</span>'
      +'<div class="tblWrap"><table class="tbl"><thead><tr><th>#</th><th>브랜드</th><th class="num">매출</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
      +'<span class="bNote">채널별·품목별 상세는 [브랜드 현황] 메뉴에서 볼 수 있어요.</span>';
  }

  /* 특정 브랜드 매출 */
  if(e.brand){
    var brRev=(a.brandMrev[e.brand]||{})[ym]||0;
    var brQty=(a.brandQty[e.brand]||{})[ym]||0;
    var idx=allYM.indexOf(ym);
    var prevYM=idx>0?allYM[idx-1]:null;
    var prevRev=prevYM?((a.brandMrev[e.brand]||{})[prevYM]||0):0;
    var mom=prevRev?Math.round((brRev-prevRev)/prevRev*100):null;
    return '<span class="bLead">'+esc(e.brand)+' · '+fmtYM(ym)+' 매출</span>'
      +'<dl class="bDl"><dt>매출</dt><dd>'+fmtKR(brRev)+'</dd>'
      +'<dt>판매수량</dt><dd>'+bNum(brQty)+'개</dd>'
      +(mom!=null?'<dt>전월 대비</dt><dd style="color:'+(mom>=0?'var(--g700)':'var(--red)')+';font-weight:700">'+(mom>=0?'▲':'▼')+Math.abs(mom)+'%</dd>':'')
      +'</dl>';
  }

  /* 전체 매출 (해당 월) */
  var rev=chTotal(a.mrev,ym), qty=chTotal(a.mqtyCh,ym);
  var idx2=allYM.indexOf(ym);
  var prevYM2=idx2>0?allYM[idx2-1]:null;
  var prevRev2=prevYM2?chTotal(a.mrev,prevYM2):0;
  var mom2=prevRev2?Math.round((rev-prevRev2)/prevRev2*100):null;
  var yoyYM=(parseInt(ym.slice(0,4),10)-1)+ym.slice(4);
  var yoyRev=a.mrev[yoyYM]?chTotal(a.mrev,yoyYM):0;
  var yoy=yoyRev?Math.round((rev-yoyRev)/yoyRev*100):null;

  return '<span class="bLead">'+fmtYM(ym)+' 매출</span>'
    +'<dl class="bDl"><dt>매출</dt><dd>'+fmtKR(rev)+'</dd>'
    +'<dt>판매수량</dt><dd>'+bNum(qty)+'개</dd>'
    +(mom2!=null?'<dt>전월 대비</dt><dd style="color:'+(mom2>=0?'var(--g700)':'var(--red)')+';font-weight:700">'+(mom2>=0?'▲':'▼')+Math.abs(mom2)+'%</dd>':'')
    +(yoy!=null?'<dt>전년 동월 대비</dt><dd style="color:'+(yoy>=0?'var(--g700)':'var(--red)')+';font-weight:700">'+(yoy>=0?'▲':'▼')+Math.abs(yoy)+'%</dd>':'')
    +'</dl>'
    +'<span class="bNote">채널별·품목별 상세 내역은 [판매 분석] 메뉴에서 확인하실 수 있어요.</span>';
}

/* ---------- 답변: 분석 ---------- */
function botAnsAnalysis(e){
  ensureAllYears();
  var all=[];
  YEARS.forEach(function(y){ (state.data[y]||[]).forEach(function(r){ r._sy=r._sy||y; all.push(r); }); });
  if(!all.length) return '오더 데이터를 불러오는 중입니다. 잠시 후 다시 물어봐 주세요.';

  /* 브랜드별 발주액 */
  if(/브랜드/.test(e.lq)||(!e.brand&&/(top|상위|순위|랭킹|많은|가장|제일)/i.test(e.lq))){
    var by={};
    all.forEach(function(r){
      if(e.ym && parseYM(r.od||r.im)!==e.ym) return;
      var b=normBrand(r.br);
      var o=by[b]=by[b]||{amt:0,qty:0,cnt:0};
      o.amt+=amtNum(r.amt); o.qty+=amtNum(r.qty); o.cnt++;
    });
    var arr=Object.keys(by).map(function(b){return {b:b,v:by[b]}})
      .filter(function(x){return x.v.amt>0})
      .sort(function(a,b){return b.v.amt-a.v.amt});
    if(!arr.length) return '해당 기간 발주 데이터가 없습니다.';
    var tot=arr.reduce(function(s,x){return s+x.v.amt},0);
    var h='<span class="bLead">브랜드별 발주액'+(e.ym?' · '+fmtYM(e.ym):' · 3개년 누적')+'</span>'
      +'합계 <b>'+fmtUSD(tot)+'</b>'
      +'<table class="bTbl"><thead><tr><th>브랜드</th><th class="num">발주액</th><th class="num">비중</th><th class="num">건수</th></tr></thead><tbody>';
    arr.slice(0,e.topN||10).forEach(function(x){
      h+='<tr><td>'+esc(x.b)+'</td><td class="num">'+fmtUSD(x.v.amt)+'</td>'
        +'<td class="num">'+(x.v.amt/tot*100).toFixed(1)+'%</td>'
        +'<td class="num">'+x.v.cnt+'</td></tr>';
    });
    return h+'</tbody></table>';
  }

  /* 기간·브랜드 발주 합계 + 전월 대비 */
  var ym=e.ym||nowYM();
  var cur=all.filter(function(r){ return parseYM(r.od||r.im)===ym && (!e.brand||normBrand(r.br)===e.brand); });
  var pd=ym.split('-'); var pdt=new Date(parseInt(pd[0],10),parseInt(pd[1],10)-1,1);
  pdt.setDate(1); pdt.setMonth(pdt.getMonth()-1);
  var pym=pdt.getFullYear()+'-'+String(pdt.getMonth()+1).padStart(2,'0');
  var prev=all.filter(function(r){ return parseYM(r.od||r.im)===pym && (!e.brand||normBrand(r.br)===e.brand); });

  var ca=cur.reduce(function(s,r){return s+amtNum(r.amt)},0);
  var pa=prev.reduce(function(s,r){return s+amtNum(r.amt)},0);
  var diff=pa?((ca-pa)/pa*100):null;

  return '<span class="bLead">'+fmtYM(ym)+(e.brand?' · '+esc(e.brand):'')+' 발주 요약</span>'
    +'<dl class="bDl"><dt>발주 건수</dt><dd>'+cur.length+'건</dd>'
    +'<dt>수량</dt><dd>'+bNum(cur.reduce(function(s,r){return s+amtNum(r.qty)},0))+'개</dd>'
    +'<dt>발주액</dt><dd>'+fmtUSD(ca)+'</dd>'
    +'<dt>'+fmtYM(pym)+'</dt><dd>'+fmtUSD(pa)+'</dd>'
    +'<dt>전월 대비</dt><dd style="color:'+(diff==null?'var(--ink-3)':(diff>0?'var(--g700)':'var(--red)'))+'">'+(diff==null?'—':bPct(diff))+'</dd></dl>'
    + botChips(['브랜드별 발주액 TOP 10','지난달 발주','지연 오더']);
}

/* ---------- 대화 기억 유틸 ---------- */
var BOT_NAME_BLACKLIST=['사람','완전','진짜','정말','바보','장난','농담','회사원','직원','그냥','원래','오늘','내일','너무','저도','저는','나는','제가','내가'];
function botExtractName(raw){
  var m = String(raw||'').match(/(?:저는|나는|난)\s*([가-힣]{2,4}?)(?:이야|야|입니다|이에요|예요|(?:이)?라고\s*해)/);
  if(!m) m = String(raw||'').match(/내\s*이름(?:은|이)\s*([가-힣]{2,4}?)(?:이야|야|이에요|예요|입니다|(?:이)?라고\s*해|[.,!?]|\s|$)/);
  var nm=m?m[1]:'';
  if(nm && BOT_NAME_BLACKLIST.indexOf(nm)!==-1) return '';
  return nm;
}
var TITLE_WORDS=['사원','주임','대리','과장','차장','부장','팀장','이사','대표','인턴','매니저','MD','팀원','프로','책임'];
function botExtractIdentity(raw){
  var q=String(raw||''), out={};
  var mt=q.match(/([가-힣A-Za-z0-9]{2,10}팀)/);
  if(mt) out.team=mt[1];
  for(var i=0;i<TITLE_WORDS.length;i++){
    if(q.indexOf(TITLE_WORDS[i])!==-1){ out.title=TITLE_WORDS[i]; break; }
  }
  var stripped=q;
  if(out.team)  stripped=stripped.split(out.team).join(' ');
  if(out.title) stripped=stripped.split(out.title).join(' ');
  /* "김민수입니다" 처럼 이름에 어미가 그대로 붙어 있으면 길이 필터에 걸려
     통째로 버려지므로, 흔한 자기소개 어미·1인칭 대명사를 먼저 떼어낸다 */
  stripped=stripped.replace(/저는|나는|제가|내가|입니다|이에요|예요|이야|라고\s*해/g,' ');
  var toks=stripped.replace(/[^가-힣\s]/g,' ').split(/\s+/).filter(Boolean);
  for(var j=0;j<toks.length;j++){
    var t=toks[j];
    if(t.length>=2&&t.length<=4&&BOT_STOP.indexOf(t)===-1&&BOT_NAME_BLACKLIST.indexOf(t)===-1&&!botIsNoise(t)){ out.name=t; break; }
  }
  return out;
}
function botPlainText(html){

/* 같은 카테고리 답을 연달아 반복하지 않도록 직전에 골랐던 문구는 피한다 */
function botPickVariant(k,list){
  if(!list||!list.length) return '';
  if(list.length===1) return list[0];
  var last=bot.mem.lastPick[k];
  var pool=list.filter(function(t){return t!==last;});
  if(!pool.length) pool=list;
  var pick=pool[Math.floor(Math.random()*pool.length)];
  bot.mem.lastPick[k]=pick;
  return pick;
}

function botCasualMatch(raw){
  for(var i=0;i<BOT_CASUAL.length;i++){
    if(BOT_CASUAL[i].re.test(raw)) return BOT_CASUAL[i];
  }
  return null;
}
function botAnsCasual(e){
  var m=e._casual, txt;
  if(m&&m.fn) txt=m.fn(e);
  else if(m&&m.res&&m.res.length) txt=botPickVariant(m.k,m.res);
  else txt='음... 잘 이해하지 못했어요. "도움말"을 눌러보시겠어요? 🧸';
  if(bot.mem.name && m && (m.k==='greet'||m.k==='bye'||m.k==='thanks')) txt=botDisplayName(bot.mem.name)+'님, '+txt;
  return '<span class="bLead">'+esc(txt)+'</span>';
}

/* AI(자유 대화) 경로 실패 시 되돌아갈 규칙 기반 대답 —
   분위기용 잡담이면 기존 BOT_CASUAL 응답을, 완전히 못 알아들은 문장이면 도움말을 쓴다. */
function botAiFallback(e){
  return (e._casual) ? botAnsCasual(e) : botAnsHelp();
}
function botAnswerAsync(q){
  /* 직전 답변이 애매해서 "어떤 걸 물으신 건가요?"라고 되물은 상태였다면, 이번 입력이
     그 선택지 중 하나를 고른 건지 먼저 본다. 맞으면 원래 질문 + 확정된 카테고리로
     바로 정확한 답을 주고, 아니면(다른 걸 새로 물어본 것) 되묻기는 취소하고 이번
     입력을 그냥 새 질문으로 정상 처리한다 — 사용자가 막히지 않도록. */
  var forcedKey='', forcedQ=q;
  if(bot._pendingClarify){
    var pend=bot._pendingClarify; bot._pendingClarify=null;
    var picked=pend.options.filter(function(o){ return o.label===String(q||'').trim(); })[0];
    if(picked){ forcedKey=picked.key; forcedQ=pend.q; }
  }
  var e=botExtract(forcedQ);
  var k=forcedKey||botClassify(e);
  bot._ctx={};

  /* 신원(이름·소속팀·직함)을 물어본 직후라면, 이번 대답에서 그것부터 챙긴다.
     한 번 시도하면 성공하든 실패하든 계속 캐묻지는 않는다. */
  if(bot.mem.awaitingIdentity){
    bot.mem.awaitingIdentity=false;
    /* 업무 질문과 한 문장에 섞여 오면(예: "저는 링크팀 김철수인데 마조렛 재고 알려줘")
       이름 추출이 브랜드명 등을 오인할 위험이 있어, 순수 잡담/도움말성 문장일 때만
       신원 추출을 시도한다. 업무 질문이면 이번엔 건너뛰고 업무 답변을 그대로 준다. */
    /* 진짜 업무 질문인지는 "키워드 점수로 걸렸는지"(_ruleScored)로 판단한다 — 그냥
       바코드·코드 없이 단어 몇 개만 있다고 상품 조회로 넘어가는 약한 폴백까지
       업무 질문 취급하면, "재무팀 박영희입니다" 같은 순수 자기소개 문장도 상품
       조회로 오인해 신원 캡처(+칭찬)가 조용히 씹히는 문제가 생긴다. */
    var busyIntent=!!(forcedKey||e._ruleScored);
    if(!busyIntent){
      var id=botExtractIdentity(q);
      if(id.name||id.team||id.title){
        if(id.name)  bot.mem.name=id.name;
        if(id.team)  bot.mem.team=id.team;
        if(id.title) bot.mem.title=id.title;
        var dispNm=botDisplayName(bot.mem.name);
        var who=[bot.mem.team,bot.mem.title,dispNm].filter(Boolean).join(' ');
        var compliment=botIntroCompliment(esc(dispNm));
        var greetLine = bot.mem.name==='주우태'
          ? '이제부터 알아보고, 최대한 재밌게 모시겠습니다! 무엇을 도와드릴까요?'
          : '이제부터 알아보고 편하게 대해드릴게요. 무엇을 도와드릴까요?';
        var html2=botWootaeBoost('<span class="bLead">'+esc(who||dispNm)+'님, 기억했어요 🧸</span>'
          +compliment+'<br>'+greetLine)
          +botNext(['이번달 입고 예정','발주필요 목록','3개월 내 KC 만료']);
        bot.mem.lastAns=botPlainText(html2).slice(0,160);
        return Promise.resolve(html2);
      }
    }
  }

  try{
    var html;
    switch(k){
      case 'product':  html=botAnsProduct(e);  break;
      case 'stock':    html=botAnsStock(e);    break;
      case 'inbound':  html=botAnsInbound(e);  break;
      case 'kc':       html=botAnsKc(e);       break;
      case 'cost':     html=botAnsCost(e);     break;
      case 'sales':    html=botAnsSales(e);    break;
      case 'analysis': html=botAnsAnalysis(e); break;
      case 'casual':   html=botAnsCasual(e);   break;
      case 'staff':    html=botAnsStaff(e._staff); break;
      case 'clarify':
        /* 애매하게 걸쳐있는 질문 — 짐작해서 틀린 자료를 보여주지 않고, 어떤 업무를
           물으신 건지 먼저 확인한다. 칩을 누르면 그 문구 그대로 다음 질문으로
           들어가고, 위의 되돌아오기 체크에서 원래 질문 + 확정된 카테고리로 이어진다. */
        var opts=e._ambigCats.map(function(ck){ return {key:ck, label:CAT_CLARIFY[ck]||ck}; });
        bot._pendingClarify={ q:forcedQ, options:opts };
        html='<span class="bLead">어떤 걸 여쭤보신 건지 확인할게요</span>아래 중에 골라주시면 정확히 찾아드릴게요.'
          + botChips(opts.map(function(o){ return o.label; }));
        break;
      case 'ai':
        /* 정해진 정답이 없는 자유 대화 — 먼저 관리자가 등록해둔 지식 소스(구글시트)에
           원본 값이 있는지 찾아보고, 없으면 실제 Claude API로 넘긴다.
           둘 다 실패하면(키 미설정·쿼터 초과·네트워크 오류) 조용히 기존 규칙 답변으로 돌아간다. */
        return botKsSearch(q).then(function(d){
          if(d.matches&&d.matches.length){
            var ksHtml=botKsRender(d,q);
            bot.mem.lastAns=botPlainText(ksHtml).slice(0,160);
            return botWootaeBoost(ksHtml);
          }
          throw new Error('no ks match');
        }).catch(function(){
          return botAiChat(q).then(function(reply){
            var out='<span class="bLead">'+esc(reply)+'</span>';
            bot.mem.lastAns=botPlainText(out).slice(0,160);
            return botWootaeBoost(out);
          }).catch(function(){
            var fb=botAiFallback(e);
            bot.mem.lastAns=botPlainText(fb).slice(0,160);
            return botWootaeBoost(fb);
          });
        });
      default:         return Promise.resolve(botAnsHelp());
    }
    /* 상품 조회인데 한 건도 못 찾았으면(e._zeroHit) 딱딱한 안내 대신
       먼저 등록된 지식 소스에서 찾아보고, 없으면 AI로 한 번 더 자연스럽게
       되물어보도록 시도하고, 그마저 실패하면 기존 "찾지 못했습니다"로 되돌아간다. */
    if(k==='product' && e._zeroHit){
      return botKsSearch(q).then(function(d){
        if(d.matches&&d.matches.length){
          var ksHtml=botKsRender(d,q);
          bot.mem.lastAns=botPlainText(ksHtml).slice(0,160);
          return botWootaeBoost(ksHtml);
        }
        throw new Error('no ks match');
      }).catch(function(){
        return botAiChat(q).then(function(reply){
          var out='<span class="bLead">'+esc(reply)+'</span>';
          bot.mem.lastAns=botPlainText(out).slice(0,160);
          return botWootaeBoost(out);
        }).catch(function(){
          bot.mem.lastAns=botPlainText(html).slice(0,160);
          return botWootaeBoost(html);
        });
      });
    }
    var isRecall = (k==='casual' && e._casual && (e._casual.k==='recall'||e._casual.k==='clarify'));
    if(!isRecall) bot.mem.lastAns=botPlainText(html).slice(0,160);
    return Promise.resolve(botWootaeBoost(html));
  }catch(err){
    return Promise.resolve('<span class="bLead">답변을 만들지 못했습니다</span>'
      +'<span class="bWarn">'+esc(String(err&&err.message||err))+'</span>'
      +'<span class="bNote">질문을 조금 다르게 표현해 보시거나, 아래 예시를 눌러보세요.</span>'
      + botChips(['도움말','마조렛 재고','3개월 내 KC 만료']));
  }
}

function botPush(who,html){
  bot.msgs.push({who:who,html:html});
  var b=document.getElementById('botBody');
  if(!b)return;
  var d=document.createElement('div');
  if(who==='me'){
    d.className='bMsg me';
    d.textContent=html;              /* 사용자 입력은 텍스트로만 — HTML 실행 안 됨 */
  }else{
    d.className='bRow';
    var av=document.createElement('img');
    av.className='bAvS'; av.src=GARSON_IMG; av.alt='갈슨';
    var bubble=document.createElement('div');
    bubble.className='bMsg ai';
    bubble.innerHTML=html;
    d.appendChild(av); d.appendChild(bubble);
  }
  b.appendChild(d);
  b.scrollTop=b.scrollHeight;
  if(who!=='me') refreshIcons();
}
function botTyping(on){
  var b=document.getElementById('botBody');
  if(!b)return;
  var old=b.querySelector('.typing');
  if(old)old.remove();
  if(!on)return;
  var d=document.createElement('div');
  d.className='bRow typing';
  d.innerHTML='<img class="bAvS" src="'+GARSON_IMG+'" alt="갈슨">'
    +'<div class="bMsg ai"><div class="bTyping"><i></i><i></i><i></i></div></div>';
  b.appendChild(d);
  b.scrollTop=b.scrollHeight;
}
function botAsk(q){
  q=String(q||'').trim();
  if(!q)return;
  botPush('me',q);
  botHistPush('user',q);
  botTyping(true);
  setTimeout(function(){
    botAnswerAsync(q).then(function(html){
      botTyping(false);
      botHistPush('ai', botPlainText(html).slice(0,160));
      botPush('ai', html);
    }).catch(function(err){
      botTyping(false);
      botPush('ai', '<span class="bLead">답변을 만들지 못했습니다</span>'
        +'<span class="bWarn">'+esc(String(err&&err.message||err))+'</span>');
    });
  },260);
}

function botKsMsg(t,isErr){
  var m=document.getElementById('botKsMsg');
  if(!m)return;
  m.textContent=t||'';
  m.style.color=isErr?'var(--gs-red-d)':'';
}
function botKsLoadList(){
  var list=document.getElementById('botKsList');
  if(!list)return;
  list.innerHTML='<div class="empty" style="padding:14px">불러오는 중…</div>';
  jsonp({action:'ksList'}).then(function(d){
    if(!d||!d.ok) throw new Error((d&&d.error)||'목록을 불러오지 못했습니다');
    if(!d.sources.length){ list.innerHTML='<div class="empty" style="padding:14px">등록된 지식 소스가 아직 없어요.</div>'; return; }
    list.innerHTML=d.sources.map(function(s){
      return '<div class="botKsRow"><div class="n"><b>'+esc(s.label)+'</b><span>'+esc(s.tab)+' · '+esc(s.addedAt||'')+'</span></div>'
        +'<button data-ksdel="'+esc(s.id)+'">삭제</button></div>';
    }).join('');
  }).catch(function(e){
    list.innerHTML='<div class="empty" style="padding:14px">'+esc(String(e.message||e))+'</div>';
  });
}
function botKsInitPanel(){
  var openBtn=document.getElementById('botKsOpen'), closeBtn=document.getElementById('botKsClose'), panel=document.getElementById('botKsPanel');
  var addBtn=document.getElementById('botKsAdd');
  var list=document.getElementById('botKsList');
  if(!openBtn||!panel)return;
  openBtn.addEventListener('click',function(){ panel.classList.add('on'); botKsMsg(''); botKsLoadList(); });
  if(closeBtn)closeBtn.addEventListener('click',function(){ panel.classList.remove('on'); });
  if(addBtn)addBtn.addEventListener('click',function(){
    var label=document.getElementById('botKsLabel').value.trim();
    var url=document.getElementById('botKsUrl').value.trim();
    var tab=document.getElementById('botKsTab').value.trim();
    if(!label||!url||!tab){ botKsMsg('라벨 · 시트 URL · 탭 이름을 모두 입력해주세요',true); return; }
    addBtn.disabled=true; botKsMsg('등록 중…');
    jsonp({action:'ksAdd',label:label,sheetId:url,tab:tab}).then(function(d){
      addBtn.disabled=false;
      if(!d||!d.ok){ botKsMsg((d&&d.error)||'등록 실패',true); return; }
      botKsMsg('등록했어요 — 이제 이 자료로도 답할 수 있어요 🧸');
      document.getElementById('botKsLabel').value='';
      document.getElementById('botKsUrl').value='';
      document.getElementById('botKsTab').value='';
      botKsLoadList();
    }).catch(function(e){ addBtn.disabled=false; botKsMsg(String(e.message||e),true); });
  });
  if(list)list.addEventListener('click',function(ev){
    var btn=ev.target.closest('[data-ksdel]');
    if(!btn)return;
    var id=btn.dataset.ksdel;
    btn.disabled=true; btn.textContent='삭제 중…';
    jsonp({action:'ksRemove',id:id}).then(function(d){
      if(!d||!d.ok){ botKsMsg((d&&d.error)||'삭제 실패',true); btn.disabled=false; btn.textContent='삭제'; return; }
      botKsLoadList();
    }).catch(function(e){ botKsMsg(String(e.message||e),true); btn.disabled=false; btn.textContent='삭제'; });
  });
}

function initBot(){
  if(bot.inited)return;
  bot.inited=true;
  var fab=document.getElementById('botFab');
  var cls=document.getElementById('botClose');
  var snd=document.getElementById('botSend');
  var ta=document.getElementById('botQ');
  var body=document.getElementById('botBody');
  if(!fab||!ta)return;

  fab.addEventListener('click',function(){ botToggle(true); });
  if(cls)cls.addEventListener('click',function(){ botToggle(false); });
  botKsInitPanel();

  /* 말풍선 — 처음 오신 분께 갈슨 존재를 한 번 알려준다. 이미 봤거나 챗봇을 한 번이라도
     열어본 적 있으면(gaia_garsonhint_seen) 다시 안 띄운다. */
  var hint=document.getElementById('botHint'), hintX=document.getElementById('botHintX');
  var hintSeen=false; try{ hintSeen = localStorage.getItem('gaia_garsonhint_seen')==='1'; }catch(e){}
  if(hint&&!hintSeen){
    setTimeout(function(){ if(!bot.msgs.length) hint.classList.add('show'); },1600);
  }
  if(hintX)hintX.addEventListener('click',function(ev){ ev.stopPropagation(); botHideHint(); });
  if(snd)snd.addEventListener('click',function(){ var v=ta.value; ta.value=''; ta.style.height='auto'; botAsk(v); });
  ta.addEventListener('keydown',function(ev){
    if(ev.key==='Enter'&&!ev.shiftKey){ ev.preventDefault(); var v=ta.value; ta.value=''; ta.style.height='auto'; botAsk(v); }
  });
  ta.addEventListener('input',function(){ ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,96)+'px'; });

  /* 추천 칩 · 상품 카드 클릭 (위임) */
  if(body)body.addEventListener('click',function(ev){
    var chip=ev.target.closest('[data-bq]');
    if(chip){ botAsk(chip.dataset.bq); return; }
    var card=ev.target.closest('[data-bopen]');
    if(card){
      var bc=card.dataset.bopen;
      if(!bc)return;
      for(var i=0;i<ms.list.length;i++){
        if(normBc(ms.list[i].bc)===bc){ botToggle(false); openMasterPanel(i); return; }
      }
      alert('상품 상세를 찾지 못했습니다.');
    }
  });

  document.addEventListener('keydown',function(ev){
    if(ev.key==='Escape'){
      var w=document.getElementById('botWrap');
      if(w&&w.classList.contains('on')&&!document.getElementById('panel').classList.contains('on')) botToggle(false);
    }
  });
}

/* ================= 시작 ================= */
initCat();initKn();buildYearSeg();renderSideInfo();initBot();refreshIcons();
var _bh0=document.getElementById('brandHome'); if(_bh0)_bh0.classList.add('atHome');
[fetchHayoung,fetchMaster,fetchStock,fetchCert,fetchExtra,fetchFx,fetchWx,fetchPcat].forEach(function(fn){
  try{ fn(); }catch(e){ console.warn('init',fn.name,e); }
});
loadYear(state.year).then(render);
</script>
