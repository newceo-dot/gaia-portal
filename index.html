<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAIA MD 운영포털</title>
<link rel="icon" type="image/svg+xml" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect width="40" height="40" rx="9" fill="%230B3D2C"/><circle cx="20" cy="20" r="11.5" stroke="%2357B08A" stroke-width="2.6" fill="none"/><path d="M26 20a6 6 0 1 1-2.6-4.95" stroke="%23fff" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M20 20h6" stroke="%23fff" stroke-width="3" stroke-linecap="round"/></svg>'>
<link rel="apple-touch-icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><rect width="40" height="40" rx="9" fill="%230B3D2C"/><circle cx="20" cy="20" r="11.5" stroke="%2357B08A" stroke-width="2.6" fill="none"/><path d="M26 20a6 6 0 1 1-2.6-4.95" stroke="%23fff" stroke-width="3" stroke-linecap="round" fill="none"/><path d="M20 20h6" stroke="%23fff" stroke-width="3" stroke-linecap="round"/></svg>'>
<meta name="theme-color" content="#0B3D2C">
<meta name="apple-mobile-web-app-title" content="GAIA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --g900:#0B3D2C; --g700:#14603F; --g600:#1B7A4F; --g500:#2E9367; --g400:#57B08A;
  --g200:#A9DCC3; --g100:#DFF3E8; --g50:#F0F9F4;
  --amber:#E0A030; --amber-bg:#FCF3E2; --amber-tx:#8C6111;
  --red:#CF3B3B; --red-bg:#FCEDED; --red-tx:#9B2626;
  --blue:#4A72C4; --blue-bg:#EDF1FA; --blue-tx:#33559B;
  --slate:#8A8F9A; --slate-bg:#F1F2F4; --slate-tx:#5B6069;
  --bg:#F4F5F4; --card:#FFFFFF; --ink:#12181A; --ink-2:#616B6E; --ink-3:#9AA3A6;
  --line:#EDEFEE; --line-2:#E2E6E4; --hover:#F7F8F7; --hatch:#E9ECEA;
  --ok-bg:var(--g100); --ok-tx:var(--g700);
  --fs:14px; --side-w:238px; --r:18px; --r-sm:12px;
  --sh:0 1px 2px rgba(16,24,20,.04);
  --sh-md:0 6px 20px rgba(16,24,20,.07);
}
body.meeting{ --fs:17px; --side-w:74px; }
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:var(--fs)}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
select,input{font-family:inherit;font-size:.92rem;color:var(--ink)}
a{color:inherit;text-decoration:none}
svg.lucide{width:1.05em;height:1.05em;stroke-width:1.9;flex:none;vertical-align:-2px}

#shell{display:flex;min-height:100vh;padding:10px;gap:10px}
/* ---------- 사이드바 ---------- */
#side{width:var(--side-w);min-width:var(--side-w);background:var(--card);border-radius:22px;padding:20px 12px;display:flex;flex-direction:column;position:sticky;top:10px;height:calc(100vh - 20px);transition:width .2s,min-width .2s;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 20px;white-space:nowrap;cursor:pointer;
  border-radius:12px;transition:opacity .15s var(--ease),transform .15s var(--spring)}
.brand:hover{opacity:.75}
.brand.atHome{background:var(--g50)}
.brand:active{transform:scale(.96)}
.brand .mark{width:34px;height:34px;flex:none}
.brand b{font-size:1.15rem;font-weight:800;letter-spacing:-.02em}
#nav{flex:1;overflow-y:auto;margin:0 -12px;padding:0 12px}
#nav::-webkit-scrollbar{width:0}
.nav-label{font-size:.84rem;letter-spacing:.01em;color:var(--g900);font-weight:800;padding:20px 12px 9px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.nav-label::after{content:'';flex:1;height:1px;background:var(--line)}
.nav-label:first-child{padding-top:6px}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:10px 12px;border-radius:11px;font-size:.9rem;font-weight:500;color:var(--ink-2);white-space:nowrap;margin-bottom:2px;position:relative}
.nav-item:hover{background:var(--hover);color:var(--ink)}
.nav-item.on{background:var(--g50);color:var(--g900);font-weight:700}
.nav-item.on::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--g600)}
.nav-item.on svg{color:var(--g600)}
.nav-item.off{opacity:.4;cursor:default}
.nav-item .cnt{margin-left:auto;font-size:.68rem;font-weight:700;background:var(--g100);color:var(--g700);border-radius:99px;padding:2px 8px}
.nav-item .cnt.hot{background:var(--red-bg);color:var(--red-tx)}
.nav-item.sub{padding-left:36px;font-size:.84rem}
.sideInfo{margin-top:12px;background:var(--card);border:1px solid var(--line-2);border-radius:14px;overflow:hidden}
.siTop{padding:10px 12px 0}
.siDate{font-size:.72rem;font-weight:700;color:var(--ink-3)}
.siWx{display:flex;align-items:baseline;gap:6px;padding:2px 12px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.siWx svg{color:var(--g600);width:1em;height:1em;align-self:center}
.siWx b{font-size:1.12rem;font-weight:800;letter-spacing:-.02em;color:var(--ink)}
.siWx span{font-size:.72rem;color:var(--ink-2)}
.siWx em{font-style:normal;font-size:.66rem;color:var(--ink-3);margin-left:auto}
.siWx.dim{color:var(--ink-3);font-size:.72rem}
.fxCard{padding:0 0 8px}
.fxHd{font-size:.71rem;font-weight:800;color:var(--ink-2);background:var(--hover);padding:7px 12px;border-bottom:1px solid var(--line)}
.fxMainRow{padding:10px 12px 9px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.fxMainTx{flex:1;min-width:0}
.fxFlagC{width:30px;height:30px;border-radius:50%;border:1px solid var(--line-2);flex:none;overflow:hidden;
  display:block;background:#fff}
.fxFlagC svg{width:100%;height:100%;display:block}
.fxFlagC.sm{width:24px;height:24px}
.fxMainNm{display:block;font-size:.72rem;font-weight:700;color:var(--ink-2);margin-bottom:1px}
.fxMainVal{display:flex;align-items:baseline;gap:6px;font-size:1.22rem;font-weight:800;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--red)}
.fxMainVal i{font-style:normal;font-size:.56em;font-weight:700}
.fxMainVal em{margin-left:auto;font-style:normal;font-size:.55em;font-weight:800}
.fxRows{display:flex;flex-direction:column}
.fxLine{display:flex;align-items:center;gap:6px;padding:7px 12px;font-size:.74rem}
.fxLine+.fxLine{border-top:1px solid var(--line)}
.fxLine .nm{color:var(--ink-2);font-weight:700;white-space:nowrap;display:flex;align-items:baseline;gap:2px}
.fxLine .nm i{font-style:normal;font-size:.85em;color:var(--ink-3);font-weight:600}
.fxLine .vl{margin-left:auto;display:flex;align-items:baseline;gap:5px;font-weight:800;
  font-variant-numeric:tabular-nums;color:var(--red);white-space:nowrap}
.fxLine .vl i{font-style:normal;font-size:.76em;font-weight:700}
.fxLine .vl em{font-style:normal;font-size:.74em;font-weight:800}
.fxLine.dim{color:var(--ink-3);justify-content:center;padding:16px 12px}
.fxMainVal em.up,.fxLine em.up{color:var(--red)}
.fxMainVal em.dn,.fxLine em.dn{color:#2C6ECB}
.fxMainVal em.flat,.fxLine em.flat{color:var(--ink-3)}
.fxSrc{font-size:.62rem;color:var(--ink-3);padding:8px 12px 2px;text-align:right}

body.meeting .nav-label,body.meeting .nav-item .tx,body.meeting .nav-item .cnt,body.meeting .nav-item .ext,body.meeting .brand b,body.meeting .sideInfo{display:none}

/* ---------- 메인 ---------- */
#main{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
#stickyTop{position:sticky;top:10px;z-index:45}
#topbar{background:var(--card);border-radius:20px;display:flex;align-items:center;gap:10px;padding:11px 16px;
  box-shadow:0 1px 2px rgba(16,24,20,.04)}
.tb-search{flex:1;max-width:400px;display:flex;align-items:center;gap:9px;background:var(--bg);border-radius:12px;padding:9px 14px;color:var(--ink-3)}
.tb-search input{border:none;background:none;outline:none;flex:1;min-width:0}
.yearSeg{display:flex;background:var(--bg);border-radius:12px;padding:3px;margin-left:auto}
.yearSeg button{padding:6px 13px;border-radius:9px;font-size:.84rem;font-weight:700;color:var(--ink-2)}
.yearSeg button.on{background:var(--g600);color:#fff}
.tb-btn{display:flex;align-items:center;gap:6px;padding:9px 12px;border-radius:12px;font-size:.83rem;font-weight:600;color:var(--ink-2);background:var(--bg)}
.tb-btn:hover{background:var(--line)}
.tb-btn.meet.on{background:var(--g900);color:#fff}
#content{flex:1;padding:4px 6px 60px;max-width:1400px;width:100%}
@media(max-width:900px){.tb-btn span{display:none}}

/* ---------- 공통 ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh)}
.page-head{display:flex;align-items:flex-end;gap:14px;margin:6px 0 16px;flex-wrap:wrap}
.page-head h2{font-size:1.75rem;font-weight:800;letter-spacing:-.03em}
.page-head p{font-size:.87rem;color:var(--ink-2);margin-top:5px}
.badge{display:inline-block;padding:4px 11px;border-radius:99px;font-size:.73rem;font-weight:700;white-space:nowrap}
.b-ordered{background:var(--slate-bg);color:var(--slate-tx)}
.b-prod{background:var(--blue-bg);color:var(--blue-tx)}
.b-ship{background:var(--slate-bg);color:var(--slate-tx)}
.b-done{background:var(--g100);color:var(--g700)}
.b-delay{background:var(--red-bg);color:var(--red-tx)}
.b-warn{background:var(--amber-bg);color:var(--amber-tx)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:11px;font-size:.81rem;font-weight:600;color:var(--ink-2);background:var(--card);box-shadow:var(--sh)}
.chip:hover{background:var(--hover)}
.chip.on{background:var(--g900);color:#fff}
.empty{padding:48px 20px;text-align:center;color:var(--ink-3);font-size:.9rem}
.section-head{display:flex;align-items:center;gap:8px;padding:18px 20px 12px}
.section-head h3{font-size:1rem;font-weight:800;letter-spacing:-.01em}
.section-head .sub{margin-left:auto;font-size:.78rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.section-head .lnk{margin-left:auto;font-size:.79rem;color:var(--g600);font-weight:700;cursor:pointer}

/* 메트릭 카드 */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:14px}
.metrics.row6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media(max-width:1180px){.metrics.row6{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:640px){.metrics.row6{grid-template-columns:repeat(2,minmax(0,1fr))}}
.metric{padding:17px 18px;cursor:pointer;position:relative;transition:transform .14s,box-shadow .14s}
.metric:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}
.metric .ml{display:flex;align-items:center;gap:7px;font-size:.81rem;font-weight:600;color:var(--ink-2)}
.metric .ml svg{color:var(--ink-3)}
.metric .arw{position:absolute;top:14px;right:14px;width:26px;height:26px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--ink-2);font-size:.72rem}
.metric .mv{font-size:1.85rem;font-weight:800;letter-spacing:-.03em;margin-top:10px;font-variant-numeric:tabular-nums}
.metrics.row6 .metric .mv{font-size:1.5rem}
body.meeting .metric .mv,body.meeting .metrics.row6 .metric .mv{font-size:2.2rem}
.metric .mv small{font-size:.5em;font-weight:600;color:var(--ink-3);margin-left:2px}
.metric .md{font-size:.74rem;margin-top:9px;color:var(--ink-3);display:inline-flex;align-items:center;gap:5px;background:var(--bg);padding:4px 9px;border-radius:99px}
.metric .md b.up{color:var(--g600)} .metric .md b.dn{color:var(--red-tx)}
.metric.feature{background:var(--g900);color:#fff}
.metric.feature .ml,.metric.feature .ml svg{color:rgba(255,255,255,.72)}
.metric.feature .md{background:rgba(255,255,255,.1);color:rgba(255,255,255,.75)}
.metric.feature .md b.up{color:var(--g200)}
.metric.feature .arw{background:rgba(255,255,255,.14);color:#fff}
.metric.feature .mv small{color:rgba(255,255,255,.55)}
.metric.alert .mv{color:var(--red)}

/* 그리드 */
.g-2-1{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:14px}
.g-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px}
@media(max-width:1080px){.g-2-1{grid-template-columns:1fr}.g-3{grid-template-columns:1fr}}
.chartWrap{padding:4px 16px 18px}
.chartWrap svg{width:100%;height:auto;display:block}
.donutWrap{display:flex;align-items:center;gap:18px;padding:6px 20px 20px;flex-wrap:wrap}
.donutWrap svg{width:158px;height:158px;flex:none}
.dLegend{flex:1;min-width:150px;display:flex;flex-direction:column;gap:7px}
.dRow{display:flex;align-items:center;gap:9px;font-size:.84rem;cursor:pointer;padding:5px 8px;border-radius:9px}
.dRow:hover{background:var(--hover)}
.dRow .sw{width:10px;height:10px;border-radius:50%;flex:none}
.dRow b{margin-left:auto;font-variant-numeric:tabular-nums}
.dRow span.a{color:var(--ink-3);font-size:.76rem;font-variant-numeric:tabular-nums}

/* 재고 건강도 */
.healthGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;padding:4px 20px 16px}
@media(max-width:1000px){.healthGrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.healthGrid{grid-template-columns:repeat(2,1fr)}}
.hCard{background:var(--bg);border-radius:14px;padding:13px 14px;cursor:pointer;transition:transform .14s,background .14s}
.hCard:hover{transform:translateY(-2px);background:var(--line)}
.hCard .hl{font-size:.77rem;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.hCard .hl i{width:8px;height:8px;border-radius:50%;background:var(--hc);display:inline-block}
.hCard .hv{font-size:1.5rem;font-weight:800;margin-top:6px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hCard .hv em{font-style:normal;font-size:.48em;color:var(--ink-3);font-weight:600;margin-left:2px}
.hCard .hp{font-size:.71rem;color:var(--ink-3);margin-top:3px;font-variant-numeric:tabular-nums}
.segBar{display:flex;gap:4px;height:24px;padding:0 20px 8px}
.segBar i{border-radius:99px;cursor:pointer;transition:opacity .14s}
.segBar i:hover{opacity:.65}
.segCap{display:flex;justify-content:space-between;padding:0 20px 18px;font-size:.72rem;color:var(--ink-3)}

/* 업무 리스트 */
.task-list{padding:2px 10px 14px}
.task-row{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:12px;cursor:pointer}
.task-row:hover{background:var(--hover)}
.task-icon{width:38px;height:38px;border-radius:12px;background:var(--g100);display:flex;align-items:center;justify-content:center;color:var(--g700);flex:none}
.task-row.hot .task-icon{background:var(--red-bg);color:var(--red-tx)}
.task-copy{min-width:0}
.task-copy strong{display:block;font-size:.87rem;font-weight:700}
.task-copy span{font-size:.74rem;color:var(--ink-3)}
.task-n{margin-left:auto;font-size:.95rem;font-weight:800;font-variant-numeric:tabular-nums}
.task-row.hot .task-n{color:var(--red)}
.task-row.ok .task-n{color:var(--g600)}
.prog-wrap{padding:0 20px 18px}
.prog-big{font-size:2rem;font-weight:800;letter-spacing:-.03em}
.prog-big small{font-size:.44em;color:var(--ink-3);font-weight:600}
.progress-track{height:9px;border-radius:99px;background:var(--line);overflow:hidden;margin:9px 0 14px}
.progress-fill{height:100%;border-radius:99px;background:var(--g600)}
.mini-rows{display:flex;flex-direction:column;gap:9px}
.mini-row{display:flex;align-items:center;font-size:.83rem}
.mini-row span{color:var(--ink-2)}
.mini-row strong{margin-left:auto;font-variant-numeric:tabular-nums}
.mini-bar{height:6px;border-radius:99px;background:var(--line);margin-top:5px;overflow:hidden}
.mini-bar i{display:block;height:100%;background:var(--g500);border-radius:99px}

/* 툴바 / 테이블 */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input[type=text]{padding:10px 14px;border:none;border-radius:12px;width:240px;background:var(--card);box-shadow:var(--sh)}
.toolbar select{padding:10px 12px;border:none;border-radius:12px;background:var(--card);box-shadow:var(--sh)}
.toolbar .sum{margin-left:auto;font-size:.83rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.toolbar .sum b{color:var(--ink)}
.btnDl{display:inline-flex;align-items:center;gap:6px;padding:10px 15px;border-radius:12px;font-size:.83rem;font-weight:700;background:var(--g600);color:#fff}
.btnDl:hover{background:var(--g700)}
.btnDl:disabled{opacity:.5;cursor:default}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;box-shadow:var(--sh)}
.seg button{padding:7px 13px;border-radius:9px;font-size:.82rem;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.seg button.on{background:var(--g900);color:#fff}
.tblWrap{overflow:auto;border-radius:0 0 var(--r) var(--r)}
table.tbl{width:100%;border-collapse:collapse;font-size:.855rem}
.tbl th{position:sticky;top:0;background:var(--card);text-align:left;font-size:.73rem;font-weight:600;color:var(--ink-3);padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:5}
.tbl th.thCol{width:44px;padding:9px 6px}
.tbl td{padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.tbl td.thCell{width:44px;padding:5px 6px}
.rowTh{width:34px;height:34px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px;display:block;transition:transform .2s var(--ease)}
.tbl tbody tr:hover .rowTh{transform:scale(1.5);box-shadow:var(--sh-md);position:relative;z-index:3}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl td.name{max-width:320px;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--hover)}
.tbl tr.rowDelay td:first-child{box-shadow:inset 3px 0 0 var(--red)}

/* 보드 */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start}
@media(max-width:1100px){.board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.board{grid-template-columns:1fr}}
.bcol .bhead{padding:14px 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.bcol .bhead .dot{width:9px;height:9px;border-radius:50%;background:var(--bc)}
.bcol .bhead .bt{font-weight:700;font-size:.87rem}
.bcol .bhead .bn{font-weight:800;font-size:.95rem;color:var(--ink-2)}
.bcol .bhead .ba{margin-left:auto;font-size:.74rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.bcol .bbody{padding:10px;display:flex;flex-direction:column;gap:8px;max-height:66vh;overflow-y:auto}
.bcard{background:var(--bg);border-radius:12px;padding:11px 13px;cursor:pointer;font-size:.83rem}
.bcard:hover{background:var(--line)}
.bcard.dl{box-shadow:inset 3px 0 0 var(--red)}
.bcard .t{font-weight:700;margin-bottom:5px;line-height:1.35}
.bcard .m{color:var(--ink-2);font-size:.75rem;display:flex;gap:8px;flex-wrap:wrap}

/* 월 그룹 */
.month{margin-bottom:12px}
.month .mhead{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.month .mhead .mt{font-size:1rem;font-weight:800}
.month.now .mhead .mt{color:var(--g600)}
.month .mhead .mtag{font-size:.68rem;font-weight:700;color:#fff;background:var(--g600);border-radius:99px;padding:3px 10px}

/* ===== 모션 · 부드러운 전환 ===== */
:root{
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-soft:cubic-bezier(.4,0,.2,1);
  --spring:cubic-bezier(.34,1.4,.5,1);
}
*{-webkit-tap-highlight-color:transparent}
@media (prefers-reduced-motion:no-preference){
  html{scroll-behavior:smooth}
}
/* 화면 전환 */
#view{animation:viewIn .38s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.page-head{animation:viewIn .42s var(--ease) both}
/* 카드 스태거 */
.pCard,.metric,.hCard,.brandCard{animation:cardIn .42s var(--ease) both}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.pGrid>.pCard:nth-child(1){animation-delay:.01s}.pGrid>.pCard:nth-child(2){animation-delay:.03s}
.pGrid>.pCard:nth-child(3){animation-delay:.05s}.pGrid>.pCard:nth-child(4){animation-delay:.07s}
.pGrid>.pCard:nth-child(5){animation-delay:.09s}.pGrid>.pCard:nth-child(6){animation-delay:.11s}
.pGrid>.pCard:nth-child(7){animation-delay:.13s}.pGrid>.pCard:nth-child(8){animation-delay:.15s}
.pGrid>.pCard:nth-child(9){animation-delay:.17s}.pGrid>.pCard:nth-child(10){animation-delay:.19s}
.pGrid>.pCard:nth-child(n+11){animation-delay:.21s}
.metrics>.metric:nth-child(2){animation-delay:.05s}.metrics>.metric:nth-child(3){animation-delay:.09s}
.metrics>.metric:nth-child(4){animation-delay:.13s}.metrics>.metric:nth-child(5){animation-delay:.17s}
.metrics>.metric:nth-child(6){animation-delay:.21s}
/* 눌림 피드백 */
.pCard,.metric,.hCard,.brandCard,.chip,.nav-item,.tb-btn,.btnDl,.isBtn,.seg button,.task-row,.dRow,.yearSeg button,.gTh,.gAdd{
  transition:transform .18s var(--spring),box-shadow .22s var(--ease),background .18s var(--ease-soft),color .18s var(--ease-soft),border-color .18s var(--ease-soft),opacity .18s var(--ease-soft);
}
.pCard:active,.metric:active,.hCard:active,.brandCard:active{transform:scale(.975)}
.chip:active,.btnDl:active,.isBtn:active,.seg button:active,.tb-btn:active,.nav-item:active,.gTh:active,.gAdd:active{transform:scale(.94)}
.task-row:active,.dRow:active{transform:scale(.99)}
.tbl tbody tr{transition:background .16s var(--ease-soft)}
/* 패널 */
#panel{transition:right .42s var(--ease),transform .42s var(--ease)}
#ovl{transition:opacity .34s var(--ease);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
#panel .pbody>*{animation:panelIn .4s var(--ease) both}
#panel .pbody>*:nth-child(2){animation-delay:.05s}
#panel .pbody>*:nth-child(3){animation-delay:.09s}
#panel .pbody>*:nth-child(4){animation-delay:.13s}
@keyframes panelIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#panel.dragging{transition:none}
.pGrab{display:none}
/* 이미지 */
.pcImg img,.gMain img{transition:transform .5s var(--ease),opacity .35s var(--ease)}
.pCard:hover .pcImg img{transform:scale(1.05)}
.gMain img{animation:imgIn .38s var(--ease) both}
@keyframes imgIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
/* 막대·도넛 */
.progress-fill,.mini-bar i,.brow .bar,.segBar i{transition:width .7s var(--ease)}
.pipe .stage,.section-head{transition:background .2s var(--ease-soft)}
svg rect,svg circle,svg polyline{transition:opacity .3s var(--ease-soft)}
/* 스켈레톤 */
.skel{background:linear-gradient(90deg,var(--line) 25%,var(--hover) 37%,var(--line) 63%);background-size:400% 100%;animation:shim 1.3s ease-in-out infinite;border-radius:10px}
@keyframes shim{0%{background-position:100% 50%}100%{background-position:0 50%}}
.skelGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:12px}
.skelCard{background:var(--card);border-radius:14px;padding:10px;box-shadow:var(--sh)}

.skelCard .b{height:12px;margin-bottom:6px}
.skelCard .c{height:12px;width:60%}

function $(s){return document.querySelector(s)}

function kFmt(n){ if(n>=1e6)return '$'+(n/1e6).toFixed(1)+'M'; if(n>=1e3)return '$'+Math.round(n/1e3)+'K'; return '$'+Math.round(n) }
function nowYM(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}

function isCarry(r){
  if(r.ind)return false;
  var sy=parseInt(r._sy||0,10);
  return !!(sy&&sy<new Date().getFullYear());
}
function isDelayed(r){
  if(r.ind)return false;
  if(isCarry(r))return false;
  var ym=parseYM(r.im);

}

}

}

function derive(rs){
  var cur=nowYM(),nxt=nextYM(),prv=prevYM();
  var d={
    delayed:rs.filter(function(r){return r._dl}),
    thisMonth:rs.filter(function(r){return parseYM(r.im)===cur}),
    prevMonth:rs.filter(function(r){return parseYM(r.im)===prv}),
    open:rs.filter(function(r){return r._st!=='done'}),
    done:rs.filter(function(r){return r._st==='done'}),
    etdMiss:rs.filter(function(r){var y=parseYM(r.im);return y&&y<=nxt&&!r.etd&&!r.ind}),
    kcUrgent:rs.filter(function(r){var y=parseYM(r.im);return y&&y<=nxt&&!r.ind&&(r._kc==='none')}),
    kcTodo:rs.filter(function(r){return r._kc==='none'||r._kc==='prog'}),
    onWater:rs.filter(function(r){return r._st==='ship'})
  };
  d.totalAmt=rs.reduce(function(a,r){return a+r._amt},0);
  d.tmAmt=d.thisMonth.reduce(function(a,r){return a+r._amt},0);
  return d;
}
function readiness(g){
  var n=g.length||1;
  var etd=g.filter(function(r){return r.etd||r.ind}).length;
  var bl=g.filter(function(r){return r.bl||r.obl||r.ind}).length;
  var kc=g.filter(function(r){return r._kc==='done'||r._kc==='na'}).length;
  var ind=g.filter(function(r){return r.ind}).length;
  return {n:g.length,etd:etd,bl:bl,kc:kc,ind:ind,pct:Math.round((etd+bl+kc+ind)/(n*4)*100)};
}

    var qs=Object.keys(params).map(function(k){return k+'='+encodeURIComponent(params[k])}).join('&');
    s.src=GAS_URL+'?'+qs+'&callback='+cb;
    s.onerror=function(){cleanup();rej(new Error('네트워크 오류 — 배포 액세스 권한(모든 사용자) 확인'));};

var BRAND_LINE=['#0B3D2C','#1B7A4F','#57B08A','#E0A030','#8FB8A8','#C2CBC6'];
function smoothPath(pts,close,baseY){
  if(!pts.length)return '';
  if(pts.length<3){
    var d0='M'+pts.map(function(p){return p[0]+','+p[1]}).join(' L');
    return close?d0+' L'+pts[pts.length-1][0]+','+baseY+' L'+pts[0][0]+','+baseY+' Z':d0;
  }
  var d='M'+pts[0][0]+','+pts[0][1];
  for(var i=0;i<pts.length-1;i++){
    var p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    var t=0.22;
    var c1x=p1[0]+(p2[0]-p0[0])*t, c1y=p1[1]+(p2[1]-p0[1])*t;
    var c2x=p2[0]-(p3[0]-p1[0])*t, c2y=p2[1]-(p3[1]-p1[1])*t;
    d+=' C'+c1x.toFixed(1)+','+c1y.toFixed(1)+' '+c2x.toFixed(1)+','+c2y.toFixed(1)+' '+p2[0]+','+p2[1];
  }
  if(close)d+=' L'+pts[pts.length-1][0]+','+baseY+' L'+pts[0][0]+','+baseY+' Z';
  return d;
}
function svgBrandTrend(brandMrev,brands,months){
  if(!months.length||!brands.length)return '<div class="empty">브랜드 매출 데이터 없음</div>';
  var W=760,H=290,padL=52,padR=22,top=26,bottom=34;
  var plotW=W-padL-padR,plotH=H-top-bottom;
  var maxV=1;
  brands.forEach(function(b){months.forEach(function(m){var v=(brandMrev[b]||{})[m]||0;if(v>maxV)maxV=v;})});
  var step=Math.pow(10,Math.floor(Math.log(maxV)/Math.LN10));
  var niceMax=Math.ceil(maxV/step*1.05)*step;
  var xs=function(i){return +(padL+(months.length===1?plotW/2:plotW*(i/(months.length-1)))).toFixed(1)};
  var ys=function(v){return +(H-bottom-plotH*(Math.max(0,v)/niceMax)).toFixed(1)};
  var cur=nowYM(), curI=months.indexOf(cur);

      +dots+lab+'</g>';

function sparkline(map,months,col){

var HY_URLS=[

];
var hy={status:'loading',db:null,agg:null,err:''};
var HY_CLS={
  '정상':    {color:'#1B7A4F', cls:'b-done',    desc:'재고·회전 안정'},
  '신규':    {color:'#57B08A', cls:'b-prod',    desc:'판매 데이터 축적 중'},
  '발주필요':{color:'#E0A030', cls:'b-warn',    desc:'재발주 검토 대상'},
  '품절위험':{color:'#CF3B3B', cls:'b-delay',   desc:'30일 내 소진 예상'},
  '과잉/악성':{color:'#8A8F9A', cls:'b-ship',   desc:'회전 지연·장기 보유'},
  '무재고':  {color:'#C9CDD2', cls:'b-ordered', desc:'판매 이력 有 · 재고 0'}
};
var HY_ORDER=['정상','신규','발주필요','품절위험','과잉/악성','무재고'];
function extractJSONVar(src,name){
  var re=new RegExp('(?:var|const|let)\\s+'+name+'\\s*=\\s*');
  var m=re.exec(src); if(!m)return null;
  var iO=src.indexOf('{',m.index+m[0].length), iA=src.indexOf('[',m.index+m[0].length);
  var i=(iO===-1)?iA:(iA===-1?iO:Math.min(iO,iA)); if(i===-1)return null;
  var depth=0,inStr=false,q='';
  for(var j=i;j<src.length;j++){
    var c=src[j];
    if(inStr){ if(c==='\\')j++; else if(c===q)inStr=false; }
    else{
      if(c==='"'||c==="'"){inStr=true;q=c;}
      else if(c==='{'||c==='[')depth++;
      else if(c==='}'||c===']'){depth--; if(depth===0)return src.slice(i,j+1);}
    }
  }
  return null;
}
function fetchHayoung(idx){
  idx=idx||0;
  if(idx>=HY_URLS.length){hy.status='error';hy.err='재고 데이터 소스에 연결할 수 없음';if(state.view==='dash')render();return;}
  fetch(HY_URLS[idx]).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.text();
  }).then(function(t){
    var raw=extractJSONVar(t,'DB');
    if(!raw)throw new Error('DB 추출 실패');
    hy.db=JSON.parse(raw);
    hy.agg=hyAggregate(hy.db);
    try{ hy.kc=JSON.parse(extractJSONVar(t,'KC_DATA')||'[]'); }catch(e){ hy.kc=[]; }
    hy.kcAgg=hyKcAggregate(hy.kc);
    hy.status='ok';
    if(['dash','kc','master','stock','sales','brand'].indexOf(state.view)!==-1)render();
  }).catch(function(e){ fetchHayoung(idx+1); });
}
function hyAggregate(db){
  var items=db.items,codes=Object.keys(items);
  var a={gen:db.gen,curym:db.curym,channels:db.channels||[],total:codes.length,
    cls:{},clsAmt:{},stockAmt:0,stockQty:0,activeCnt:0,eolCnt:0,
    needList:[],recAmt:0,incQty:0,incCnt:0,
    brand:{},brandMrev:{},brandQty:{},monthlyQty:{},mrev:{},mqtyCh:{},chRev:{},chRevTotal:0};
  var curYear=String(new Date().getFullYear());
  codes.forEach(function(c){
    var it=items[c];
    var cls=it.cls||'기타';
    var nb=normBrand(it.brand);
    if(cls==='단종소진중'){a.eolCnt++;}
    else{
      a.activeCnt++;
      a.cls[cls]=(a.cls[cls]||0)+1;
      a.clsAmt[cls]=(a.clsAmt[cls]||0)+(it.amt||0);
      var b=nb;
      var bo=a.brand[b]=a.brand[b]||{cnt:0,amt:0,need:0,short:0,exc:0,excAmt:0};
      bo.cnt++;bo.amt+=(it.amt||0);
      if(cls==='발주필요'){bo.need++;}
      if(cls==='품절위험')bo.short++;
      if(cls==='과잉/악성'){bo.exc++;bo.excAmt+=(it.amt||0);}
    }
    a.stockAmt+=(it.amt||0);
    a.stockQty+=(it.cur||0);
    if(it.inc>0){a.incQty+=it.inc;a.incCnt++;}
    if(cls==='발주필요'||cls==='품절위험'){
      a.needList.push({code:c,name:it.name,brand:nb,cls:cls,cur:it.cur||0,inc:it.inc||0,
        adps:it.adps||0,days:it.days,rec:it.rec||0,dp:it.dp||0,recAmt:(it.rec||0)*(it.dp||0)});
      if(cls==='발주필요')a.recAmt+=(it.rec||0)*(it.dp||0);
    }
    /* 월별 판매수량 + 채널별 매출 환산 (chy 단가 기준) */
    var unit={},uAll={};
    if(it.chy)Object.keys(it.chy).forEach(function(y){
      Object.keys(it.chy[y]).forEach(function(ch){
        var v=it.chy[y][ch],q=v[0]||0,rv=v[1]||0;
        if(q){unit[y+'|'+ch]=rv/q;(uAll[ch]=uAll[ch]||[]).push(rv/q);}
      });
    });
    if(it.monthly)Object.keys(it.monthly).forEach(function(ym){
      var o=it.monthly[ym],s=0,y=ym.slice(0,4);
      Object.keys(o).forEach(function(ch){
        var q=o[ch]||0;s+=q;
        var u=unit[y+'|'+ch];
        if(u===undefined&&uAll[ch]&&uAll[ch].length){
          var t=0;uAll[ch].forEach(function(x){t+=x});u=t/uAll[ch].length;
        }
        if(u===undefined)u=0;
        a.mrev[ym]=a.mrev[ym]||{};
        a.mrev[ym][ch]=(a.mrev[ym][ch]||0)+q*u;
        a.mqtyCh[ym]=a.mqtyCh[ym]||{};
        a.mqtyCh[ym][ch]=(a.mqtyCh[ym][ch]||0)+q;
        a.brandMrev[nb]=a.brandMrev[nb]||{};
        a.brandMrev[nb][ym]=(a.brandMrev[nb][ym]||0)+q*u;
        a.brandQty[nb]=a.brandQty[nb]||{};
        a.brandQty[nb][ym]=(a.brandQty[nb][ym]||0)+q;
      });
      a.monthlyQty[ym]=(a.monthlyQty[ym]||0)+s;
    });
    /* 당해년도 채널별 매출 */
    if(it.chy&&it.chy[curYear])Object.keys(it.chy[curYear]).forEach(function(ch){
      var v=it.chy[curYear][ch];var rev=(v&&v[1])||0;
      a.chRev[ch]=(a.chRev[ch]||0)+rev;a.chRevTotal+=rev;
    });
  });
  a.needList.sort(function(x,y){
    var dx=x.days==null?9999:x.days,dy=y.days==null?9999:y.days;return dx-dy;
  });
  return a;
}
function fmtKR(n){
  n=Math.round(n||0);var neg=n<0;n=Math.abs(n);var s;
  if(n>=1e8)s=(n/1e8).toFixed(1).replace(/\.0$/,'')+'억';
  else if(n>=1e4)s=Math.round(n/1e4).toLocaleString()+'만';
  else s=n.toLocaleString();
  return (neg?'-₩':'₩')+s;
}
function urgOf(days){
  if(days==null)return{k:'plan',label:'여유',cls:'b-ordered'};
  if(days<=30)return{k:'now',label:'긴급',cls:'b-delay'};
  if(days<=60)return{k:'soon',label:'시급',cls:'b-warn'};
  return{k:'plan',label:'여유',cls:'b-ordered'};
}
function kcRecoverOf(r){
  /* 2026 이익 기준 KC 비용 회수 판정 */
  var p=r.profit2026, c=r.kccost||0;
  if(p==null)return{k:'na',label:'판단불가',cls:'b-ordered',rate:null};
  if(c<=0)return{k:'done',label:'회수완료',cls:'b-done',rate:100};
  var rate=Math.round(p/c*100);
  if(p>=c)return{k:'done',label:'회수완료',cls:'b-done',rate:rate};
  if(p>0)return{k:'part',label:'회수중',cls:'b-warn',rate:rate};
  return{k:'no',label:'미회수',cls:'b-delay',rate:rate};
}
function hyKcAggregate(kc){
  var a={total:kc.length,cost:0,count:0,done:0,part:0,no:0,na:0,brand:{}};
  kc.forEach(function(r){

    var v=kcRecoverOf(r); a[v.k==='na'?'na':(v.k==='done'?'done':(v.k==='part'?'part':'no'))]++;
    var b=r.brand||'기타';

var _bnCache={};
function normBrand(b){
  if(b==null||b==='')return '기타';
  if(_bnCache[b]!==undefined)return _bnCache[b];
  var s=String(b).replace(/[（(].*$/,'').replace(/\s+/g,'').replace(/[·・]/g,'');
  var out=s||'기타';
  for(var i=0;i<BRAND_ALIAS.length;i++){
    if(BRAND_ALIAS[i][0].test(s)){out=BRAND_ALIAS[i][1];break;}
  }
  if(/^(완구기타|기타|미지정)$/.test(out))out='기타';
  _bnCache[b]=out;return out;
}

function resizeImg(file,maxW){
  return new Promise(function(res,rej){
    var rd=new FileReader();
    rd.onload=function(){
      var im=new Image();
      im.onload=function(){
        var w=im.width,hh=im.height;
        if(w>maxW){ hh=Math.round(hh*maxW/w); w=maxW; }
        var cv=document.createElement('canvas'); cv.width=w; cv.height=hh;
        var cx=cv.getContext('2d');
        /* 투명 PNG가 검게 변하지 않도록 흰 배경을 먼저 채움 */
        cx.fillStyle='#FFFFFF'; cx.fillRect(0,0,w,hh);
        cx.drawImage(im,0,0,w,hh);
        var du=cv.toDataURL('image/jpeg',0.9);
        res(du.split(',')[1]);
      };
      im.onerror=function(){rej(new Error('이미지를 읽을 수 없습니다'))};
      im.src=rd.result;
    };
    rd.onerror=function(){rej(new Error('파일 읽기 실패'))};
    rd.readAsDataURL(file);
  });
}
function saveImgs(o,ids,lock){

  var want=ids.join(',');
  gasPost({action:'setImgs',bc:normBc(o.bc),bcRaw:o.bc,name:o.name||'',imgs:want,lock:(lock===0?0:1)})
    .then(function(){ return new Promise(function(r){setTimeout(r,1600)}); })
    .then(function(){ return fetchExtra(true); })
    .then(function(){
      /* iframe POST는 서버 응답을 읽을 수 없어 저장 실패가 조용히 묻힌다.
         실제 반영된 값을 다시 읽어 비교하고, 다르면 사용자에게 알린다. */
      var e2=exOf(o);
      var got=String((e2&&e2.img)||'').split(',').map(function(x){return x.trim()}).filter(Boolean).join(',');
      if(got!==want){
        alert('이미지 순서가 저장되지 않았습니다.\n\n요청한 순서: '+(want||'(없음)')
          +'\n서버에 저장된 순서: '+(got||'(없음)')
          +'\n\nApps Script "가이아MD 포털" 프로젝트의 최신 Code.gs가 배포되어 있는지 확인해 주세요.\n(배포 → 배포 관리 → 연필 아이콘 → 새 버전 → 배포)');
      }
      reopenPanel(o);
    })
    .catch(function(e){ alert('처리 실패: '+(e.message||e)); reopenPanel(o); });
}
function doUpload(o,kind,file){
  if(!file){return;}
  if(!/^image\//.test(file.type)){alert('이미지 파일만 등록할 수 있습니다');return;}
  if(imgList(exOf(o)).length>=IMG_MAX){alert('이미지는 최대 '+IMG_MAX+'장까지 등록할 수 있습니다');return;}
  var g=document.querySelector('.gMain');
  if(g)g.innerHTML='<div class="upWait"><div class="spin"></div>업로드 중…</div>';
  resizeImg(file,1200).then(function(b64){
    return gasPost({action:'uploadImg',bc:normBc(o.bc),bcRaw:o.bc,name:o.name||'',data:b64,mime:'image/jpeg'});
  }).then(function(){
    return new Promise(function(r){setTimeout(r,2200)});
  }).then(function(){ return fetchExtra(true); })
  .then(function(){ state._imgSel=0; reopenPanel(o); })
  .catch(function(e){ alert('업로드 실패: '+(e.message||e)); reopenPanel(o); });
}
function refreshOpenPanel(){

}
function reopenPanel(o){

    var i=ms.list.indexOf(o);
    if(i>=0){ openMasterPanel(i); return; }
  }
  if(state._panelRow!=null){ openPanel(state._panelRow); return; }
  var j=ms.list.findIndex(function(x){return normBc(x.bc)===normBc(o.bc)});
  if(j>=0)openMasterPanel(j);
}
(function(){
  ['dragover','drop'].forEach(function(ev){
    window.addEventListener(ev,function(e){
      if(e.target&&e.target.closest&&e.target.closest('[data-drop]'))return;
      e.preventDefault();
    },false);
  });
})();
function bindDropZones(o,body){
  body.querySelectorAll('[data-drop]').forEach(function(z){
    var kind=z.dataset.drop;
    ['dragenter','dragover'].forEach(function(ev){
      z.addEventListener(ev,function(e){
        e.preventDefault();e.stopPropagation();
        try{ e.dataTransfer.dropEffect='copy'; }catch(err){}
        z.classList.add('dragOn');
      },false);
    });
    ['dragleave','dragend'].forEach(function(ev){
      z.addEventListener(ev,function(e){ e.preventDefault();e.stopPropagation(); z.classList.remove('dragOn'); });
    });
    z.addEventListener('drop',function(e){
      e.preventDefault();e.stopPropagation(); z.classList.remove('dragOn');
      if(imgList(exOf(o)).length>=IMG_MAX){ alert('이미지는 최대 '+IMG_MAX+'장까지 등록할 수 있습니다'); return; }
      var dt=e.dataTransfer; if(!dt)return;
      var f=(dt.files&&dt.files[0])||null;
      if(f){ doUpload(o,kind,f); return; }
      var items=dt.items;
      if(items)for(var i=0;i<items.length;i++){
        if(items[i].kind==='file'){ doUpload(o,kind,items[i].getAsFile()); return; }
      }
    });
    z.addEventListener('paste',function(e){
      var it=e.clipboardData&&e.clipboardData.items;
      if(!it)return;
      for(var i=0;i<it.length;i++) if(it[i].type.indexOf('image')===0){ doUpload(o,kind,it[i].getAsFile()); e.preventDefault(); return; }
    });
  });
}
function pickAndUpload(o,kind){
  var inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=function(){ doUpload(o,kind,inp.files[0]); };

}

  if(_hyIdx)return _hyIdx;

  Object.keys(hy.db.items).forEach(function(c){

  _hyIdx={byCode:byCode,bySuf:bySuf};

/* ----- 판매 분석 (월 상세) ----- */
function vSales(){
  var h=pageHead('판매 분석','월별 매출·수량 상세 · 채널 및 품목 단위 분석');

    return h+'<div class="card"><div class="empty">'+(hy.status==='loading'
      ?'<div class="spin" style="display:inline-block;vertical-align:-4px;margin-right:9px"></div>데이터 불러오는 중…':'데이터 로드 실패')+'</div></div>';
  }
  var a=hy.agg;
  var all=Object.keys(a.mrev).sort();
  if(!all.length)return h+'<div class="card"><div class="empty">판매 데이터 없음</div></div>';
  var ym=state.salesYM&&a.mrev[state.salesYM]?state.salesYM:all[all.length-1];
  var chs=(a.channels&&a.channels.length)?a.channels:Object.keys(a.chRev);
  var mT=function(m){var s=0,o=a.mrev[m]||{};chs.forEach(function(c){s+=Math.max(0,o[c]||0)});return s};
  var qT=function(m){var s=0,o=a.mqtyCh[m]||{};chs.forEach(function(c){s+=Math.max(0,o[c]||0)});return s};

  var rev=mT(ym),qty=qT(ym);
  var idx=all.indexOf(ym);
  var prev=idx>0?all[idx-1]:null;
  var pRev=prev?mT(prev):0;
  var mom=pRev?Math.round((rev-pRev)/pRev*100):null;
  var yoyM=(parseInt(ym.slice(0,4),10)-1)+ym.slice(4);
  var yRev=a.mrev[yoyM]?mT(yoyM):0;
  var yoy=yRev?Math.round((rev-yRev)/yRev*100):null;

function stockRows(){
  if(hy.status!=='ok'||!hy.db)return [];
  var f=state.sf,items=hy.db.items;
  var out=[];
  Object.keys(items).forEach(function(c){
    var it=items[c];
    if(f.cls){ if(it.cls!==f.cls)return; }
    else if(!f.urg&&!f.inc&&!f.brand&&!f.q){ if(it.cls==='단종소진중')return; }
    if(f.urg){
      if(it.cls!=='발주필요'&&it.cls!=='품절위험')return;
      if(urgOf(it.days).k!==f.urg)return;
    }
    if(f.inc&&!(it.inc>0))return;
    if(f.brand&&normBrand(it.brand)!==f.brand)return;
    if(f.q){
      var q=f.q.toLowerCase();
      var _o=ordAttr(String(c).split('-').slice(1).join('-'))||{};
      if([it.name,c,it.brand,_o.kcno,_o.kcname,_o.item,_o.bc]
        .filter(Boolean).join(' ').toLowerCase().indexOf(q)===-1)return;
    }
    out.push({code:c,it:it});
  });
  if(f.urg||f.cls==='발주필요'||f.cls==='품절위험'){
    out.sort(function(x,y){
      var dx=x.it.days==null?99999:x.it.days,dy=y.it.days==null?99999:y.it.days;return dx-dy;
    });
  } else out.sort(function(x,y){return (y.it.amt||0)-(x.it.amt||0)});
  return out;
}

function masterFiltered(){
  var f=state.mf;
  return ms.list.filter(function(o){
    if(f.brand&&(o.br||'')!==f.brand)return false;
    if(f.q){
      var q=f.q.toLowerCase();
      var _od=ordAttr(o.bc)||{}, _cd=catDetail(o)||{}, _kn=knOf(o.bc)||{};
      var _ct=certOf(o.kcno||_od.kcno||_kn.kc||_cd.kc, o.kcn||_od.kcname);
      var hay=[o.name,o.no,o.bc,o.br,o.kcno,o.kcn,_od.item,_od.kcno,_od.kcname,
        _kn.kc,_cd.kc,_od.knet,_od.lotte,
        _ct&&_ct.kcno,_ct&&_ct.series,_ct&&_ct.maker,_ct&&_ct.report]
        .filter(Boolean).join(' ').toLowerCase();
      if(hay.indexOf(q)===-1)return false;
    }
    if(f.stock){
      var lv=liveStockOf(o), s=stockOf(o);
      if(f.stock==='img'){ if(!imgList(exOf(o)).length)return false; }
      else if(f.stock==='noimg'){ if(imgList(exOf(o)).length)return false; }
      else if(f.stock==='nocat'){ if(inCatalog(o)!==false||!normBc(o.bc))return false; }
      else if(f.stock==='none'){ if(lv||s)return false; }
      else if(f.stock==='has'){ if(!(lv&&lv.q>0)&&!(s&&s.it.cur>0))return false; }
      else if(f.stock==='zero'){ if(!lv||lv.q>0)return false; }
      else { if(!s||s.it.cls!==f.stock)return false; }
    }
    return true;
  }).sort(function(a,b){
    if(state.mSort==='name')return String(a.name||'').localeCompare(String(b.name||''));
    if(state.mSort==='price'){
      /* 판매가 없는 상품은 항상 맨 뒤로 — 0원으로 취급하면 무가격 상품이 "가장 싼 상품"인 것처럼
         뒤섞여 보이므로, 가격 있음/없음을 먼저 가르고 그 다음 가격 높은순으로 정렬한다 */
      var pa=priceOf(a), pb=priceOf(b);
      var ha=pa!=null?1:0, hb=pb!=null?1:0;
      if(ha!==hb)return hb-ha;
      if(ha&&pa!==pb)return pb-pa;
      return String(a.name||'').localeCompare(String(b.name||''));
    }
    var ia=imgList(exOf(a)).length?1:0, ib=imgList(exOf(b)).length?1:0;
    if(ia!==ib)return ib-ia;
    var la=liveStockOf(a), lb=liveStockOf(b);
    var sa=stockOf(a), sb=stockOf(b);
    var qa=la?la.q:(sa?(sa.it.cur||0):0);
    var qb=lb?lb.q:(sb?(sb.it.cur||0):0);
    var ha=qa>0?1:0, hb=qb>0?1:0;
    if(ha!==hb)return hb-ha;
    if(qa!==qb)return qb-qa;
    return String(a.name||'').localeCompare(String(b.name||''));
  });
}

/* ---- 오더 RAW에서 상품 속성 보강 (바코드 기준) ---- */
var _ordIdx=null,_ordIdxKey='';
function ordIdx(){
  var key=YEARS.filter(function(y){return state.data[y]}).join(',');
  if(_ordIdx&&_ordIdxKey===key)return _ordIdx;
  var map={};
  YEARS.slice().sort().forEach(function(y){
    (state.data[y]||[]).forEach(function(r){
      var b=normBc(r.bc); if(!b)return;
      var o=map[b]=map[b]||{};
      if(r.lbc)o.lbc=r.lbc;
      if(r.item)o.item=r.item;
      if(r.pack)o.pack=r.pack;
      if(r.price){o.price=r.price;o.priceY=y;o.priceOd=r.od||'';}
      if(r.name||r.desc)o.name=r.name||r.desc;
      if(r.desc)o.desc=r.desc;
      if(r.code)o.code=r.code;
      if(r.kcno)o.kcno=r.kcno;
      if(r.kcname)o.kcname=r.kcname;
      if(r.knet)o.knet=r.knet;
      if(r.lotte)o.lotte=r.lotte;
      if(r.br)o.br=r.br;
    });
  });
  _ordIdx=map;_ordIdxKey=key;return map;
}
function kcmVal(bc,f){
  if(kcm.status!=='ok'||!kcm.map)return '';
  var b=normBc(bc); if(!b)return '';
  var hit=kcm.map[String(bc).replace(/\s/g,'')]||null;
  if(!hit){
    for(var k in kcm.map){ if(normBc(k)===b){hit=kcm.map[k];break;} }
  }
  return (hit&&hit[f])||'';
}
function ordAttr(bc){ var b=normBc(bc); return b?(ordIdx()[b]||null):null; }

/* 펀코·MGA는 원래 12자리(UPC) — 표시 시 앞의 0 제거 */
function displayBc(bc,br){

  ms.list.forEach(function(o){ var b=normBc(o.bc); if(b)idx[b]=o; });
  var added=0;
  YEARS.slice().sort().forEach(function(y){
    (state.data[y]||[]).forEach(function(r){

        if(!t.name&&name)t.name=name;
        if(!t.no&&r.code)t.no=r.code;
        if(!t.pack&&r.pack)t.pack=r.pack;
        if(!t.kcno&&r.kcno)t.kcno=r.kcno;
        if(!t.kcn&&r.kcname)t.kcn=r.kcname;
        if(!t.knet&&r.knet)t.knet=r.knet;
        if(!t.lotte&&r.lotte)t.lotte=r.lotte;
        return;
      }

      var o={bc:r.bc,name:name,no:r.code||'',br:r.br||'',pack:r.pack||'',
        kcno:r.kcno||'',kcn:r.kcname||'',knet:r.knet||'',lotte:r.lotte||'',_src:'order'};
      idx[b]=o; ms.list.push(o); added++;

/* ---- 실거래 평균 공급가 (재고/발주 DB 매출 기준) ---- */
function supplyPrice(o){
  if(hy.status!=='ok')return null;
  var s=stockOf(o); if(!s)return null;
  var chy=s.it.chy||{};
  var years=Object.keys(chy).sort().reverse();
  for(var i=0;i<years.length;i++){
    var y=years[i],q=0,r=0;
    Object.keys(chy[y]).forEach(function(ch){
      var v=chy[y][ch]||[]; q+=(v[0]||0); r+=(v[1]||0);
    });
    if(q>=3&&r>0)return {year:y,qty:q,rev:r,unit:Math.round(r/q)};
  }
  for(var j=0;j<years.length;j++){
    var y2=years[j],q2=0,r2=0;
    Object.keys(chy[y2]).forEach(function(ch){
      var v=chy[y2][ch]||[]; q2+=(v[0]||0); r2+=(v[1]||0);
    });
    if(q2>0&&r2>0)return {year:y2,qty:q2,rev:r2,unit:Math.round(r2/q2),few:true};
  }
  return null;
}
/* 환율 조회 — fx.list(네이버 고시)에서 통화별 1단위 기준 환율을 얻는다.
   기존 코드는 fx.rate.usd 를 읽었으나 fx.rate 는 어디에서도 설정되지 않아
   원가가 항상 null 이 되고 재고DB 평가액으로 폴백되고 있었다. */
function fxRateOf(k){
  if(fx.status!=='ok'||!fx.list||!fx.list.length)return null;
  if(fx.rate&&fx.rate[k])return fx.rate[k];
  for(var i=0;i<fx.list.length;i++){
    var x=fx.list[i];
    if(x.k!==k||!x.price)continue;
    /* unit 은 숫자가 아니라 '' 또는 '(100엔)' 형태의 문자열이다.
       그대로 나누면 NaN 이 되므로 숫자만 뽑아 쓴다. */
    var u=parseFloat(String(x.unit==null?'':x.unit).replace(/[^0-9.]/g,''));
    if(!isFinite(u)||u<=0)u=1;
    return x.price/u;
  }
  return null;
}
/* 원가 = 오더 매입단가(USD) × 환율. 없으면 재고/발주 DB의 재고단가 */
function costInfo(o){
  var od=ordAttr(o.bc)||{};
  var usd=od.price?parseFloat(String(od.price).replace(/[^0-9.]/g,'')):null;
  if(usd&&isFinite(usd)&&usd>0){
    var rate=fxRateOf('usd');
    return {usd:usd,krw:rate?Math.round(usd*rate):null,rate:rate,
      src:'오더 '+(od.priceY||'')+(od.priceOd?' '+od.priceOd:''),kind:'order'};
  }
  var s=(hy.status==='ok')?stockOf(o):null;
  if(s&&s.it.dp)return {usd:null,krw:Math.round(s.it.dp),rate:null,src:'재고/발주 DB 평가액',kind:'stock'};
  return null;
}

  var g=/kg/i.test(s)?n*1000:(/g/i.test(s)?n:(n<50?n*1000:n));

function pageSlice(list,key,per){
  var p=state.page[key]||1;
  var total=Math.max(1,Math.ceil(list.length/per));
  if(p>total)p=total; if(p<1)p=1;
  state.page[key]=p;
  return {items:list.slice((p-1)*per,p*per),page:p,total:total,per:per,count:list.length};
}
function pager(key,info){
  if(info.total<=1)return '';
  var p=info.page,t=info.total,btn=[];
  var add=function(n,lab,cls){
    btn.push('<button class="pgBtn'+(cls||'')+'" data-pg="'+key+':'+n+'"'+(n===p?' disabled':'')+'>'+(lab||n)+'</button>');
  };
  add(Math.max(1,p-1),'‹','' );
  var s=Math.max(1,p-2),e=Math.min(t,s+4); s=Math.max(1,e-4);
  if(s>1){add(1);if(s>2)btn.push('<span class="pgDot">…</span>');}
  for(var i=s;i<=e;i++)btn.push('<button class="pgBtn'+(i===p?' on':'')+'" data-pg="'+key+':'+i+'">'+i+'</button>');
  if(e<t){if(e<t-1)btn.push('<span class="pgDot">…</span>');add(t);}
  btn.push('<button class="pgBtn" data-pg="'+key+':'+Math.min(t,p+1)+'"'+(p===t?' disabled':'')+'>›</button>');
  var from=(p-1)*info.per+1, to=Math.min(info.count,p*info.per);
  return '<div class="pgWrap"><div class="pgInfo">'+info.count.toLocaleString()+'개 중 '
    +from.toLocaleString()+'–'+to.toLocaleString()+'</div>'
    +'<div class="pgBtns">'+btn.join('')+'</div>'
    +'<div class="pgPer">페이지당 <select data-per="'+key+'">'
    +[24,48,96,200].map(function(n){return '<option value="'+n+'"'+(n===info.per?' selected':'')+'>'+n+'</option>'}).join('')
    +'</select></div></div>';
}

/* ----- 홈 (재고·발주 통합 대시보드) ----- */
function donutSVG(segs,centerTop,centerBot){
  /* segs: [{label,color,val,sub,go,f}] */
  var total=segs.reduce(function(a,s){return a+s.val},0)||1;
  var R=60,C=2*Math.PI*R,off=0;
  var circles=segs.map(function(s){
    var len=s.val/total*C;
    var el='<circle r="'+R+'" cx="75" cy="75" fill="none" stroke="'+s.color+'" stroke-width="15" stroke-linecap="butt" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 75 75)"><title>'+esc(s.label)+' '+s.val.toLocaleString()+'</title></circle>';
    off+=len;return el;
  }).join('');
  var legend=segs.map(function(s){
    return '<div class="dRow"'+(s.go?' data-go="'+s.go+'" data-f="'+(s.f||'')+'"':'')+'><span class="sw" style="background:'+s.color+'"></span>'+esc(s.label)
      +(s.sub?'<span class="a">'+s.sub+'</span>':'')+'<b>'+s.val.toLocaleString()+'</b></div>';
  }).join('');
  return '<div class="donutWrap"><svg viewBox="0 0 150 150">'+circles
    +'<text x="75" y="70" text-anchor="middle" font-size="22" font-weight="800" fill="#12181A">'+centerTop+'</text>'
    +'<text x="75" y="90" text-anchor="middle" font-size="10.5" fill="#9AA3A6">'+centerBot+'</text></svg>'
    +'<div class="dLegend">'+legend+'</div></div>';
}
function stackBar(segs){
  /* 100% 가로 스택 인포그래픽 */
  var total=segs.reduce(function(a,s){return a+s.val},0)||1;
  var bar=segs.map(function(s){
    var p=s.val/total*100;
    return '<div title="'+esc(s.label)+' '+s.val+'종 ('+Math.round(p)+'%)" style="width:'+p+'%;background:'+s.color+'"></div>';
  }).join('');
  var legend=segs.map(function(s){
    return '<span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;font-size:.79rem;color:var(--ink-2)"><span style="width:9px;height:9px;border-radius:3px;background:'+s.color+'"></span>'+esc(s.label)+' <b style="color:var(--ink)">'+s.val+'</b></span>';
  }).join('');
  return '<div style="display:flex;height:26px;border-radius:8px;overflow:hidden;margin:4px 0 10px">'+bar+'</div><div>'+legend+'</div>';
}
function svgQtyChart(monthlyQty){
  var ms=Object.keys(monthlyQty).sort().slice(-12);
  if(!ms.length)return '<div class="empty">판매 데이터 없음</div>';
  var W=Math.max(560,ms.length*54),H=230,bottom=28,top=30,pad=10;
  var maxV=Math.max.apply(null,ms.map(function(m){return Math.max(0,monthlyQty[m])}).concat([1]));
  var step=(W-pad*2)/ms.length,bw=Math.min(30,step*0.5);
  var cur=nowYM();
  var bars=ms.map(function(m,i){
    var v=Math.max(0,monthlyQty[m]);
    var hgt=Math.max(bw,(H-top-bottom)*(v/maxV));
    var x=pad+step*i+(step-bw)/2,y=H-bottom-hgt;
    var isCur=m===cur;
    var fill=isCur?'#0B3D2C':(v/maxV>0.62?'#1B7A4F':'url(#hatchQ)');
    return '<g class="bar-g" data-go="sales" data-f="ym:'+m+'" style="cursor:pointer">'
      +'<rect x="'+(x-7)+'" y="'+top+'" width="'+(bw+14)+'" height="'+(H-top-bottom)+'" fill="transparent"></rect>'
      +'<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+hgt+'" rx="'+(bw/2)+'" fill="'+fill+'"></rect>'
      +(isCur?'<rect x="'+(x-16)+'" y="'+(y-26)+'" width="'+(bw+32)+'" height="19" rx="9.5" fill="#0B3D2C"></rect>'
        +'<text x="'+(x+bw/2)+'" y="'+(y-12.5)+'" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff">'+(v>=1000?(v/1000).toFixed(1)+'k':v)+'</text>'
        :'<text x="'+(x+bw/2)+'" y="'+(y-8)+'" text-anchor="middle" font-size="10" font-weight="600" fill="#9AA3A6">'+(v>=1000?(v/1000).toFixed(1)+'k':v)+'</text>')
      +'<text x="'+(x+bw/2)+'" y="'+(H-9)+'" text-anchor="middle" font-size="10.5" font-weight="'+(isCur?'800':'500')+'" fill="'+(isCur?'#0B3D2C':'#9AA3A6')+'">'+moLabel(m)+'</text>'
      +'<title>'+fmtYM(m)+' · '+v.toLocaleString()+'pcs</title></g>';
  }).join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'
    +'<defs><pattern id="hatchQ" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">'
    +'<rect width="6" height="6" fill="#F1F3F1"></rect><line x1="0" y1="0" x2="0" y2="6" stroke="#DDE2DE" stroke-width="3"></line></pattern></defs>'
    +bars+'</svg>';
}

function filtered(rs){
  var f=state.f;
  return rs.filter(function(r){
    if(f.brand&&(r._br||'기타')!==f.brand)return false;
    if(f.im&&parseYM(r.im)!==f.im)return false;
    if(f.status==='delay'){if(!r._dl)return false;}
    else if(f.status==='carry'){if(!r._cy)return false;}
    else if(f.status==='etdmiss'){var y=parseYM(r.im);if(!(y&&y<=nextYM()&&!r.etd&&!r.ind))return false;}
    else if(f.status&&r._st!==f.status)return false;
    if(f.q){
      var q=f.q.toLowerCase();
      var _c=certOf(r.kcno,r.kcname);
      var hay=[r.name,r.item,r.desc,r.code,r.bc,r.lbc,r.br,r.sc,r.bl,
        r.kcno,r.kcname,r.knet,r.lotte,r.kct,r.req,
        _c&&_c.series,_c&&_c.maker,_c&&_c.report]
        .filter(Boolean).join(' ').toLowerCase();
      if(hay.indexOf(q)===-1)return false;
    }
    return true;
  });
}

/* ================= KC 인증서 만료 관리 ================= */
var cert={status:'loading',list:[],idx:null,err:''};
function fetchCert(force){
  cert.status='loading';
  jsonp({action:'kccert',refresh:force?'1':'0'}).then(function(d){
    if(!d.ok)throw new Error(d.error||'서버 오류');
    cert.list=d.certs||[];
    cert.list.forEach(function(c){
      c._iss=parseKDate(c.issue); c._exp=parseKDate(c.expire);
      c._dday=c._exp?Math.floor((c._exp-todayMid())/864e5):null;
      c._st=certState(c);
    });
    cert.idx=buildCertIdx(cert.list);
    cert.status='ok';
    if(state.view==='kc')render();
  }).catch(function(e){
    cert.status='error';cert.err=String(e.message||e);
    if(state.view==='kc')render();
  });
}
function todayMid(){var d=new Date();d.setHours(0,0,0,0);return d.getTime()}
function parseKDate(s){
  if(!s)return null;
  var m=String(s).trim().match(/^(\d{2,4})\s*[.\-\/]\s*(\d{1,2})\s*[.\-\/]\s*(\d{1,2})/);
  if(!m)return null;
  var y=parseInt(m[1],10); if(y<100)y+=2000;
  var d=new Date(y,parseInt(m[2],10)-1,parseInt(m[3],10));
  return isNaN(d.getTime())?null:d.getTime();
}
function fmtD(ts){ if(!ts)return ''; var d=new Date(ts);
  return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0'); }
function certState(c){
  if(!c._exp)return 'none';
  if(c._dday<0)return 'expired';
  if(c._dday<=90)return 'soon';
  if(c._dday<=180)return 'watch';
  return 'valid';
}
var CERT_ST={
  expired:{label:'만료',cls:'b-delay'}, soon:{label:'만료임박',cls:'b-warn'},
  watch:{label:'6개월 내',cls:'b-prod'}, valid:{label:'유효',cls:'b-done'}, none:{label:'기한 미등록',cls:'b-ordered'}
};
function certKey(s){ return String(s||'').toUpperCase().replace(/[^A-Z0-9\-]/g,'') }
function serKey(s){ return String(s||'').toUpperCase().replace(/\s+/g,'').replace(/[·・_\-]/g,'') }
function serKeyNP(s){ return serKey(s).replace(/[（(][^)）]*[)）]/g,'') }
function buildCertIdx(list){
  var exact={},base={},ser={},serNP={};
  list.forEach(function(c){
    var k=certKey(c.kcno);
    if(k){
      if(!exact[k])exact[k]=c;
      var b=k.replace(/[A-Z]$/,'');
      if(!base[b]||(c._exp&&(!base[b]._exp||c._exp>base[b]._exp)))base[b]=c;
    }
    if(c.series){
      var s=serKey(c.series), sn=serKeyNP(c.series);
      if(s&&(!ser[s]||(c._exp&&(!ser[s]._exp||c._exp>ser[s]._exp))))ser[s]=c;
      if(sn&&(!serNP[sn]||(c._exp&&(!serNP[sn]._exp||c._exp>serNP[sn]._exp))))serNP[sn]=c;
    }
  });
  return {exact:exact,base:base,ser:ser,serNP:serNP};
}
function certOf(kcno,kcname){
  if(cert.status!=='ok')return null;
  var i=cert.idx;
  if(kcno){
    var k=certKey(kcno);
    var hit=i.exact[k]||i.base[k.replace(/[A-Z]$/,'')];
    if(hit)return hit;
  }
  if(kcname){
    var s=serKey(kcname);
    if(i.ser[s])return i.ser[s];
    var sn=serKeyNP(kcname);
    if(i.serNP[sn])return i.serNP[sn];
  }
  return null;
}
function ddayTx(c){
  if(!c||c._dday==null)return '';
  if(c._dday<0)return '만료 '+Math.abs(c._dday)+'일 경과';
  return 'D-'+c._dday;
}
function exportCertXlsx(){
  if(typeof XLSX==='undefined'||cert.status!=='ok')return;
  var rows=cert.list.slice().sort(function(a,b){
    var x=a._exp||9e15,y=b._exp||9e15;return x-y;
  }).map(function(c){
    return {'상태':CERT_ST[c._st].label,'관리번호':c.no||'','KC 신고번호':c.kcno,'시리즈':c.series||'',
      '업체명':c.maker||'','성적서번호':c.report||'','발급일':fmtD(c._iss),'유효기간':fmtD(c._exp),
      'D-day':c._dday==null?'':c._dday,'서류':c.doc||'','비고':c.memo||''};
  });
  var ws=XLSX.utils.json_to_sheet(rows);
  ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:rows.length,c:10}})};
  var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'KC인증서');
  var d=new Date();
  XLSX.writeFile(wb,'GAIA_KC인증서_'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'.xlsx');
}

var kcm={status:'idle',map:null,list:null};
function kcKey(o){ return (o.bc?String(o.bc).replace(/\s/g,''):'')||(o.code?String(o.code).replace(/\s/g,''):'')||''; }
function buildKcMaster(){
  var years=YEARS.slice().sort();
  var ready=years.every(function(y){return state.data[y]});
  if(!ready)return null;
  var map={};
  years.forEach(function(y){
    state.data[y].forEach(function(r){
      var k=kcKey(r); if(!k)return;
      var o=map[k]=map[k]||{key:k,bc:'',code:'',name:'',br:'',years:{},src:{}};
      if(r.bc)o.bc=r.bc; if(r.code)o.code=r.code;
      if(r.name||r.desc)o.name=r.name||r.desc; if(r.br)o.br=r.br;
      o.years[y]=true;
      ['req','kct','sales','knet','lotte','kcname','kcno','im','item'].forEach(function(f){
        if(r[f]){ o[f]=r[f]; o.src[f]=y; }
      });
    });

  var list=Object.keys(map).map(function(k){
    var o=map[k];
    o.state=o.kcno?'done':((o.kct||o.kcname)?'prog':(((o.req&&o.req.indexOf('불필요')!==-1)||(o.lotte&&o.lotte.indexOf('불필요')!==-1))?'na':'none'));
    o.yrs=Object.keys(o.years).sort();

/* 영업DB 대비 갱신 대상 산출 */
function kcDiff(){
  if(kcm.status!=='ok'||ms.status!=='ok')return null;
  var byBc={},byNo={};
  ms.list.forEach(function(o){
    if(o.bc)byBc[String(o.bc).replace(/\s/g,'')]=o;
    if(o.no)byNo[String(o.no).replace(/\s/g,'')]=o;
  });
  var add=[],diff=[],miss=[];
  kcm.list.forEach(function(o){
    if(!o.kcno)return;
    var t=byBc[o.bc]||byNo[o.code]||null;
    if(!t){ miss.push(o); return; }
    var cur=(t.kcno||'').replace(/\s/g,'');
    var raw=String(o.kcno).replace(/\s/g,'');
    if(!cur)add.push({kc:o,db:t});
    else if(cur!==raw)diff.push({kc:o,db:t});
  });
  return {add:add,diff:diff,miss:miss};
}

var FAV_KEY='gaia_favbrand_v1';
var favB=null;
function favList(){
  if(favB)return favB;
  try{ var a=JSON.parse(localStorage.getItem(FAV_KEY)||'[]'); favB=Array.isArray(a)?a:[]; }
  catch(e){ favB=[]; }
  return favB;
}
function favHas(b){ return favList().indexOf(b)!==-1 }
function favToggle(b){
  var a=favList().slice(), i=a.indexOf(b);
  if(i>=0)a.splice(i,1); else a.push(b);
  favB=a;
  try{ localStorage.setItem(FAV_KEY,JSON.stringify(a)); }catch(e){}
}
function favSort(names){
  var f=favList();
  return names.slice().sort(function(x,y){
    var fx=f.indexOf(x), fy=f.indexOf(y);
    if(fx>=0&&fy>=0)return fx-fy;
    if(fx>=0)return -1;
    if(fy>=0)return 1;
    return 0;
  });
}
function brandMetrics(rs){
  var all=hy.status==='ok'?Object.keys(hy.agg.mrev).sort():[];
  var last=all.slice(-12), prev=all.length>=24?all.slice(-24,-12):[];
  var by={};
  function get(b){
    return by[b]=by[b]||{rev:0,prev:0,qty:0,stock:0,cnt:0,need:0,short:0,exc:0,
      ord:0,ordAmt:0,dl:0,open:0,mrev:{}};
  }
  rs.forEach(function(r){
    var o=get(r._br||'기타');
    o.ord++;o.ordAmt+=r._amt;
    if(r._st==='done')o.done=(o.done||0)+1;else o.open++;
    if(r._dl)o.dl++;
  });
  if(hy.status==='ok'){
    var A=hy.agg;
    Object.keys(A.brandMrev).forEach(function(b){
      var o=get(b), m=A.brandMrev[b];
      last.forEach(function(x){o.rev+=Math.max(0,m[x]||0)});
      prev.forEach(function(x){o.prev+=Math.max(0,m[x]||0)});
      o.mrev=m;
    });
    Object.keys(A.brandQty||{}).forEach(function(b){
      var o=get(b), q=A.brandQty[b];
      last.forEach(function(x){o.qty+=Math.max(0,q[x]||0)});
    });
    Object.keys(A.brand).forEach(function(b){
      var o=get(b), s=A.brand[b];
      o.stock=s.amt||0;o.cnt=s.cnt||0;o.need=s.need||0;o.short=s.short||0;o.exc=s.exc||0;
    });
  }
  Object.keys(by).forEach(function(b){
    var o=by[b];
    o.growth=(prev.length&&o.prev>0)?((o.rev-o.prev)/o.prev*100):null;
    o.turn=o.stock>0?(o.rev/o.stock):null;
    o.doi=(o.turn&&o.turn>0)?(365/o.turn):null;
    o.avgP=o.qty>0?(o.rev/o.qty):null;
    o.risk=o.need+o.short;
  });
  return {by:by,last:last,prev:prev,hasPrev:prev.length>0};
}

      if(o.short)risk+='<span class="badge b-delay" style="margin-right:4px">품절 '+o.short+'</span>';
      if(o.need)risk+='<span class="badge b-warn" style="margin-right:4px">발주 '+o.need+'</span>';
      if(o.dl)risk+='<span class="badge b-delay">지연 '+o.dl+'</span>';
      if(!risk&&o.exc)risk='<span class="badge b-ship">과잉 '+o.exc+'</span>';
      return '<tr data-go="brand" data-f="b:'+esc(b)+'">'
        +'<td style="font-weight:700">'+(favHas(b)?'<span class="favMark sm">★</span>':'')+esc(b)+'</td>'
        +'<td class="num" style="font-weight:700">'+(o.rev?kFmtKR(o.rev):'—')+'</td>'
        +'<td class="num">'+(o.rev?Math.round(o.rev/total*100)+'%':'—')+'</td>'
        +'<td class="num">'+gTx+'</td>'
        +'<td class="num">'+(o.qty?o.qty.toLocaleString():'—')+'</td>'
        +'<td class="num">'+(o.avgP?Math.round(o.avgP).toLocaleString()+'원':'—')+'</td>'
        +'<td class="num">'+(o.stock?kFmtKR(o.stock):'—')+'</td>'
        +'<td class="num"'+(tCls?' style="color:'+tCls+';font-weight:700"':'')+'>'+(o.turn?o.turn.toFixed(1)+'회':'—')+'</td>'
        +'<td class="num">'+(o.doi?Math.round(o.doi).toLocaleString()+'일':'—')+'</td>'
        +'<td class="num">'+(o.cnt||'—')+'</td>'
        +'<td>'+(risk||'<span style="color:var(--ink-3);font-size:.76rem">양호</span>')+'</td></tr>';
    }).join('')
    +'</tbody></table></div></section>';

  /* 브랜드 카드 */
  var maxRev=Math.max.apply(null,names.map(function(b){return by[b].rev}).concat([1]));
  h+='<div class="bcHead">'
    +'<span class="bcT">브랜드 카드</span>'
    +(favs.length?'<span class="bcSub">★ 주요 브랜드가 앞에 표시됩니다</span>':'<span class="bcSub">★를 눌러 주요 브랜드를 고정하세요</span>')
    +'<button class="chip'+(state.favEdit?' on':'')+'" id="favEdit">'+icon('star')+(state.favEdit?'완료':'주요 브랜드 편집')+'</button>'
    +(favs.length?'<button class="chip" id="favClear">전체 해제</button>':'')
    +'</div>';
  h+='<div class="brandGrid">'+names.map(function(b,i){
    var o=by[b], p=Math.round(o.rev/maxRev*100);
    var g=o.growth;
    var isF=favHas(b);
    return '<div class="card brandCard'+(isF?' fav':'')+'"'+(state.favEdit?'':' data-go="brand" data-f="b:'+esc(b)+'"')+'>'
      +(state.favEdit?'<button class="favBtn'+(isF?' on':'')+'" data-fav="'+esc(b)+'" title="주요 브랜드">'+(isF?'★':'☆')+'</button>'
        :(isF?'<span class="favMark">★</span>':''))
      +'<div class="bn">'+esc(b)
      +(g!=null?'<span class="dl" style="color:'+(g>=0?'var(--g600)':'var(--red)')+'">'+(g>=0?'▲':'▼')+Math.abs(Math.round(g))+'%</span>':'')
      +'</div>'
      +'<div class="ba">'+(o.rev?kFmtKR(o.rev):'—')+'</div>'
      +'<div class="bs">12개월 매출 · 점유 '+(o.rev?Math.round(o.rev/total*100):0)+'%'
      +(o.qty?' · '+o.qty.toLocaleString()+'pcs':'')+'</div>'
      +(o.mrev&&Object.keys(o.mrev).length?sparkline(o.mrev,M.last,BRAND_LINE[i%BRAND_LINE.length]):'')
      +'<div class="mini-bar" style="margin-top:8px"><i style="width:'+p+'%"></i></div>'
      +'<div class="mini-row" style="margin-top:9px"><span>재고 '+(o.stock?kFmtKR(o.stock):'—')+'</span>'
      +'<strong>'+(o.turn?o.turn.toFixed(1)+'회':'—')+'</strong></div>'
      +'</div>';
  }).join('')+'</div>';
  return h;
}

/* 한글 입력(IME) 안전 검색 바인딩 — 조합 중 재렌더 방지 */
function bindSearch(id,setter){
  var el=document.getElementById(id); if(!el)return;
  var composing=false,timer=null;
  var fire=function(){
    clearTimeout(timer);
    timer=setTimeout(function(){
      if(composing)return;
      var pos=el.selectionStart;
      setter(el.value);
      render();
      var n=document.getElementById(id);
      if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} }
    },260);
  };
  el.addEventListener('compositionstart',function(){composing=true;});
  el.addEventListener('compositionend',function(){composing=false;fire();});
  el.addEventListener('input',function(){ if(!composing)fire(); });
  el.addEventListener('keydown',function(e){ if(e.key==='Enter'){clearTimeout(timer);composing=false;setter(el.value);render();var n=document.getElementById(id);if(n)n.focus();} });
}

var BOT_STOP = ('알려 보여 찾아 검색 해줘 하고 좀 뭐야 뭐 뭔지 어떻게 어때 어떤 어느 있어 있나 있는 없는 인가 이거 그거 저거 정보 현황 상태 확인 줘 얼마 개나 대해 대한 관련 지금 현재 전체 모두 목록 리스트 그리고 그럼 것 거 더 진짜 다시 한번 부탁 됐어 됐나 되나 되었 인지 볼까 보자 줄래 줘야 알고 싶어 싶다 궁금 확인해 체크 조회 정리 뽑아 골라 추천 어디 언제 누가 왜 및 등 중 내 이내 까지 부터 요약 비교 계산 건수 몇 올해 작년 내년 이번 다음 지난 저번 그런 이런'

/* 의도 키워드는 검색어가 아니다 — BOT_RULES 에서 자동 수집해 토큰에서 제거한다.
   이 처리가 없으면 "마조렛 카톤 규격"의 '카톤'·'규격'이 상품명 검색어로 섞여
   AND 조건을 만족하는 상품이 없어져 "찾지 못했습니다"가 된다. */
var _botKw=null;
function botKeywords(){
  if(_botKw) return _botKw;
  var s={};
  BOT_RULES.forEach(function(r){ r.w.forEach(function(p){ s[p[0]]=1; }); });
  ['예정','목록','리스트','개월','종','건','개'].forEach(function(w){ s[w]=1; });
  _botKw=s; return s;
}
/* 조사·어미가 붙은 형태까지 걸러낸다 ('재고는' '마진율' '얼마야') */
function botIsNoise(t){
  var kw=botKeywords();
  if(kw[t]) return true;
  if(BOT_STOP.indexOf(t)!==-1) return true;
  var k;
  for(k in kw){ if(k.length>=2 && t.indexOf(k)===0 && t.length-k.length<=3) return true; }
  for(var i=0;i<BOT_STOP.length;i++){
    var s2=BOT_STOP[i];
    if(s2.length>=2 && t.indexOf(s2)===0 && t.length-s2.length<=2) return true;
  }
  return false;
}

function botBrandList(){
  if(bot._brands) return bot._brands;

  (ms.list||[]).forEach(function(o){ var b=normBrand(o.br); if(b&&b!=='기타') set[b]=1; });
  if(hy.status==='ok'&&hy.db) Object.keys(hy.db.items).forEach(function(c){
    var b=normBrand(hy.db.items[c].brand); if(b&&b!=='기타') set[b]=1;

}

/* 질문에서 브랜드를 찾는다 — 별칭(펀코→FUNKO)도 인식 */
function botFindBrand(raw){
  var q = raw.replace(/\s+/g,'');
  for(var i=0;i<BRAND_ALIAS.length;i++){
    var src = BRAND_ALIAS[i][0].source.replace(/^\^\(|\)$/g,'').split('|');
    for(var j=0;j<src.length;j++){
      var w = src[j];
      if(w.length>=2 && q.toLowerCase().indexOf(w.toLowerCase())!==-1) return BRAND_ALIAS[i][1];
    }
  }
  var bl = botBrandList();
  for(var k=0;k<bl.length;k++){
    if(bl[k].length>=2 && q.toLowerCase().indexOf(bl[k].toLowerCase().replace(/\s+/g,''))!==-1) return bl[k];
  }
  return '';
}

/* 기간 표현 → YYYY-MM */
function botFindYM(q){
  if(/(이번\s*달|이번달|금월|이달)/.test(q)) return nowYM();
  if(/(지난\s*달|지난달|전월|저번\s*달)/.test(q)) return prevYM();
  if(/(다음\s*달|다음달|내달|차월|담달)/.test(q)) return nextYM();
  var m = q.match(/(20\d{2})\s*[년\-./]\s*(\d{1,2})\s*월?/);
  if(m) return m[1]+'-'+String(m[2]).padStart(2,'0');
  m = q.match(/(^|[^0-9])(\d{1,2})\s*월/);
  if(m){
    var mo=parseInt(m[2],10);
    if(mo>=1&&mo<=12) return String(new Date().getFullYear())+'-'+String(mo).padStart(2,'0');
  }
  return '';
}

function botExtract(raw){
  var q = String(raw||'');
  var lq = q.toLowerCase();
  var e = { raw:q, lq:lq, bc:'', code:'', brand:'', ym:'', months:0, topN:0, tokens:[] };

  var mb = q.match(/\b(\d{8,14})\b/);
  if(mb) e.bc = mb[1];
  var mc = q.match(/\b([A-Za-z]{2,}[-]?\d{4,}[A-Za-z0-9]*|\d{6,}[A-Za-z]\w*)\b/);
  if(mc && mc[1]!==e.bc) e.code = mc[1];

  e.brand = botFindBrand(q);
  e.ym = botFindYM(q);

  var mm = q.match(/(\d{1,2})\s*개?\s*월/);
  if(mm && !/^\d{1,2}월$/.test(mm[0].replace(/\s/g,''))) e.months = parseInt(mm[1],10);
  if(/반\s*년/.test(q)) e.months = 6;

  var mt = q.match(/(?:top|상위|상위권)\s*(\d{1,3})|(\d{1,3})\s*(?:개|건|종)\s*(?:만|정도)?/i);
  if(mt) e.topN = parseInt(mt[1]||mt[2],10);

  /* 검색 토큰 — 브랜드명·숫자·불용어 제거 후 남은 의미 단어 */
  var strip = q;
  if(e.bc) strip = strip.replace(e.bc,' ');
  if(e.code) strip = strip.replace(e.code,' ');
  strip = strip.replace(/[?!.,·\/]/g,' ');
  strip.split(/\s+/).forEach(function(t){
    t = t.trim().toLowerCase();
    if(t.length<2) return;
    if(/^\d+$/.test(t)) return;
    if(botIsNoise(t)) return;
    e.tokens.push(t);
  });
  return e;
}

function botClassify(e){
  /* 규칙마다 점수를 다 매겨두고, 1등과 2등이 사실상 동점이면(=키워드가 서로
     다른 업무를 동시에 가리키면) 아무거나 짚어서 틀리기보다 어떤 걸 물으신 건지
     되물어 확인한다 — "정확한 자료를 추출"하려면 애매할 때 추측하지 않는 게 먼저다. */
  var scores=[];
  BOT_RULES.forEach(function(r){
    var s=0;
    r.w.forEach(function(p){ if(e.lq.indexOf(p[0])!==-1) s+=p[1]; });
    if(s>0) scores.push({k:r.k,s:s});
  });
  scores.sort(function(a,b){ return b.s-a.s; });
  if(scores.length){
    /* 실제 업무 키워드 점수로 걸린 경우만 표시해둔다 — 신원(자기소개) 캡처 로직이
       "업무 질문 중인지"를 판단할 때, 아래 폴백(단서 없이 토큰만 있으면 상품 조회로
       넘기는 약한 추측)과 구분하기 위함. 순수 자기소개 문장엔 업무 키워드가 없다. */
    e._ruleScored=true;
    if(scores.length>1 && (scores[0].s-scores[1].s)<=1){
      e._ambigCats=[scores[0].k, scores[1].k];
      return 'clarify';
    }
    return scores[0].k;
  }
  /* 업무 키워드가 없으면: 인사·잡담·회사소개(심심이 레이어)를 먼저 보고,
     그 다음 직원 성함·팀 조회(조직도)를 본다. 그래도 안 걸리면
     바코드·코드·상품명 토큰이 있는지로 상품 조회를 시도한다.
     회사·신원·기억처럼 "정확한 답"이 있는 잡담(det:true)은 그대로 규칙 답변을,
     인사·농담 같은 분위기용 잡담과 완전히 못 알아들은 문장은 실제 AI(갈슨 성격의
     Claude API)로 넘겨 더 자연스러운 대화를 시도한다 — 실패 시 규칙 답변으로 되돌아간다. */
  var cm=botCasualMatch(e.raw);
  if(cm){ e._casual=cm; return cm.det ? 'casual' : 'ai'; }
  var sm=botStaffMatch(e.raw);
  if(sm){ e._staff=sm; return 'staff'; }
  if(e.bc||e.code||e.tokens.length) return 'product';
  return 'ai';
}

/* ---------- 상품 검색 ---------- */
/* 상품 검색 — 완전일치가 있으면 그것만, 없으면 '가장 많이 맞은' 후보를 돌려준다.
   질문에 잡음이 섞여도(예: "재고 얼마야") 상품을 놓치지 않게 하기 위한 것. */
function botFind(e, limit){
  limit = limit||300;
  if(ms.status!=='ok') return [];

  if(e.bc){
    var nb=normBc(e.bc);
    for(var i=0;i<ms.list.length;i++){
      if(normBc(ms.list[i].bc)===nb){ botRemember(ms.list[i]); return [ms.list[i]]; }
    }
  }
  var codeU = e.code?e.code.toUpperCase().replace(/[^A-Z0-9]/g,''):'';
  var toks  = e.tokens;
  var cand  = [];

  for(var j=0;j<ms.list.length;j++){
    var o=ms.list[j];
    if(e.brand && normBrand(o.br)!==e.brand) continue;
    var od=ordAttr(o.bc)||{};
    var sc=0, hits=0;

    if(codeU){
      var pool=[o.no,od.item,od.code].filter(Boolean)
        .map(function(x){return String(x).toUpperCase().replace(/[^A-Z0-9]/g,'')});
      for(var p=0;p<pool.length;p++){
        if(!pool[p]) continue;
        if(pool[p]===codeU){ sc=200; break; }
        if(pool[p].indexOf(codeU)===0||codeU.indexOf(pool[p])===0){ if(sc<100) sc=100; }
      }
    }
    if(toks.length){
      /* 상품명·코드뿐 아니라 카탈로그(재질·제조국·연령·색상·특징)와 코리안넷(분류)
         텍스트까지 검색 범위에 넣어, "중국산 상품", "봉제인형 뭐있어" 같은
         속성·카테고리 기반 자료 검색도 되게 한다 */
      var cd2=catDetail(o)||{}, kn2=knOf(o.bc)||{};
      var hay=[o.name,o.no,o.bc,o.br,od.item,od.code,od.name,od.desc,
               cd2.mt,cd2.oc,cd2.ag,cd2.cl,cd2.ft,kn2.nm,kn2.cg]
        .filter(Boolean).join(' ').toLowerCase();
      for(var t=0;t<toks.length;t++){
        var tok=toks[t];
        if(hay.indexOf(tok)!==-1){ hits++; continue; }
        var tokAlt=tok.replace(/산$/,'');   /* "중국산"→"중국" 처럼 원산지 접미 흡수 */
        if(tokAlt!==tok && tokAlt.length>=2 && hay.indexOf(tokAlt)!==-1) hits++;
      }
    }
    if(sc===0 && hits===0){
      /* 브랜드만 지정된 질문은 그 브랜드 전체가 후보 */
      if(e.brand && !toks.length && !codeU) cand.push({o:o,sc:0,hits:0});
      continue;
    }
    cand.push({o:o,sc:sc,hits:hits});
  }
  if(!cand.length) return [];
  if(!toks.length && !codeU) return cand.slice(0,limit).map(function(x){return x.o});

  var maxSc=0;
  cand.forEach(function(x){ if(x.sc>maxSc) maxSc=x.sc; });
  var pool2=cand.filter(function(x){ return x.sc===maxSc; });
  var maxHits=0;
  pool2.forEach(function(x){ if(x.hits>maxHits) maxHits=x.hits; });
  if(maxSc===0 && maxHits===0) return [];
  var res = pool2.filter(function(x){ return x.hits===maxHits; }).slice(0,limit)
                 .map(function(x){ return x.o; });
  if(res.length===1) botRemember(res[0]);
  return res;
}

  }
  var base={
    product :['발주필요 목록','3개월 내 KC 만료'],

    cost    :['브랜드별 발주액 TOP 10','발주필요 목록'],
    sales   :['매출 TOP 5 브랜드','이번달 발주필요 목록'],
    analysis:['지난달 발주','지연 오더','발주필요 목록'],
    casual  :['가이아 브랜드 뭐 있어','오늘의 한마디','이번달 입고 예정'],
    staff   :['가이아 브랜드 뭐 있어','이번달 입고 예정'],
    ai      :['이번달 입고 예정','발주필요 목록','가이아 브랜드 뭐 있어']
  }[k]||[];
  base.forEach(function(t){ if(out.indexOf(t)===-1) out.push(t); });
  /* 방금 한 질문과 사실상 같은 제안은 뺀다 */
