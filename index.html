<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAIA MD 운영포털</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --red:#D5001F; --red-soft:#FDECEF;
  --bg:#F1F2F4; --card:#FFFFFF; --ink:#1A1C1F; --ink-2:#5F646C; --ink-3:#9CA1A9;
  --line:#E3E4E8; --line-soft:#EEEFF2; --hover:#F6F6F7;
  --top:#1A1A1D; --top-ink:#E8E8EA; --top-mut:#9A9AA0; --top-in:#2E2E33;
  --ordered:#8A8F98; --prod:#2C6ECB; --ship:#7B3FF2; --done:#128A54; --delay:#D5001F;
  --ok-bg:#DCF5E8; --ok-tx:#0E7A49; --warn-bg:#FFF1D6; --warn-tx:#996F00;
  --crit-bg:#FEDBD7; --crit-tx:#C5280C; --info-bg:#EAF1FB; --info-tx:#2C6ECB;
  --neu-bg:#EDEEF1; --neu-tx:#5F646C; --ship-bg:#F0E9FE; --ship-tx:#6B32E0;
  --fs:13.8px; --side-w:232px;
  --sh:0 1px 0 rgba(22,23,26,.05),0 1px 2px rgba(22,23,26,.06);
  --sh-md:0 3px 8px rgba(22,23,26,.08);
  --r:12px;
}
body.meeting{ --fs:17px; --side-w:60px; }
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:var(--fs)}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,'Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
select,input{font-family:inherit;font-size:.92rem;color:var(--ink)}
a{color:inherit}
svg.lucide{width:1.05em;height:1.05em;stroke-width:1.8;flex:none;vertical-align:-2px}

/* ================= 다크 톱바 ================= */
#topbar{position:sticky;top:0;z-index:50;background:var(--top);color:var(--top-ink);display:flex;align-items:center;gap:12px;padding:0 16px;height:52px}
.tb-brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:.95rem;letter-spacing:.02em;white-space:nowrap}
.tb-brand .mark{width:26px;height:26px;border-radius:7px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.85rem}
.tb-search{flex:1;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:8px;background:var(--top-in);border:1px solid #3A3A40;border-radius:9px;padding:7px 12px;color:var(--top-mut)}
.tb-search input{border:none;background:none;outline:none;flex:1;min-width:0;color:var(--top-ink)}
.tb-search input::placeholder{color:var(--top-mut)}
.tb-right{display:flex;align-items:center;gap:8px;white-space:nowrap}
.yearSeg{display:flex;background:var(--top-in);border:1px solid #3A3A40;border-radius:9px;padding:3px}
.yearSeg button{padding:4px 12px;border-radius:6px;font-size:.83rem;font-weight:700;color:var(--top-mut)}
.yearSeg button.on{background:#fff;color:var(--top)}
.tb-btn{display:flex;align-items:center;gap:6px;padding:7px 11px;border-radius:9px;font-size:.83rem;font-weight:600;color:var(--top-ink);border:1px solid #3A3A40;background:transparent}
.tb-btn:hover{background:var(--top-in)}
.tb-btn.meet.on{background:#fff;color:var(--top);border-color:#fff}
@media(max-width:900px){.tb-brand .bt{display:none}.tb-btn span{display:none}}

/* ================= 레이아웃 ================= */
#shell{display:flex;min-height:calc(100vh - 52px)}
#side{width:var(--side-w);min-width:var(--side-w);padding:14px 10px;transition:width .2s,min-width .2s;overflow:hidden;height:calc(100vh - 52px);position:sticky;top:52px;overflow-y:auto}
.nav-label{font-size:.66rem;letter-spacing:.09em;color:var(--ink-3);font-weight:700;padding:14px 12px 6px;white-space:nowrap}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 12px;border-radius:9px;font-size:.9rem;font-weight:600;color:var(--ink-2);white-space:nowrap;margin-bottom:1px;text-decoration:none}
.nav-item:hover{background:rgba(0,0,0,.05)}
.nav-item.on{background:var(--card);color:var(--ink);box-shadow:var(--sh);font-weight:700}
.nav-item.on svg{color:var(--red)}
.nav-item.off{opacity:.45;cursor:default}
.nav-item .cnt{margin-left:auto;font-size:.69rem;font-weight:700;background:var(--neu-bg);color:var(--ink-2);border-radius:99px;padding:2px 8px}
.nav-item .cnt.hot{background:var(--red);color:#fff}
.nav-item.sub{padding-left:34px;font-size:.84rem}
body.meeting .nav-label,body.meeting .nav-item .tx,body.meeting .nav-item .cnt,body.meeting .nav-item .ext{display:none}
#content{flex:1;min-width:0;padding:22px 26px 70px;max-width:1340px;margin:0 auto}

/* ================= 공통 ================= */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.page-head{display:flex;align-items:flex-end;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.page-head h2{font-size:1.35rem;font-weight:800;letter-spacing:-.015em}
.page-head p{font-size:.85rem;color:var(--ink-2);margin-top:4px}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:.73rem;font-weight:700;white-space:nowrap}
.b-ordered{background:var(--neu-bg);color:var(--neu-tx)}
.b-prod{background:var(--info-bg);color:var(--info-tx)}
.b-ship{background:var(--ship-bg);color:var(--ship-tx)}
.b-done{background:var(--ok-bg);color:var(--ok-tx)}
.b-delay{background:var(--crit-bg);color:var(--crit-tx)}
.b-warn{background:var(--warn-bg);color:var(--warn-tx)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 12px;border:1px solid var(--line);border-radius:9px;font-size:.81rem;font-weight:600;color:var(--ink-2);background:var(--card)}
.chip:hover{background:var(--hover)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.empty{padding:48px 20px;text-align:center;color:var(--ink-3);font-size:.9rem}
.section-head{display:flex;align-items:center;gap:8px;padding:15px 18px 10px}
.section-head h3{font-size:.93rem;font-weight:700}
.section-head .sub{margin-left:auto;font-size:.79rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.section-head .lnk{margin-left:auto;font-size:.8rem;color:var(--info-tx);font-weight:700;cursor:pointer}

/* 메트릭 카드 */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:14px}
.metric{padding:15px 17px;cursor:pointer;transition:box-shadow .12s}
.metric:hover{box-shadow:var(--sh-md)}
.metric .ml{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;color:var(--ink-2)}
.metric .ml svg{color:var(--ink-3)}
.metric .mv{font-size:1.65rem;font-weight:800;letter-spacing:-.02em;margin-top:7px;font-variant-numeric:tabular-nums}
body.meeting .metric .mv{font-size:2.3rem}
.metric .mv small{font-size:.52em;font-weight:600;color:var(--ink-3);margin-left:1px}
.metric .md{font-size:.76rem;margin-top:5px;color:var(--ink-3)}
.metric .md b.up{color:var(--ok-tx)} .metric .md b.dn{color:var(--crit-tx)}
.metric.alert .mv{color:var(--red)}

/* 대시보드 그리드 */
.g-2-1{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:14px}
.g-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px}
@media(max-width:1080px){.g-2-1{grid-template-columns:1fr}.g-3{grid-template-columns:1fr}}

/* SVG 차트 */
.chartWrap{padding:6px 14px 14px}
.chartWrap svg{width:100%;height:auto;display:block}
.bar-g{cursor:pointer}
.bar-g:hover rect{opacity:.75}
.donutWrap{display:flex;align-items:center;gap:18px;padding:8px 18px 18px;flex-wrap:wrap}
.donutWrap svg{width:150px;height:150px;flex:none}
.dLegend{flex:1;min-width:150px;display:flex;flex-direction:column;gap:8px}
.dRow{display:flex;align-items:center;gap:9px;font-size:.84rem;cursor:pointer;padding:4px 6px;border-radius:7px}
.dRow:hover{background:var(--hover)}
.dRow .sw{width:10px;height:10px;border-radius:3px;flex:none}
.dRow b{margin-left:auto;font-variant-numeric:tabular-nums}
.dRow span.a{color:var(--ink-3);font-size:.76rem;font-variant-numeric:tabular-nums}

/* 업무 리스트/준비율 */
.task-list{padding:2px 8px 10px}
.task-row{display:flex;align-items:center;gap:11px;padding:10px 10px;border-radius:9px;cursor:pointer}
.task-row:hover{background:var(--hover)}
.task-icon{width:34px;height:34px;border-radius:9px;background:var(--neu-bg);display:flex;align-items:center;justify-content:center;color:var(--ink-2);flex:none}
.task-row.hot .task-icon{background:var(--crit-bg);color:var(--crit-tx)}
.task-copy{min-width:0}
.task-copy strong{display:block;font-size:.86rem}
.task-copy span{font-size:.74rem;color:var(--ink-3)}
.task-n{margin-left:auto;font-size:.94rem;font-weight:800;font-variant-numeric:tabular-nums}
.task-row.hot .task-n{color:var(--red)}
.task-row.ok .task-n{color:var(--ok-tx)}
.prog-wrap{padding:0 18px 16px}
.prog-big{font-size:1.9rem;font-weight:800}
.prog-big small{font-size:.45em;color:var(--ink-3);font-weight:600}
.progress-track{height:8px;border-radius:99px;background:var(--line-soft);overflow:hidden;margin:8px 0 13px}
.progress-fill{height:100%;border-radius:99px;background:var(--done);transition:width .5s}
.mini-rows{display:flex;flex-direction:column;gap:8px}
.mini-row{display:flex;align-items:center;font-size:.83rem}
.mini-row span{color:var(--ink-2)}
.mini-row strong{margin-left:auto;font-variant-numeric:tabular-nums}
.mini-bar{height:4px;border-radius:99px;background:var(--line-soft);margin-top:4px;overflow:hidden}
.mini-bar i{display:block;height:100%;background:var(--prod);border-radius:99px}

/* 툴바/테이블 */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input[type=text]{padding:8px 12px;border:1px solid var(--line);border-radius:9px;width:230px;background:var(--card);box-shadow:var(--sh)}
.toolbar select{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);box-shadow:var(--sh)}
.toolbar .sum{margin-left:auto;font-size:.83rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.toolbar .sum b{color:var(--ink)}
.seg{display:flex;background:var(--neu-bg);border-radius:9px;padding:3px}
.seg button{padding:5px 11px;border-radius:7px;font-size:.82rem;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.tblWrap{overflow:auto;border-radius:0 0 var(--r) var(--r)}
table.tbl{width:100%;border-collapse:collapse;font-size:.855rem}
.tbl th{position:sticky;top:0;background:var(--card);text-align:left;font-size:.72rem;font-weight:600;color:var(--ink-2);padding:9px 13px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:5}
.tbl td{padding:9px 13px;border-bottom:1px solid var(--line-soft);white-space:nowrap;vertical-align:middle}
.tbl td.name{max-width:320px;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--hover)}
.tbl tr.rowDelay td:first-child{box-shadow:inset 3px 0 0 var(--red)}

/* 보드 */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start}
@media(max-width:1100px){.board{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.board{grid-template-columns:1fr}}
.bcol .bhead{padding:11px 14px;border-bottom:1px solid var(--line-soft);display:flex;align-items:baseline;gap:8px}
.bcol .bhead .dot{width:9px;height:9px;border-radius:50%;background:var(--bc);align-self:center}
.bcol .bhead .bt{font-weight:700;font-size:.86rem}
.bcol .bhead .bn{font-weight:800;font-size:.95rem;color:var(--ink-2)}
.bcol .bhead .ba{margin-left:auto;font-size:.74rem;color:var(--ink-3);font-variant-numeric:tabular-nums}
.bcol .bbody{padding:9px;display:flex;flex-direction:column;gap:7px;max-height:66vh;overflow-y:auto}
.bcard{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer;font-size:.82rem;box-shadow:var(--sh)}
.bcard:hover{box-shadow:var(--sh-md)}
.bcard.dl{border-left:3px solid var(--red)}
.bcard .t{font-weight:700;margin-bottom:4px;line-height:1.35}
.bcard .m{color:var(--ink-2);font-size:.75rem;display:flex;gap:8px;flex-wrap:wrap}

/* 브랜드 카드 */
.brandGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px}
.brandCard{padding:15px 17px;cursor:pointer;transition:box-shadow .12s}
.brandCard:hover{box-shadow:var(--sh-md)}
.brandCard .bn{font-weight:800;font-size:.97rem;display:flex;align-items:center}
.brandCard .bn .dl{margin-left:auto;font-size:.71rem;color:var(--red);font-weight:700}
.brandCard .ba{font-size:1.25rem;font-weight:800;margin:7px 0 2px;font-variant-numeric:tabular-nums}
.brandCard .bs{font-size:.77rem;color:var(--ink-3);margin-bottom:9px}

/* 월 그룹 */
.month{margin-bottom:13px}
.month .mhead{display:flex;align-items:baseline;gap:10px;padding:13px 17px;border-bottom:1px solid var(--line-soft)}
.month .mhead .mt{font-size:.96rem;font-weight:800}
.month.now .mhead .mt{color:var(--red)}
.month .mhead .mtag{font-size:.67rem;font-weight:700;color:#fff;background:var(--red);border-radius:99px;padding:2px 9px}
.month .mhead .ms{margin-left:auto;font-size:.79rem;color:var(--ink-2);font-variant-numeric:tabular-nums}

/* 상세 패널 */
#ovl{position:fixed;inset:0;background:rgba(18,20,26,.4);opacity:0;pointer-events:none;transition:.2s;z-index:80}
#ovl.on{opacity:1;pointer-events:auto}
#panel{position:fixed;top:0;right:-480px;width:460px;max-width:94vw;height:100vh;background:var(--card);z-index:90;transition:right .25s;display:flex;flex-direction:column;box-shadow:-16px 0 44px rgba(0,0,0,.16)}
#panel.on{right:0}
#panel .phead{padding:20px 22px 14px;border-bottom:1px solid var(--line)}
#panel .phead .pb{font-size:.77rem;font-weight:700;color:var(--red);margin-bottom:5px}
#panel .phead h3{font-size:1rem;line-height:1.4;padding-right:30px}
#panel .pclose{position:absolute;top:13px;right:13px;font-size:1.15rem;color:var(--ink-3);padding:4px 8px}
#panel .pbody{flex:1;overflow-y:auto;padding:16px 22px}
.dl-grid{display:grid;grid-template-columns:106px 1fr;gap:9px 12px;font-size:.85rem}
.dl-grid dt{color:var(--ink-3);font-weight:600}
.dl-grid dd{font-weight:600;word-break:break-all}
#panel .pfoot{padding:14px 22px;border-top:1px solid var(--line)}
#panel .pfoot a{display:block;text-align:center;background:var(--ink);color:#fff;font-weight:700;padding:11px;border-radius:9px;text-decoration:none;font-size:.87rem}

/* 상태 */
#notice{margin-bottom:14px;border-radius:11px;padding:12px 16px;font-size:.85rem;display:none}
#notice.err{display:block;background:var(--crit-bg);color:var(--crit-tx)}
#loading{display:none;align-items:center;gap:10px;padding:36px;justify-content:center;color:var(--ink-2);font-size:.87rem}
#loading.on{display:flex}
.spin{width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#updated{font-size:.73rem;color:var(--ink-3);margin-top:14px}

@media(max-width:760px){
  #shell{flex-direction:column}
  #side{width:100%;min-width:100%;height:auto;position:static;display:flex;overflow-x:auto;padding:6px 8px}
  .nav-label{display:none}
  .nav-item .cnt{display:none}
  .nav-item.sub{padding-left:12px}
  #content{padding:16px 14px 60px}
  .tb-search{display:none}
}
</style>
</head>
<body>

<div id="topbar">
  <div class="tb-brand"><span class="mark">G</span><span class="bt">GAIA&nbsp;TOYS</span></div>
  <div class="tb-search"><i data-lucide="search"></i><input id="gq" type="text" placeholder="품목명 · ITEM# · 바코드 · BL# 통합검색"></div>
  <div class="tb-right">
    <div class="yearSeg" id="yearSeg"></div>
    <button class="tb-btn" id="btnRefresh" title="시트에서 새로 불러오기"><i data-lucide="refresh-cw"></i></button>
    <a class="tb-btn" id="btnSheet" href="#" target="_blank" rel="noopener" title="구글 시트 열기"><i data-lucide="external-link"></i></a>
    <button class="tb-btn meet" id="btnMeeting"><i data-lucide="presentation"></i><span>회의 모드</span></button>
  </div>
</div>

<div id="shell">
<aside id="side">
  <nav id="nav">
    <div class="nav-label">WORKSPACE</div>
    <button class="nav-item on" data-view="dash"><i data-lucide="house"></i><span class="tx">홈</span></button>
    <a class="nav-item" href="https://gaia-hyhong.github.io/Hayoung-MD-Dashboard/" target="_blank" rel="noopener"><i data-lucide="warehouse"></i><span class="tx">재고/발주</span><i class="ext" data-lucide="external-link" style="margin-left:auto;width:.85em;height:.85em;color:var(--ink-3)"></i></a>
    <a class="nav-item" href="https://newceo-dot.github.io/inbound-dashboard/" target="_blank" rel="noopener"><i data-lucide="container"></i><span class="tx">입고관리 시스템</span><i class="ext" data-lucide="external-link" style="margin-left:auto;width:.85em;height:.85em;color:var(--ink-3)"></i></a>
    <button class="nav-item" data-view="kc"><i data-lucide="shield-check"></i><span class="tx">KC 인증</span><span class="cnt" id="cntKc"></span></button>
    <button class="nav-item" data-view="brands"><i data-lucide="tags"></i><span class="tx">브랜드 현황</span></button>
    <a class="nav-item sub" href="https://gaiacatalog-4n3mekcg.manus.space/?code=6q8PbzYNYPfMPETtqBVzFZ" target="_blank" rel="noopener"><i data-lucide="layout-grid" style="width:.95em;height:.95em"></i><span class="tx">상품 카탈로그</span><i class="ext" data-lucide="external-link" style="margin-left:auto;width:.8em;height:.8em;color:var(--ink-3)"></i></a>
    <button class="nav-item" data-view="master"><i data-lucide="package-search"></i><span class="tx">상품 마스터</span><span class="cnt" id="cntMaster"></span></button>
    <div class="nav-label">확장 예정</div>
    <button class="nav-item off"><i data-lucide="chart-no-axes-combined"></i><span class="tx">판매·재고 분석</span></button>
  </nav>
</aside>

<div id="content">
  <div id="notice"></div>
  <div id="loading"><div class="spin"></div>데이터를 불러오는 중…</div>
  <div id="view"></div>
  <div id="updated"></div>
</div>
</div>

<div id="ovl" onclick="closePanel()"></div>
<div id="panel">
  <div class="phead">
    <button class="pclose" onclick="closePanel()">✕</button>
    <div class="pb" id="pBrand"></div>
    <h3 id="pName"></h3>
  </div>
  <div class="pbody"><dl class="dl-grid" id="pGrid"></dl></div>
  <div class="pfoot"><a id="pLink" href="#" target="_blank" rel="noopener">시트에서 이 행 열기 ↗</a></div>
</div>

<script>
/* ================= 설정 ================= */
var GAS_URL = 'https://script.google.com/macros/s/AKfycbzZUJpnGhilu7SZY3ykWNRdE-kTDOS41i1MrXTPLe0P0G1ghh-KlDAzMUeB7tiCVnoK/exec';

var YEARS = ['2024','2025','2026'];
var state = { year:'2026', view:'dash', omode:'list', data:{}, meta:{},
  f:{ q:'', brand:'', status:'', im:'' }, kcf:'', kccf:'' };

var ST = {
  ordered:{label:'발주',    cls:'b-ordered', color:'#8A8F98'},
  prod:   {label:'생산중',  cls:'b-prod',    color:'#2C6ECB'},
  ship:   {label:'선적/통관',cls:'b-ship',   color:'#7B3FF2'},
  done:   {label:'입고완료',cls:'b-done',    color:'#128A54'}
};

function kFmt(n){ if(n>=1e6)return '$'+(n/1e6).toFixed(1)+'M'; if(n>=1e3)return '$'+Math.round(n/1e3)+'K'; return '$'+Math.round(n) }
function nowYM(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function nextYM(){var d=new Date();d.setMonth(d.getMonth()+1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function prevYM(){var d=new Date();d.setMonth(d.getMonth()-1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function parseYM(s){var m=String(s||'').match(/(20\d{2})\s*[-./]\s*(\d{1,2})/);return m?m[1]+'-'+m[2].padStart(2,'0'):null}
function fmtYM(ym){if(!ym)return'';var p=ym.split('-');return p[0]+'년 '+parseInt(p[1],10)+'월'}

function statusOf(r){if(r.ind)return'done';if(r.bl||r.obl||r.etd)return'ship';if(r.sc)return'prod';return'ordered'}
function isDelayed(r){if(r.ind)return false;var ym=parseYM(r.im);return !!(ym&&ym<nowYM())}
function kcStateOf(r){
  if((r.req&&r.req.indexOf('불필요')!==-1)||(r.lotte&&r.lotte.indexOf('불필요')!==-1)||(r.knet&&r.knet.indexOf('불필요')!==-1))return'na';

function derive(rs){
  var cur=nowYM(),nxt=nextYM(),prv=prevYM();
  var d={
    delayed:rs.filter(function(r){return r._dl}),
    thisMonth:rs.filter(function(r){return parseYM(r.im)===cur}),
    prevMonth:rs.filter(function(r){return parseYM(r.im)===prv}),
    open:rs.filter(function(r){return r._st!=='done'}),
    done:rs.filter(function(r){return r._st==='done'}),
    etdMiss:rs.filter(function(r){var y=parseYM(r.im);return y&&y<=nxt&&!r.etd&&!r.ind}),
    kcUrgent:rs.filter(function(r){var y=parseYM(r.im);return y&&y<=nxt&&!r.ind&&(r._kc==='none')}),
    kcTodo:rs.filter(function(r){return r._kc==='none'||r._kc==='prog'}),
    onWater:rs.filter(function(r){return r._st==='ship'})
  };
  d.totalAmt=rs.reduce(function(a,r){return a+r._amt},0);
  d.tmAmt=d.thisMonth.reduce(function(a,r){return a+r._amt},0);
  return d;
}
function readiness(g){
  var n=g.length||1;
  var etd=g.filter(function(r){return r.etd||r.ind}).length;
  var bl=g.filter(function(r){return r.bl||r.obl||r.ind}).length;
  var kc=g.filter(function(r){return r._kc==='done'||r._kc==='na'}).length;
  var ind=g.filter(function(r){return r.ind}).length;
  return {n:g.length,etd:etd,bl:bl,kc:kc,ind:ind,pct:Math.round((etd+bl+kc+ind)/(n*4)*100)};
}

var jsonpSeq=0;
function jsonp(params){
  return new Promise(function(res,rej){
    var cb='__gaia_cb'+(++jsonpSeq);
    var s=document.createElement('script');
    var to=setTimeout(function(){cleanup();rej(new Error('요청 시간 초과(60초)'));},60000);
    function cleanup(){clearTimeout(to);delete window[cb];if(s.parentNode)s.parentNode.removeChild(s);}
    window[cb]=function(d){cleanup();res(d);};
    var qs=Object.keys(params).map(function(k){return k+'='+encodeURIComponent(params[k])}).join('&');
    s.src=GAS_URL+'?'+qs+'&callback='+cb;
    s.onerror=function(){cleanup();rej(new Error('네트워크 오류 — 배포 액세스 권한(모든 사용자) 확인'));};
    document.body.appendChild(s);
  });
}

function svgMonthlyChart(rs){
  var cur=nowYM();
  var byM={};rs.forEach(function(r){var y=parseYM(r.im);if(y){byM[y]=byM[y]||{n:0,a:0};byM[y].n++;byM[y].a+=r._amt;}});
  var ms=Object.keys(byM).sort();
  if(!ms.length)return '<div class="empty">입고 월 데이터 없음</div>';
  var W=Math.max(560,ms.length*64),H=230,pad=8,bottom=26,top=26;
  var maxA=Math.max.apply(null,ms.map(function(m){return byM[m].a}));
  var bw=Math.min(38,(W-pad*2)/ms.length*0.55);
  var step=(W-pad*2)/ms.length;
  var bars=ms.map(function(m,i){
    var v=byM[m].a,h=Math.max(3,(H-top-bottom)*(v/maxA));
    var x=pad+step*i+(step-bw)/2,y=H-bottom-h;
    var isCur=m===cur, past=m<cur;
    var fill=isCur?'#D5001F':(past?'#C9CCD2':'#1A1C1F');
    return '<g class="bar-g" data-go="orders" data-f="im:'+m+'">'
      +'<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+h+'" rx="5" fill="'+fill+'"></rect>'
      +'<text x="'+(x+bw/2)+'" y="'+(y-7)+'" text-anchor="middle" font-size="10.5" font-weight="700" fill="'+(isCur?'#D5001F':'#5F646C')+'">'+kFmt(v)+'</text>'
      +'<text x="'+(x+bw/2)+'" y="'+(H-9)+'" text-anchor="middle" font-size="10.5" font-weight="'+(isCur?'800':'600')+'" fill="'+(isCur?'#D5001F':'#9CA1A9')+'">'+moLabel(m)+'</text>'
      +'<title>'+fmtYM(m)+' · '+byM[m].n+'건 · '+fmtUSD(v)+'</title></g>';
  }).join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'
    +'<line x1="'+pad+'" y1="'+(H-bottom+4)+'" x2="'+(W-pad)+'" y2="'+(H-bottom+4)+'" stroke="#E3E4E8"/>'+bars+'</svg>';
}
function svgDonut(rs){

/* ================= 재고·발주 데이터 연동 (Hayoung Dashboard) ================= */
var HY_URLS=[
  'https://gaia-hyhong.github.io/Hayoung-MD-Dashboard/index.html',
  'https://raw.githubusercontent.com/gaia-hyhong/Hayoung-MD-Dashboard/main/index.html'
];
var hy={status:'loading',db:null,agg:null,err:''};
var HY_CLS={
  '정상':    {color:'#128A54', cls:'b-done'},
  '신규':    {color:'#2C6ECB', cls:'b-prod'},
  '발주필요':{color:'#E8A200', cls:'b-warn'},
  '품절위험':{color:'#D5001F', cls:'b-delay'},
  '과잉/악성':{color:'#7B3FF2', cls:'b-ship'},
  '무재고':  {color:'#8A8F98', cls:'b-ordered'}
};
function extractJSONVar(src,name){
  var re=new RegExp('(?:var|const|let)\\s+'+name+'\\s*=\\s*');
  var m=re.exec(src); if(!m)return null;
  var iO=src.indexOf('{',m.index+m[0].length), iA=src.indexOf('[',m.index+m[0].length);
  var i=(iO===-1)?iA:(iA===-1?iO:Math.min(iO,iA)); if(i===-1)return null;
  var depth=0,inStr=false,q='';
  for(var j=i;j<src.length;j++){
    var c=src[j];
    if(inStr){ if(c==='\\')j++; else if(c===q)inStr=false; }
    else{
      if(c==='"'||c==="'"){inStr=true;q=c;}
      else if(c==='{'||c==='[')depth++;
      else if(c==='}'||c===']'){depth--; if(depth===0)return src.slice(i,j+1);}
    }
  }
  return null;
}
function fetchHayoung(idx){
  idx=idx||0;
  if(idx>=HY_URLS.length){hy.status='error';hy.err='재고 데이터 소스에 연결할 수 없음';if(state.view==='dash')render();return;}
  fetch(HY_URLS[idx]).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.text();
  }).then(function(t){
    var raw=extractJSONVar(t,'DB');
    if(!raw)throw new Error('DB 추출 실패');
    hy.db=JSON.parse(raw);
    hy.agg=hyAggregate(hy.db);
    try{ hy.kc=JSON.parse(extractJSONVar(t,'KC_DATA')||'[]'); }catch(e){ hy.kc=[]; }
    hy.kcAgg=hyKcAggregate(hy.kc);
    hy.status='ok';
    if(state.view==='dash'||state.view==='kc'||state.view==='master')render();
  }).catch(function(e){ fetchHayoung(idx+1); });
}
function hyAggregate(db){
  var items=db.items,codes=Object.keys(items);
  var a={gen:db.gen,curym:db.curym,channels:db.channels||[],total:codes.length,
    cls:{},clsAmt:{},stockAmt:0,stockQty:0,activeCnt:0,eolCnt:0,
    needList:[],recAmt:0,incQty:0,incCnt:0,
    brand:{},monthlyQty:{},chRev:{},chRevTotal:0};
  var curYear=String(new Date().getFullYear());
  codes.forEach(function(c){
    var it=items[c];
    var cls=it.cls||'기타';
    if(cls==='단종소진중'){a.eolCnt++;}
    else{
      a.activeCnt++;
      a.cls[cls]=(a.cls[cls]||0)+1;
      a.clsAmt[cls]=(a.clsAmt[cls]||0)+(it.amt||0);
      var b=it.brand||'기타';
      var bo=a.brand[b]=a.brand[b]||{cnt:0,amt:0,need:0,short:0,exc:0,excAmt:0};
      bo.cnt++;bo.amt+=(it.amt||0);
      if(cls==='발주필요'){bo.need++;}
      if(cls==='품절위험')bo.short++;
      if(cls==='과잉/악성'){bo.exc++;bo.excAmt+=(it.amt||0);}
    }
    a.stockAmt+=(it.amt||0);
    a.stockQty+=(it.cur||0);
    if(it.inc>0){a.incQty+=it.inc;a.incCnt++;}
    if(cls==='발주필요'||cls==='품절위험'){
      a.needList.push({code:c,name:it.name,brand:it.brand,cls:cls,cur:it.cur||0,inc:it.inc||0,
        adps:it.adps||0,days:it.days,rec:it.rec||0,dp:it.dp||0,recAmt:(it.rec||0)*(it.dp||0)});
      if(cls==='발주필요')a.recAmt+=(it.rec||0)*(it.dp||0);
    }
    /* 월별 판매수량 (전 채널 합) */
    if(it.monthly)Object.keys(it.monthly).forEach(function(ym){
      var s=0,o=it.monthly[ym];Object.keys(o).forEach(function(ch){s+=o[ch]||0});
      a.monthlyQty[ym]=(a.monthlyQty[ym]||0)+s;
    });
    /* 당해년도 채널별 매출 */
    if(it.chy&&it.chy[curYear])Object.keys(it.chy[curYear]).forEach(function(ch){
      var v=it.chy[curYear][ch];var rev=(v&&v[1])||0;
      a.chRev[ch]=(a.chRev[ch]||0)+rev;a.chRevTotal+=rev;
    });
  });
  a.needList.sort(function(x,y){
    var dx=x.days==null?9999:x.days,dy=y.days==null?9999:y.days;return dx-dy;
  });
  return a;
}
function fmtKR(n){
  n=Math.round(n||0);var neg=n<0;n=Math.abs(n);var s;
  if(n>=1e8)s=(n/1e8).toFixed(1).replace(/\.0$/,'')+'억';
  else if(n>=1e4)s=Math.round(n/1e4).toLocaleString()+'만';
  else s=n.toLocaleString();
  return (neg?'-₩':'₩')+s;
}
function urgOf(days){

function kcRecoverOf(r){
  /* 2026 이익 기준 KC 비용 회수 판정 */
  var p=r.profit2026, c=r.kccost||0;
  if(p==null)return{k:'na',label:'판단불가',cls:'b-ordered',rate:null};
  if(c<=0)return{k:'done',label:'회수완료',cls:'b-done',rate:100};
  var rate=Math.round(p/c*100);
  if(p>=c)return{k:'done',label:'회수완료',cls:'b-done',rate:rate};
  if(p>0)return{k:'part',label:'회수중',cls:'b-warn',rate:rate};
  return{k:'no',label:'미회수',cls:'b-delay',rate:rate};
}
function hyKcAggregate(kc){
  var a={total:kc.length,cost:0,count:0,done:0,part:0,no:0,na:0,brand:{}};
  kc.forEach(function(r){
    a.cost+=r.kccost||0; a.count+=r.kcCount||0;
    var v=kcRecoverOf(r); a[v.k==='na'?'na':(v.k==='done'?'done':(v.k==='part'?'part':'no'))]++;
    var b=r.brand||'기타';
    var o=a.brand[b]=a.brand[b]||{cost:0,n:0};
    o.cost+=r.kccost||0;o.n++;
  });
  return a;
}

function masterFiltered(){
  var f=state.mf;
  return ms.list.filter(function(o){
    if(f.brand&&(o.br||'')!==f.brand)return false;
    if(f.q){
      var q=f.q.toLowerCase();
      var hay=[o.name,o.no,o.bc,o.br,o.kcno].join(' ').toLowerCase();
      if(hay.indexOf(q)===-1)return false;
    }
    if(f.stock){
      var lv=liveStockOf(o), s=stockOf(o);
      if(f.stock==='none'){ if(lv||s)return false; }
      else if(f.stock==='has'){ if(!(lv&&lv.q>0)&&!(s&&s.it.cur>0))return false; }
      else if(f.stock==='zero'){ if(!lv||lv.q>0)return false; }
      else { if(!s||s.it.cls!==f.stock)return false; }
    }
    return true;
  });
}

    +'<select id="mbrand"><option value="">브랜드 전체</option>'+Object.keys(brandsMap).sort().map(function(b){return '<option'+(state.mf.brand===b?' selected':'')+'>'+esc(b)+'</option>'}).join('')+'</select>'

}
function openMasterPanel(mi){
  var o=ms.list[mi];if(!o)return;
  var s=hy.status==='ok'?stockOf(o):null;
  var lv=liveStockOf(o);
  $('#pBrand').textContent=(o.br||'')+(s?'  ·  '+(s.it.cls||''):'');
  $('#pName').textContent=o.name||'(상품명 없음)';
  var pairs=[['품번',o.no],['바코드',o.bc],['소비자가',o.rrp?Number(o.rrp).toLocaleString()+'원':''],['입수',o.pack],
    ['분류',[o.c1,o.c2].filter(Boolean).join(' / ')],['코리안넷',o.knet],['롯데안전',o.lotte],['KC 인증명',o.kcn],['KC 번호',o.kcno]];
  if(lv){
    pairs.push(['— 실시간 재고 —','재고_RAW 기준']);
    pairs.push(['아마란스코드',lv.code]);
    pairs.push(['가용재고',lv.q.toLocaleString()+'pcs']);
  }
  if(s){
    pairs.push(['— 재고 분석 —','재고/발주 대시보드 연동']);
    if(!lv)pairs.push(['아마란스코드',s.code]);
    pairs.push(['대시보드 재고',(s.it.cur||0).toLocaleString()+'pcs']);
    if(s.it.inc)pairs.push(['입고예정',s.it.inc.toLocaleString()+'pcs'+(s.it.eta&&s.it.eta.length?' ('+s.it.eta.join(', ')+')':'')]);
    if(s.it.amt)pairs.push(['재고금액',fmtKR(s.it.amt)]);
    if(s.it.adps)pairs.push(['일평균판매',s.it.adps.toFixed(1)+'pcs']);
    if(s.it.days!=null)pairs.push(['재고 커버일',Math.round(s.it.days)+'일']);
  }
  $('#pGrid').innerHTML=pairs.filter(function(p){return p[1]}).map(function(p){
    return '<dt>'+esc(p[0])+'</dt><dd>'+esc(p[1])+'</dd>';
  }).join('');
  $('#pLink').href='https://gaia-hyhong.github.io/Hayoung-MD-Dashboard/';
  $('#pLink').textContent=s?'재고/발주 대시보드에서 보기 ↗':'재고/발주 대시보드 열기 ↗';
  $('#ovl').classList.add('on');$('#panel').classList.add('on');
}

  var m=state.meta[state.year];
  $('#btnSheet').href=m?'https://docs.google.com/spreadsheets/d/'+m.sheetId+'/edit#gid='+m.gid:'#';
  $('#updated').textContent=m?'데이터 기준: '+new Date(m.updated).toLocaleString('ko-KR')+' · '+m.count+'행 · 10분 캐시(새로고침으로 즉시 갱신)':'';

  var ck=$('#cntKc');if(ck)ck.textContent=d.kcTodo.length||'';
  var cm=$('#cntMaster');if(cm)cm.textContent=ms.status==='ok'?ms.list.length.toLocaleString():'';
  var v=$('#view');
  if(state.view==='dash')v.innerHTML=vDash(rs,d);

function pageHead(t,sub){return '<div class="page-head"><div><h2>'+t+'</h2><p>'+sub+'</p></div></div>'}
function metric(lab,val,unit,delta,ic,goV,f,alert){
  return '<div class="card metric'+(alert?' alert':'')+'" data-go="'+goV+'" data-f="'+(f||'')+'">'
    +'<div class="ml">'+icon(ic)+'<span>'+lab+'</span></div>'
    +'<div class="mv">'+val+(unit?'<small>'+unit+'</small>':'')+'</div>'
    +'<div class="md">'+delta+'</div></div>';
}

/* ----- 홈 (재고·발주 통합 대시보드) ----- */
function donutSVG(segs,centerTop,centerBot){
  /* segs: [{label,color,val,sub,go,f}] */
  var total=segs.reduce(function(a,s){return a+s.val},0)||1;
  var R=60,C=2*Math.PI*R,off=0;
  var circles=segs.map(function(s){
    var len=s.val/total*C;
    var el='<circle r="'+R+'" cx="75" cy="75" fill="none" stroke="'+s.color+'" stroke-width="17" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 75 75)"><title>'+esc(s.label)+' '+s.val.toLocaleString()+'</title></circle>';
    off+=len;return el;
  }).join('');
  var legend=segs.map(function(s){
    return '<div class="dRow"'+(s.go?' data-go="'+s.go+'" data-f="'+(s.f||'')+'"':'')+'><span class="sw" style="background:'+s.color+'"></span>'+esc(s.label)
      +(s.sub?'<span class="a">'+s.sub+'</span>':'')+'<b>'+s.val.toLocaleString()+'</b></div>';
  }).join('');
  return '<div class="donutWrap"><svg viewBox="0 0 150 150">'+circles
    +'<text x="75" y="70" text-anchor="middle" font-size="22" font-weight="800" fill="#1A1C1F">'+centerTop+'</text>'
    +'<text x="75" y="90" text-anchor="middle" font-size="10.5" fill="#9CA1A9">'+centerBot+'</text></svg>'
    +'<div class="dLegend">'+legend+'</div></div>';
}
function stackBar(segs){
  /* 100% 가로 스택 인포그래픽 */
  var total=segs.reduce(function(a,s){return a+s.val},0)||1;
  var bar=segs.map(function(s){
    var p=s.val/total*100;
    return '<div title="'+esc(s.label)+' '+s.val+'종 ('+Math.round(p)+'%)" style="width:'+p+'%;background:'+s.color+'"></div>';
  }).join('');
  var legend=segs.map(function(s){
    return '<span style="display:inline-flex;align-items:center;gap:5px;margin-right:14px;font-size:.79rem;color:var(--ink-2)"><span style="width:9px;height:9px;border-radius:3px;background:'+s.color+'"></span>'+esc(s.label)+' <b style="color:var(--ink)">'+s.val+'</b></span>';
  }).join('');
  return '<div style="display:flex;height:26px;border-radius:8px;overflow:hidden;margin:4px 0 10px">'+bar+'</div><div>'+legend+'</div>';
}
function svgQtyChart(monthlyQty){
  var ms=Object.keys(monthlyQty).sort().slice(-12);
  if(!ms.length)return '<div class="empty">판매 데이터 없음</div>';
  var W=Math.max(560,ms.length*52),H=210,bottom=24,top=24,pad=8;
  var maxV=Math.max.apply(null,ms.map(function(m){return Math.max(0,monthlyQty[m])}).concat([1]));
  var step=(W-pad*2)/ms.length,bw=Math.min(34,step*0.55);
  var cur=nowYM();
  var bars=ms.map(function(m,i){
    var v=Math.max(0,monthlyQty[m]);
    var h=Math.max(2,(H-top-bottom)*(v/maxV));
    var x=pad+step*i+(step-bw)/2,y=H-bottom-h;
    var isCur=m===cur;
    return '<g><rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+h+'" rx="5" fill="'+(isCur?'#D5001F':'#1A1C1F')+'" opacity="'+(isCur?1:0.82)+'"></rect>'
      +'<text x="'+(x+bw/2)+'" y="'+(y-6)+'" text-anchor="middle" font-size="9.8" font-weight="700" fill="'+(isCur?'#D5001F':'#5F646C')+'">'+(v>=1000?(v/1000).toFixed(1)+'k':v)+'</text>'
      +'<text x="'+(x+bw/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" font-weight="'+(isCur?'800':'600')+'" fill="'+(isCur?'#D5001F':'#9CA1A9')+'">'+moLabel(m)+'</text>'
      +'<title>'+fmtYM(m)+' · '+v.toLocaleString()+'pcs</title></g>';
  }).join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'
    +'<line x1="'+pad+'" y1="'+(H-bottom+4)+'" x2="'+(W-pad)+'" y2="'+(H-bottom+4)+'" stroke="#E3E4E8"/>'+bars+'</svg>';
}
function vDash(rs,d){
  var cur=nowYM();
  var h='';

  /* ---- 오더 요약 스트립 (기존 포털 데이터) ---- */
  h+='<div class="page-head"><div><h2>운영 대시보드</h2><p>재고·발주 통합 현황'
    +(hy.agg?' · 재고 기준일 '+esc(hy.agg.gen):'')+' · 오더 '+state.year+'년 '+rs.length+'건</p></div></div>';
  h+='<div class="metrics" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">'
    +metric('이번 달 입고 예정',d.thisMonth.length,'건',kFmt(d.tmAmt),'calendar-check','orders','im:'+cur)
    +metric('해상 운송 중',d.onWater.length,'건','선적/통관 단계','ship','orders','status:ship')
    +metric('지연 오더',d.delayed.length,'건','입고예정월 경과','clock-alert','orders','status:delay',d.delayed.length>0)
    +(hy.agg?metric('현재고 자산',fmtKR(hy.agg.stockAmt),'','원가 기준 · '+hy.agg.activeCnt+'종 관리','banknote','',''):'')
    +(hy.agg?metric('발주 필요',(hy.agg.cls['발주필요']||0),'종','권장 '+fmtKR(hy.agg.recAmt),'shopping-cart','','',(hy.agg.cls['발주필요']||0)>0):'')
    +(hy.agg?metric('품절 위험',(hy.agg.cls['품절위험']||0),'종','30일 내 소진 주의','triangle-alert','','',(hy.agg.cls['품절위험']||0)>0):'')
    +'</div>';

  /* ---- 재고 데이터 로딩/오류 ---- */
  if(hy.status==='loading'){
    h+='<div class="card"><div class="empty"><div class="spin" style="display:inline-block;vertical-align:-4px;margin-right:9px"></div>재고·발주 데이터 분석 중…</div></div>';
    return h;
  }
  if(hy.status==='error'){
    h+='<div class="card"><div class="empty">재고·발주 데이터 로드 실패 — '+esc(hy.err)
      +'<br><a href="https://gaia-hyhong.github.io/Hayoung-MD-Dashboard/" target="_blank" style="color:var(--info-tx);font-weight:700">원본 대시보드 열기 ↗</a></div></div>';
    return h;
  }
  var a=hy.agg;

  /* ---- 재고 건강도 스택바 ---- */
  var ORDER=['정상','신규','발주필요','품절위험','과잉/악성','무재고'];
  var segs=ORDER.filter(function(k){return a.cls[k]}).map(function(k){
    return {label:k,val:a.cls[k],color:HY_CLS[k].color};
  });
  h+='<section class="card" style="margin-bottom:14px"><div class="section-head"><h3>재고 건강도</h3>'
    +'<span class="sub">관리품목 '+a.activeCnt+'종 기준 · 단종소진중 '+a.eolCnt.toLocaleString()+'종 제외</span></div>'
    +'<div style="padding:2px 18px 16px">'+stackBar(segs)+'</div></section>';

  /* ---- 판매 트렌드 + 채널 매출 도넛 ---- */
  var CH_COLORS=['#2C6ECB','#7B3FF2','#128A54','#E8A200','#8A8F98','#D5001F'];
  var chSegs=Object.keys(a.chRev).sort(function(x,y){return a.chRev[y]-a.chRev[x]}).map(function(ch,i){
    return {label:ch,val:Math.max(0,Math.round(a.chRev[ch]/10000)),sub:fmtKR(a.chRev[ch]),color:CH_COLORS[i%CH_COLORS.length]};
  });
  h+='<div class="g-2-1">'
    +'<section class="card"><div class="section-head"><h3>월별 판매수량 (최근 12개월 · 전 채널)</h3></div><div class="chartWrap">'+svgQtyChart(a.monthlyQty)+'</div></section>'

    +(chSegs.length?donutSVG(chSegs,fmtKR(a.chRevTotal),'공급가 합계'):'<div class="empty">매출 데이터 없음</div>')+'</section>'
    +'</div>';

  /* ---- 발주 긴급도 + 재고금액 브랜드 TOP + 입고예정 ---- */
  var g={now:0,soon:0,plan:0},gAmt={now:0,soon:0,plan:0};
  a.needList.forEach(function(x){var u=urgOf(x.days);g[u.k]++;gAmt[u.k]+=x.recAmt;});
  var brandsTop=Object.keys(a.brand).sort(function(x,y){return a.brand[y].amt-a.brand[x].amt}).slice(0,6);
  var maxBA=Math.max.apply(null,brandsTop.map(function(b){return a.brand[b].amt}).concat([1]));
  var bh=brandsTop.map(function(b){
    var o=a.brand[b],p=Math.round(o.amt/maxBA*100);
    return '<div><div class="mini-row"><span style="font-weight:700;color:var(--ink)">'+esc(b)
      +(o.need?' <span class="badge b-warn" style="margin-left:5px">발주 '+o.need+'</span>':'')
      +(o.short?' <span class="badge b-delay" style="margin-left:3px">품절 '+o.short+'</span>':'')
      +'</span><strong>'+fmtKR(o.amt)+'</strong></div>'
      +'<div class="mini-bar" style="height:6px"><i style="width:'+p+'%;background:var(--ink)"></i></div></div>';

/* ----- 오더 관리 ----- */
function filtered(rs){
  var f=state.f;
  return rs.filter(function(r){
    if(f.brand&&(r.br||'(미지정)')!==f.brand)return false;
    if(f.im&&parseYM(r.im)!==f.im)return false;
    if(f.status==='delay'){if(!r._dl)return false;}
    else if(f.status==='etdmiss'){var y=parseYM(r.im);if(!(y&&y<=nextYM()&&!r.etd&&!r.ind))return false;}
    else if(f.status&&r._st!==f.status)return false;
    if(f.q){
      var q=f.q.toLowerCase();
      var hay=[r.name,r.item,r.desc,r.code,r.bc,r.br,r.sc,r.bl].join(' ').toLowerCase();
      if(hay.indexOf(q)===-1)return false;
    }
    return true;
  });
}

        +'<td class="name" style="max-width:210px" title="'+esc(r.kcname||'')+'">'+esc(r.kcname||'')+'</td><td>'+esc(r.kcno||'')+'</td>'
        +'<td><span class="badge '+KC[r._kc].cls+'">'+KC[r._kc].label+'</span></td></tr>';
    }).join(''):'<tr><td colspan="9"><div class="empty">데이터 없음</div></td></tr>')
    +'</tbody></table></div>';
  return h;
}

/* ----- 브랜드 현황 ----- */
function vBrands(rs,d){
  var by={};
  rs.forEach(function(r){
    var b=r.br||'(미지정)';
    var o=by[b]=by[b]||{n:0,amt:0,open:0,done:0,dl:0};
    o.n++;o.amt+=r._amt;
    if(r._st==='done')o.done++;else o.open++;
    if(r._dl)o.dl++;
  });
  var names=Object.keys(by).sort(function(a,b){return by[b].amt-by[a].amt});
  var h=pageHead('브랜드 현황','브랜드 단위 발주·진행·지연 요약 · 카드 클릭 시 해당 오더');
  h+='<div class="brandGrid">'+names.map(function(b){
    var o=by[b];
    var p=o.n?Math.round(o.done/o.n*100):0;
    return '<div class="card brandCard" data-go="orders" data-f="brand:'+esc(b)+'">'
      +'<div class="bn">'+esc(b)+(o.dl?'<span class="dl">지연 '+o.dl+'건</span>':'')+'</div>'
      +'<div class="ba">'+fmtUSD(o.amt)+'</div>'
      +'<div class="bs">오더 '+o.n+'건 · 진행 '+o.open+' · 완료 '+o.done+'</div>'
      +'<div class="mini-row"><span>입고 완료율</span><strong>'+p+'%</strong></div>'
      +'<div class="mini-bar"><i style="width:'+p+'%;background:'+(o.dl?'var(--red)':'var(--done)')+'"></i></div>'
      +'</div>';
  }).join('')+'</div>';
  return h;
}

/* ================= 이벤트 ================= */
function bindView(){
  var v=$('#view');
  v.querySelectorAll('[data-go]').forEach(function(el){
    el.addEventListener('click',function(){
      var goV=el.dataset.go,f=el.dataset.f||'';
      var nf={q:'',brand:'',status:'',im:''};
      if(f.indexOf('status:')===0)nf.status=f.slice(7);
      if(f.indexOf('im:')===0)nf.im=f.slice(3);
      if(f.indexOf('brand:')===0)nf.brand=f.slice(6);
      if(f.indexOf('etdmiss')===0)nf.status='etdmiss';
      if(goV==='kc'&&f)state.kcf=f;
      go(goV,goV==='orders'?nf:state.f);
    });
  });
  v.querySelectorAll('[data-om]').forEach(function(b){
    b.addEventListener('click',function(e){e.stopPropagation();state.omode=b.dataset.om;render();});
  });
  var fq=$('#fq');if(fq)fq.addEventListener('input',function(){state.f.q=this.value;refreshOrders();});
  var fb=$('#fbrand');if(fb)fb.addEventListener('change',function(){state.f.brand=this.value;render();});
  var fi=$('#fim');if(fi)fi.addEventListener('change',function(){state.f.im=this.value;render();});
  v.querySelectorAll('.chip[data-st]').forEach(function(c){
    c.addEventListener('click',function(){state.f.status=c.dataset.st;render();});
  });
  v.querySelectorAll('.chip[data-kc]').forEach(function(c){
    c.addEventListener('click',function(){state.kcf=c.dataset.kc;render();});
  });
  v.querySelectorAll('.chip[data-kcc]').forEach(function(c){
    c.addEventListener('click',function(){state.kccf=c.dataset.kcc;render();});
  });
  var mq=$('#mq');if(mq)mq.addEventListener('input',function(){state.mf.q=this.value;var p=this.selectionStart;render();var n=$('#mq');if(n){n.focus();n.setSelectionRange(p,p);}});
  var mb=$('#mbrand');if(mb)mb.addEventListener('change',function(){state.mf.brand=this.value;render();});
  v.querySelectorAll('.chip[data-ms]').forEach(function(c){
    c.addEventListener('click',function(){state.mf.stock=c.dataset.ms;render();});
  });
  v.querySelectorAll('[data-mi]').forEach(function(el){
    el.addEventListener('click',function(){openMasterPanel(parseInt(el.dataset.mi,10));});
  });
  v.querySelectorAll('[data-r]').forEach(function(el){
    el.addEventListener('click',function(e){
      if(e.target.closest('a')||e.target.closest('[data-om]'))return;
      openPanel(parseInt(el.dataset.r,10));
    });
  });
}
function refreshOrders(){
  var fq=$('#fq'),pos=fq?fq.selectionStart:0;
  render();
  var nq=$('#fq');if(nq){nq.focus();nq.setSelectionRange(pos,pos);}
}

/* ================= 상세 패널 ================= */
function openPanel(sheetRow){
  var r=rows().find(function(x){return x.r===sheetRow});if(!r)return;
  $('#pBrand').textContent=(r.br||'')+(r._dl?'  ·  ⚠ 지연':'');
  $('#pName').textContent=r.name||r.desc||'(품목명 없음)';
  var order=['item','desc','code','bc','lbc','price','qty','pack','amt','od','sc','lc','im','etd','eta','ind','load','bl','obl','req','kct','sales','knet','lotte','kcname','kcno','kcs','sm','memo'];
  $('#pGrid').innerHTML=order.filter(function(f){return r[f]}).map(function(f){
    return '<dt>'+FIELD_KO[f]+'</dt><dd>'+esc(r[f])+'</dd>';
  }).join('')||'<dd style="grid-column:1/-1;color:var(--ink-3)">추가 정보 없음</dd>';
  var m=state.meta[state.year];
  $('#pLink').href=m?'https://docs.google.com/spreadsheets/d/'+m.sheetId+'/edit#gid='+m.gid+'&range=A'+r.r:'#';
  $('#ovl').classList.add('on');$('#panel').classList.add('on');
}
function closePanel(){$('#ovl').classList.remove('on');$('#panel').classList.remove('on');}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closePanel();});

/* ================= 시작 ================= */
buildYearSeg();refreshIcons();
fetchHayoung();fetchMaster();fetchStock();
loadYear(state.year).then(render);
</script>
