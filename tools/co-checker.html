<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CO Draft 대조 검증 · GAIA</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --ink:#0B3D2C; --bg:#F4F5F4; --panel:#fff; --panel2:#F7F8F7; --line:#E2E6E4;
  --text:#12181A; --sub:#616B6E; --mut:#9AA3A6;
  --ok:#1B7A4F; --ok-bg:#DFF3E8; --bad:#CF3B3B; --bad-bg:#FCEDED;
  --warn:#8C6111; --warn-bg:#FCF3E2; --accent:#1B7A4F;
  --r:14px; --sh:0 1px 2px rgba(16,24,20,.05),0 4px 16px rgba(16,24,20,.04);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,'Malgun Gothic',sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;padding:26px 18px 60px}
.wrap{max-width:1140px;margin:0 auto}
button{font-family:inherit;cursor:pointer;border:none}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.topbar a.back{color:#14603F;background:rgba(27,122,79,.1);font-size:13px;font-weight:700;
  text-decoration:none;padding:8px 14px;border-radius:10px}
.topbar a.back:hover{background:rgba(27,122,79,.18)}
header{margin-bottom:20px}
h1{font-size:22px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:700;background:var(--ok-bg);color:var(--ok);padding:3px 10px;border-radius:99px}
.lead{color:var(--sub);font-size:13px;margin-top:6px}

.dropzone{display:block;background:var(--panel);border:2px dashed var(--line);border-radius:var(--r);
  padding:30px 20px;text-align:center;cursor:pointer;transition:.18s;margin-bottom:14px}
.dropzone:hover,.dropzone.dragover{border-color:var(--accent);background:var(--panel2)}
.dropzone.filled{border-style:solid;border-color:var(--ok)}
.dz-icon{font-size:26px;margin-bottom:8px;opacity:.7}
.dz-main{font-size:14.5px;font-weight:700}
.dz-sub{font-size:12px;color:var(--sub);margin-top:5px}
.dropzone input{display:none}

.files{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.frow{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:12px;
  padding:11px 14px;box-shadow:var(--sh)}
.frole{font-size:11px;font-weight:800;padding:3px 9px;border-radius:7px;flex:none}
.frole.co{background:var(--ok-bg);color:var(--ok)}
.frole.inv{background:#EDF1FA;color:#3C5FA8}
.frole.pl{background:#F3EEF8;color:#6E5391}
.frole.bl{background:#FCF3E2;color:var(--warn)}
.frole.un{background:#EEEFF1;color:var(--sub)}
.fname{flex:1;min-width:0;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmeta{font-size:11.5px;color:var(--mut);white-space:nowrap}
.fsel{font-size:12px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;font-family:inherit}
.fdel{width:24px;height:24px;border-radius:50%;background:var(--panel2);color:var(--sub);font-size:12px;flex:none}
.fdel:hover{background:var(--bad-bg);color:var(--bad)}

.actions{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.btn{padding:11px 22px;border-radius:11px;font-size:14px;font-weight:700;background:var(--ink);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:var(--panel);color:var(--sub);box-shadow:var(--sh)}
.hint{font-size:12px;color:var(--mut)}

.err-box{background:var(--bad-bg);color:var(--bad);padding:13px 16px;border-radius:12px;font-size:13px;margin-bottom:14px}
.info-box{background:var(--warn-bg);color:var(--warn);padding:12px 16px;border-radius:12px;font-size:12.5px;margin-bottom:14px}
.spin{width:17px;height:17px;border:3px solid var(--line);border-top-color:var(--accent);
  border-radius:50%;animation:sp 1s linear infinite;display:inline-block;vertical-align:-4px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}

.verdict{display:flex;align-items:center;gap:11px;padding:15px 18px;border-radius:var(--r);
  font-size:14px;font-weight:700;margin-bottom:14px}
.verdict.pass{background:var(--ok-bg);color:var(--ok)}
.verdict.fail{background:var(--bad-bg);color:var(--bad)}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.scard{background:var(--panel);border-radius:12px;padding:14px 16px;box-shadow:var(--sh)}
.scard .num{font-size:24px;font-weight:800;letter-spacing:-.02em}
.scard .lbl{font-size:11.5px;color:var(--sub);margin-top:2px}
.scard.ok .num{color:var(--ok)} .scard.bad .num{color:var(--bad)} .scard.warn .num{color:var(--warn)}

.section-title{font-size:14px;font-weight:800;margin:22px 0 10px}
table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:var(--r);
  overflow:hidden;box-shadow:var(--sh);font-size:12.8px}
th{background:var(--panel2);text-align:left;font-size:11.5px;font-weight:700;color:var(--sub);
  padding:10px 12px;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
td.field{font-weight:700;white-space:nowrap}
td.val{color:var(--text);word-break:break-word;max-width:250px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.badge.match{background:var(--ok-bg);color:var(--ok)}
.badge.mismatch{background:var(--bad-bg);color:var(--bad)}
.badge.check{background:var(--warn-bg);color:var(--warn)}
td.note{font-size:11.5px;color:var(--mut)}
tr.bad td{background:#FEF7F7}
.src{font-size:11px;color:var(--mut)}

.issues{list-style:none;display:flex;flex-direction:column;gap:7px;margin-top:10px}
.issues li{background:var(--bad-bg);color:var(--bad);padding:10px 14px;border-radius:11px;font-size:12.5px}
.raw{margin-top:16px}
.raw summary{cursor:pointer;font-size:12px;color:var(--mut);padding:6px 0}
.raw pre{background:var(--panel);border-radius:12px;padding:14px;font-size:11px;line-height:1.5;
  max-height:300px;overflow:auto;white-space:pre-wrap;word-break:break-all;color:var(--sub)}
@media(max-width:760px){.summary{grid-template-columns:repeat(2,1fr)}table{font-size:11.5px}th,td{padding:8px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><a class="back" href="../">← GAIA 포털</a></div>
  <header>
    <h1>CO Draft 대조 검증 <span class="tag">CO · Invoice · Packing List</span></h1>
    <div class="lead">서류를 올리면 브라우저에서 품목 단위로 대조합니다. 서버 전송·API 키 없이 동작합니다.</div>
  </header>

  <label class="dropzone" id="dz">
    <div class="dz-icon">📄</div>
    <div class="dz-main">PDF를 끌어다 놓거나 클릭해 선택</div>
    <div class="dz-sub">CO draft · Invoice · Packing List를 한 번에 · 문서 종류 자동 판별 · DRAFT 워터마크 자동 제거</div>
    <input type="file" id="fileInput" accept="application/pdf" multiple>
  </label>

  <div id="fileList" class="files"></div>
  <div class="actions">
    <button class="btn" id="runBtn" disabled>대조 검증 실행</button>
    <button class="btn ghost" id="clearBtn">전체 삭제</button>
    <span class="hint" id="hintRow">CO draft와 Invoice 또는 Packing List가 필요합니다</span>
  </div>

  <div id="statusLine"></div>
  <div id="errBox"></div>
  <div id="results"></div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

var files=[];
var dz=document.getElementById('dz'), fileInput=document.getElementById('fileInput');
var fileList=document.getElementById('fileList'), runBtn=document.getElementById('runBtn');
var hintRow=document.getElementById('hintRow'), errBox=document.getElementById('errBox');
var statusLine=document.getElementById('statusLine'), results=document.getElementById('results');

function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}
function up(s){return String(s||'').toUpperCase()}
function nz(s){var n=String(s==null?'':s).replace(/[^0-9.\-]/g,'');var f=parseFloat(n);return isFinite(f)?f:null}
function fmt(n,d){ if(n==null)return '—';
  return Number(n).toLocaleString(undefined,{minimumFractionDigits:d||0,maximumFractionDigits:d||0}); }
function r2(n){return n==null?null:Math.round(n*100)/100}

/* ===== PDF 텍스트 추출 =====
   워터마크 판별: 글자 크기가 아니라 '회전 여부'로 판단한다.
   (DRAFT 워터마크는 대각선 회전, 인보이스 제목은 크지만 수평이므로 보존) */
function readPdf(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){
      pdfjsLib.getDocument({data:new Uint8Array(fr.result)}).promise.then(function(pdf){
        var jobs=[];
        for(var i=1;i<=pdf.numPages;i++)jobs.push(pdf.getPage(i).then(function(p){return p.getTextContent()}));
        return Promise.all(jobs);
      }).then(function(pages){
        var lines=[],dropped=0;
        pages.forEach(function(tc){
          var its=tc.items.filter(function(it){return it.str&&it.str.trim()});
          if(!its.length)return;
          var sizes=its.map(function(it){return Math.abs(it.transform[3])||it.height||10}).slice().sort(function(a,b){return a-b});
          var med=sizes[Math.floor(sizes.length/2)]||10;
          var keep=its.filter(function(it){
            var s=Math.abs(it.transform[3])||it.height||10;
            var rot=Math.abs(it.transform[1])>0.5||Math.abs(it.transform[2])>0.5;
            var drop=(rot&&s>=med*1.3)                       /* 회전된 큰 글씨 = 워터마크 */
                   ||(s>med*4&&/DRAFT|COPY|SPECIMEN|SAMPLE|VOID/i.test(it.str));
            if(drop)dropped++;
            return !drop;
          });
          var rows={};
          keep.forEach(function(it){
            var y=Math.round(it.transform[5]),key=y;
            for(var k in rows){ if(Math.abs(k-y)<=2){key=+k;break;} }
            (rows[key]=rows[key]||[]).push({x:it.transform[4],s:it.str});
          });
          Object.keys(rows).sort(function(a,b){return b-a}).forEach(function(y){
            var t=rows[y].sort(function(a,b){return a.x-b.x}).map(function(o){return o.s}).join(' ')
                  .replace(/\s+/g,' ').trim();
            if(t)lines.push(t);
          });
        });
        res({lines:lines,dropped:dropped});
      }).catch(rej);
    };
    fr.onerror=function(){rej(new Error('파일을 읽을 수 없습니다'))};
    fr.readAsArrayBuffer(file);
  });
}

/* ===== 문서 종류 판별 ===== */
function detectRole(t){
  var T=up(t),s={CO:0,Invoice:0,PL:0,BL:0};
  [['CERTIFICATE OF ORIGIN',8],['FORM AK',6],['ORIGIN CRITERION',5],['원산지증명',8],
   ['DECLARATION BY THE EXPORTER',5],['GOODS CONSIGNED FROM',5]].forEach(function(p){if(T.indexOf(p[0])!==-1)s.CO+=p[1]});
  [['COMMERCIAL INVOICE',6],['INVOICE NO',5],['UNIT PRICE',5],['TOTAL AMOUNT',4],
   ['PAYMENT TERM',3],['상업송장',6]].forEach(function(p){if(T.indexOf(p[0])!==-1)s.Invoice+=p[1]});
  [['PACKING LIST',9],['NET WEIGHT',4],['GROSS WEIGHT',4],['TOTAL CARTON INFORMATION',5],
   ['DELIVERY NO',3],['포장명세',9]].forEach(function(p){if(T.indexOf(p[0])!==-1)s.PL+=p[1]});
  [['BILL OF LADING',9],['B/L NUMBER',5],['SHIPPED ON BOARD',4],['FREIGHT COLLECT',3],
   ['PLACE OF RECEIPT',3]].forEach(function(p){if(T.indexOf(p[0])!==-1)s.BL+=p[1]});
  if(T.indexOf('PACKING LIST')!==-1&&T.indexOf('UNIT PRICE')!==-1)s.Invoice+=4;
  var best='unknown',bv=0,tie=false;
  ['CO','Invoice','PL','BL'].forEach(function(k){
    if(s[k]>bv){bv=s[k];best=k;tie=false} else if(s[k]===bv&&bv>0)tie=true;
  });
  return (bv<4||tie)?'unknown':best;
}

/* ===== 공통 유틸 ===== */
var CODE_SRC='(\\d{10}(?:[A-Z][A-Z0-9]{0,2})?)';
var ITEM_SRC='\\b'+CODE_SRC+'(?![\\dA-Z])';
function itemCodes(t){
  var rx=new RegExp(ITEM_SRC,'g'),m,out=[],seen={};
  while((m=rx.exec(t))!==null){ if(!seen[m[1]]){seen[m[1]]=1;out.push(m[1]);} }
  return out;
}
function pick(t,re){var m=t.match(re);return m?String(m[1]).trim():''}
function normDate(s){
  if(!s)return '';
  var t=String(s).trim(),M={JAN:1,FEB:2,MAR:3,APR:4,MAY:5,JUN:6,JUL:7,AUG:8,SEP:9,OCT:10,NOV:11,DEC:12},m;
  m=t.match(/(\d{4})[.\-\/]\s?(\d{1,2})[.\-\/]\s?(\d{1,2})/);
  if(m)return m[1]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[3]).slice(-2);
  m=t.match(/(\d{1,2})[\s.\-\/]*([A-Z]{3})[A-Z]*[\s.,\-\/]*(\d{4})/i);
  if(m&&M[up(m[2])])return m[3]+'-'+('0'+M[up(m[2])]).slice(-2)+'-'+('0'+m[1]).slice(-2);
  m=t.match(/(\d{1,2})[.\-\/](\d{1,2})[.\-\/](\d{4})/);
  if(m)return m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2);
  return t;
}
function hsOf(t){
  var hs={};
  (t.match(/H\.?\s?S\.?\s*(?:CODE|NO)?[.\s:]*([\d.]{6,13})/gi)||[]).forEach(function(x){
    var k=x.replace(/\D/g,''); if(k.length>=6)hs[k.slice(0,6)]=1;
  });
  return Object.keys(hs).sort();
}
/* 같은 코드가 여러 줄에 나오면 무조건 합산 (분할 선적·중복 라인 대응) */
function accum(d,code,o,meta){
  var it=d.items[code];
  if(!it){ it=d.items[code]={rows:0,nos:[],pages:[]}; d.order.push(code); }
  ['qty','ctns','gw','nw','val','cbm'].forEach(function(k){
    if(o[k]!=null)it[k]=r2((it[k]||0)+o[k]);
  });
  if(it.price==null&&o.price!=null)it.price=o.price;
  it.rows++;
  if(meta){ if(meta.no!=null)it.nos.push(meta.no); if(meta.page!=null)it.pages.push(meta.page); }
  return it;
}
function dupNote(d){
  var n=0;Object.keys(d.items||{}).forEach(function(c){if(d.items[c].rows>1)n++});
  return n;
}

/* ===== CO 파서 (행 단위) ===== */
function coRows(t){
  var lines=t.split('\n'),page=1,rows=[],cur=null;
  var rxPage=/Page\s*[:：]?\s*(\d+)\s*(?:of|\/)\s*\d+/i;
  var rxKg=/([\d,]+(?:\.\d+)?)\s*(?:KGM|KGS|KG)\b/i;
  var rxUsd=/([\d,]+\.\d{2})\s*(?:USD|USD\*|US\$)/i;
  var rxCode=new RegExp(ITEM_SRC);
  var rxNo=/^\s*(\d{1,3})\s+(?=.*(?:HS[.\s]*CODE|RVC|KGM))/i;
  lines.forEach(function(L){
    var mp=L.match(rxPage); if(mp)page=parseInt(mp[1],10);
    if(/^\s*TOTAL\s*[:：]/i.test(L))return;              /* 합계 문구는 품목 아님 */
    var mk=L.match(rxKg);
    if(mk){
      var mn=L.match(rxNo);
      cur={no:mn?parseInt(mn[1],10):null,page:page,gw:nz(mk[1]),val:null,code:null};
      rows.push(cur);
    }
    if(!cur)return;
    if(cur.val==null){var mu=L.match(rxUsd);if(mu)cur.val=nz(mu[1]);}
    if(!cur.code){var mc=L.match(rxCode);if(mc)cur.code=mc[1];}
  });
  return rows.filter(function(r){return r.code});
}
function parseCO(t){
  var d={role:'CO',items:{},order:[]};
  var rows=coRows(t);
  d.rowCount=rows.length;
  if(rows.length){
    rows.forEach(function(r,i){
      accum(d,r.code,{gw:r.gw,val:r.val},{no:(r.no!=null?r.no:i+1),page:r.page});
    });
    var sg=0,ng=0,sv=0,nv=0;
    rows.forEach(function(r){ if(r.gw!=null){sg+=r.gw;ng++} if(r.val!=null){sv+=r.val;nv++} });
    d.totalGw=ng?r2(sg):null;
    d.sumVal=nv?r2(sv):null;
  } else {
    /* 예비 경로: 행 인식 실패 시 코드 순서 기준 */
    var codes=itemCodes(t);
    var gws=[],vals=[],m,rg=/([\d,]+\.\d+)\s*KGM/g,rv=/([\d,]+\.\d{2})\s*USD/g;
    while((m=rg.exec(t))!==null)gws.push(nz(m[1]));
    while((m=rv.exec(t))!==null)vals.push(nz(m[1]));
    codes.forEach(function(c,i){accum(d,c,{gw:gws[i],val:vals[i]},{no:i+1,page:null})});
    var s=0,n=0;gws.forEach(function(v){if(v!=null){s+=v;n++}});
    d.totalGw=n?r2(s):null; d.sumVal=null; d.rowCount=codes.length;
  }
  d.totalAmount=nz(pick(t,/\(([\d,]+\.\d{2})\)\s*USD/));
  if(d.totalAmount==null)d.totalAmount=d.sumVal;
  d.totalCtns=nz(pick(t,/\(([\d,]+)\)\s*CARTON/i));
  var cnt={},mm,rx=/\b(\d{8})\b/g;
  while((mm=rx.exec(t))!==null)cnt[mm[1]]=(cnt[mm[1]]||0)+1;
  var bi='',bc=1;Object.keys(cnt).forEach(function(k){if(cnt[k]>bc){bc=cnt[k];bi=k}});
  d.invNo=bi;
  var dc={},rd=/\b(\d{2}\/\d{2}\/\d{4})\b/g;
  while((mm=rd.exec(t))!==null)dc[mm[1]]=(dc[mm[1]]||0)+1;
  var bd='',bdc=0;Object.keys(dc).forEach(function(k){if(dc[k]>bdc){bdc=dc[k];bd=k}});
  d.invDate=normDate(bd);
  d.hs=hsOf(t);
  d.exporter=pick(t,/consigned\s*from[^\n]*\n\s*([^\n]{5,70})/i);
  d.consignee=pick(t,/consigned\s*to[^\n]*\n\s*([^\n]{5,70})/i);
  d.vessel=pick(t,/Vessel[^\n]{0,30}\n\s*([^\n]{4,45})/i);
  d.discharge=pick(t,/Port\s*of\s*Discharge\s*\n?\s*([^\n]{4,45})/i);
  d.origin=coCountry(t);
  d.criterion=pick(t,/(RVC\s?[\d.]+%|origin\s*criteri(?:on|a)[.:\s]*([A-Z0-9\-() ]{1,16}))/i);
  return d;
}
var CTRY=['THAILAND','CHINA','VIET NAM','VIETNAM','KOREA','INDONESIA','MALAYSIA','JAPAN',
  'TAIWAN','INDIA','HONG KONG','SINGAPORE','PHILIPPINES','CAMBODIA','POLAND','GERMANY'];
function firstCountry(s){
  var u=up(s||'');
  for(var i=0;i<CTRY.length;i++)if(u.indexOf(CTRY[i])!==-1)return CTRY[i];
  return '';
}
function coCountry(t){
  var m=t.match(/produced\s*in\s*([\s\S]{0,80})/i);
  var c=m?firstCountry(m[1]):'';
  if(c)return c;
  m=t.match(/Issued\s*in\s*([\s\S]{0,60})/i);
  return m?firstCountry(m[1]):'';
}
/* Messers/Consignee 블록에서 회사명 줄만 추출 */
function consigneeOf(t){
  var lines=t.split('\n');
  for(var i=0;i<lines.length;i++){
    if(!/messers|consignee|goods\s*consigned\s*to/i.test(lines[i]))continue;
    var same=lines[i].replace(/.*?(?:messers|consignee[^:]*|goods\s*consigned\s*to[^)]*\)?)\s*:?\s*/i,'').trim();
    var cand=[same].concat(lines.slice(i+1,i+4));
    for(var j=0;j<cand.length;j++){
      var s=String(cand[j]||'').replace(/\b(?:company|messers)\b/ig,'').trim();
      s=s.replace(/\s{2,}.*$/,'').trim();
      if(s.length<4)continue;
      if(/^(date|prepared|shipment|etd|payment|delivery|vessel|invoice|customer|no\.?|address|name)\b/i.test(s))continue;
      if(!/[A-Za-z가-힣]{3}/.test(s))continue;
      return s;
    }
  }
  return '';
}

/* ===== Invoice 파서 (행 단위) ===== */
function parseINV(t){
  var d={role:'Invoice',items:{},order:[]};
  var lines=t.split('\n');
  var rxRow=new RegExp('^\\s*([\\d,]+)\\s*PCS?\\s+'+CODE_SRC+'\\s+([\\d,]+\\.\\d{2})\\s+([\\d,]+\\.\\d{2})','i');
  var rxCtn=/([\d,]+)\s*Cartons?\b/i;
  var cur=null,rowN=0;
  lines.forEach(function(L){
    var m=L.match(rxRow);
    if(m){
      rowN++;
      cur=accum(d,m[2],{qty:nz(m[1]),price:nz(m[3]),val:nz(m[4])},null);
      cur._ctnDone=false;
      return;
    }
    if(!cur||cur._ctnDone)return;
    if(/^\s*Total\b/i.test(L))return;
    var c=L.match(rxCtn);
    if(c){ cur.ctns=r2((cur.ctns||0)+nz(c[1])); cur._ctnDone=true; }
  });
  d.rowCount=rowN;
  if(!rowN){ /* 예비 경로 */
    itemCodes(t).forEach(function(c){
      var i=t.indexOf(c),pre=t.slice(Math.max(0,i-46),i),body=t.slice(i+c.length,i+300);
      var o={},q=pre.match(/([\d,]+)\s*PCS?\s*$/i); if(q)o.qty=nz(q[1]);
      var pa=body.match(/^\s*([\d,]+\.\d{2})\s+([\d,]+\.\d{2})/); if(pa){o.price=nz(pa[1]);o.val=nz(pa[2])}
      var ct=body.match(rxCtn); if(ct)o.ctns=nz(ct[1]);
      accum(d,c,o,null);
    });
  }
  Object.keys(d.items).forEach(function(c){delete d.items[c]._ctnDone});
  d.invNo=pick(t,/Invoice\s*No[.:\s]*([A-Z0-9][A-Z0-9\-\/_]*)/i);
  d.invDate=normDate(pick(t,/Date[:\s]*(\d{1,2}[.\-\/][A-Z]{3}[.\-\/]\d{4})/i)
                   ||pick(t,/Date[:\s]*([^\n]{6,22})/i));
  d.totalAmount=nz(pick(t,/Total\s*amount\s*(?:USD)?\s*([\d,]+\.\d{2})/i));
  d.totalCtns=nz(pick(t,/Total\s*([\d,]+)\s*Cartons/i));
  d.totalQty=nz(pick(t,/Total\s*([\d,]+)\s*PCS?\b/i));
  d.vessel=pick(t,/Vessel[:\s]*([^\n]{4,40})/i);
  d.consignee=consigneeOf(t);
  d.origin=firstCountry(pick(t,/Country\s*of\s*origin[:\s]*([A-Za-z ]{3,20})/i));
  d.hs=hsOf(t);
  return d;
}

/* ===== Packing List 파서 (행 단위) ===== */
function parsePL(t){
  var d={role:'PL',items:{},order:[]};
  var lines=t.split('\n');
  var rxRow=new RegExp('^\\s*([\\d,]+)\\s*PCS?\\s+'+CODE_SRC+'(?![\\dA-Z])','i');
  var cur=null,rowN=0;
  lines.forEach(function(L){
    var m=L.match(rxRow);
    if(m){ rowN++; cur=accum(d,m[2],{qty:nz(m[1])},null); cur._c=false; return; }
    if(!cur)return;
    if(/Total\s*(Cartons|Quantity|Gross|Net|Volume)/i.test(L))return;   /* 문서 합계 줄 제외 */
    if(!cur._c){ var c=L.match(/([\d,]+)\s*Ctns?\b/i); if(c){cur.ctns=r2((cur.ctns||0)+nz(c[1]));cur._c=true;} }
    var gw=L.match(/Gross\s*Weight[:\s]*([\d,]+\.?\d*)\s*KG/i);
    if(gw)cur.gw=r2((cur.gw||0)+nz(gw[1]));
    var nw=L.match(/Net\s*Weight[:\s]*([\d,]+\.?\d*)\s*KG/i);
    if(nw)cur.nw=r2((cur.nw||0)+nz(nw[1]));
    var cb=L.match(/Total\s*Measurement[:\s]*([\d,]+\.?\d*)/i);
    if(cb)cur.cbm=r2((cur.cbm||0)+nz(cb[1]));
  });
  d.rowCount=rowN;
  Object.keys(d.items).forEach(function(c){delete d.items[c]._c});
  d.totalCtns=nz(pick(t,/Total\s*Cartons?[:\s]*([\d,]+)/i));
  d.totalQty=nz(pick(t,/Total\s*Quantity[:\s]*([\d,]+)/i));
  d.totalGw=nz(pick(t,/Total\s*Gross\s*Weight[:\s]*([\d,]+\.?\d*)/i));
  d.totalNw=nz(pick(t,/Total\s*Net\s*Weight[:\s]*([\d,]+\.?\d*)/i));
  d.totalCbm=nz(pick(t,/Total\s*Volume[:\s]*([\d,]+\.?\d*)/i));
  d.deliveryNo=pick(t,/Delivery\s*No[.:\s]*([A-Z0-9\-]+)/i);
  d.vessel=pick(t,/Vessel[:\s]*([^\n]{4,40})/i);
  d.consignee=consigneeOf(t);
  d.hs=hsOf(t);
  return d;
}
function parseBL(t){
  var d={role:'BL',items:{},order:[]};
  d.blNo=pick(t,/B\/?L\s*(?:Number|No)[.:\s]*([A-Z0-9\-]+)/i);
  d.vessel=pick(t,/Ocean\s*Vessel\s*\n?\s*([^\n]{4,40})/i)||pick(t,/Vessel[:\s]*([^\n]{4,40})/i);
  d.totalGw=nz(pick(t,/([\d,]+\.\d+)\s*KGS/i));
  d.totalCbm=nz(pick(t,/([\d,]+\.\d+)\s*CBM/i));
  d.totalCtns=nz(pick(t,/TOTAL\s*QTY\s*([\d,]+)\s*CARTONS?/i));
  d.discharge=pick(t,/Port\s*of\s*Discharge\s*\n?\s*([^\n]{4,45})/i);
  d.hs=hsOf(t);
  return d;
}
function parseDoc(t,role){
  if(role==='CO')return parseCO(t);
  if(role==='Invoice')return parseINV(t);
  if(role==='PL')return parsePL(t);
  if(role==='BL')return parseBL(t);
  return {role:role,items:{},order:[]};
}

/* ===== 대조 ===== */
function simplify(s){return up(s).replace(/[^A-Z0-9가-힣]/g,'')}
function sameText(a,b){
  var x=simplify(a),y=simplify(b);
  if(!x||!y)return null;
  if(x===y)return true;
  if(x.length>=5&&(x.indexOf(y)!==-1||y.indexOf(x)!==-1))return true;
  var sh=x.length<y.length?x:y,lo=x.length<y.length?y:x,hit=0,tot=0;
  for(var i=0;i+3<=sh.length;i+=3){tot++;if(lo.indexOf(sh.substr(i,3))!==-1)hit++}
  return tot?(hit/tot)>=0.7:null;
}
/* 같은 종류 문서 여러 개를 하나로 합산 (분할 인보이스·패킹리스트 대응) */
function mergeDocs(ds){
  ds=(ds||[]).filter(Boolean);
  if(!ds.length)return null;
  if(ds.length===1)return ds[0];
  var out={role:ds[0].role,items:{},order:[],merged:ds.length};
  var sumF=['totalCtns','totalQty','totalGw','totalNw','totalCbm','totalAmount','rowCount','sumVal'];
  sumF.forEach(function(f){
    var s=null;
    ds.forEach(function(d){ if(d[f]!=null){s=(s||0)+d[f]} });
    out[f]=s!=null?Math.round(s*1000)/1000:null;
  });
  ['invNo','invDate','vessel','consignee','origin','deliveryNo','blNo','discharge'].forEach(function(f){
    for(var i=0;i<ds.length;i++)if(ds[i][f]){out[f]=ds[i][f];break}
    if(out[f]===undefined)out[f]='';
  });
  var hs={};ds.forEach(function(d){(d.hs||[]).forEach(function(x){hs[x]=1})});
  out.hs=Object.keys(hs).sort();
  ds.forEach(function(d){
    d.order.forEach(function(c){
      var src=d.items[c]||{};
      accum(out,c,src,null);
      var t=out.items[c];
      t.rows=(t.rows||0)+((src.rows||1)-1);
      (src.nos||[]).forEach(function(n){t.nos.push(n)});
      (src.pages||[]).forEach(function(p){t.pages.push(p)});
    });
  });
  return out;
}

/* 중량 규칙: CO 중량 >= 상대 서류 중량 이어야 정상 (상대가 크면 오류) */
function gwVerdict(coGw,otherGw){
  if(coGw==null||otherGw==null)return {st:'check',note:'중량 인식 안 됨'};
  var d=coGw-otherGw;
  if(d<-0.01)return {st:'mismatch',note:'상대 서류가 '+fmt(Math.abs(d),2)+'kg 더 큼 — CO 중량이 부족'};
  if(d<=0.01)return {st:'match',note:'동일'};
  return {st:'match',note:'CO가 '+fmt(d,2)+'kg 큼 (정상)'};
}
function buildReport(co,inv,pl,bl){
  var head=[],items=[],issues=[];
  function addH(field,a,b,src,opt){
    opt=opt||{};
    var ea=(a===''||a==null),eb=(b===''||b==null);
    if(ea&&eb)return;
    var fa=(!ea&&opt.fmt)?opt.fmt(a):a, fb=(!eb&&opt.fmt)?opt.fmt(b):b;
    if(ea||eb){head.push({f:field,a:fa,b:fb,st:'check',src:src,note:ea?'CO에서 인식 안 됨':src+'에서 인식 안 됨'});return}
    var ok=opt.num?(Math.abs(a-b)<=(opt.tol||0.01)):sameText(a,b);
    if(ok===null){head.push({f:field,a:fa,b:fb,st:'check',src:src,note:'비교 불가'});return}
    var note=opt.note||'';
    if(!ok&&opt.num)note='차이 '+fmt(Math.abs(a-b),opt.dec||0);
    head.push({f:field,a:fa,b:fb,st:ok?'match':'mismatch',src:src,note:note});
    if(!ok)issues.push(field+' — CO '+fa+' / '+src+' '+fb+(note?' ('+note+')':''));
  }
  var ref=inv||pl;
  if(inv){
    addH('인보이스 번호',co.invNo,inv.invNo,'Invoice');
    addH('인보이스 날짜',co.invDate,inv.invDate,'Invoice');
    addH('총 금액 (USD)',co.totalAmount,inv.totalAmount,'Invoice',{num:true,tol:0.01,dec:2,fmt:function(v){return fmt(v,2)}});
    addH('총 카톤 수',co.totalCtns,inv.totalCtns,'Invoice',{num:true,tol:0.5,fmt:function(v){return fmt(v)}});
  }
  if(pl&&!inv)addH('총 카톤 수',co.totalCtns,pl.totalCtns,'Packing List',{num:true,tol:0.5,fmt:function(v){return fmt(v)}});
  /* CO 자체 합계 검산 */
  if(co.sumVal!=null&&co.totalAmount!=null&&Math.abs(co.sumVal-co.totalAmount)>0.01){
    head.push({f:'CO 품목 금액 합계',a:fmt(co.sumVal,2),b:fmt(co.totalAmount,2),st:'mismatch',src:'CO 자체',
      note:'품목 합계와 CO 표기 총액이 다름'});
    issues.push('CO 품목 금액 합계('+fmt(co.sumVal,2)+')와 CO 표기 총액('+fmt(co.totalAmount,2)+')이 다릅니다');
  }
  /* 총중량 — CO >= 상대 서류 규칙 */
  var wRef=(inv&&inv.totalGw!=null)?{d:inv,n:'Invoice'}:((pl&&pl.totalGw!=null)?{d:pl,n:'Packing List'}:null);
  if(wRef){
    var gv=gwVerdict(co.totalGw,wRef.d.totalGw);
    head.push({f:'총 중량 G.W (kg)',a:fmt(co.totalGw,2),b:fmt(wRef.d.totalGw,2),st:gv.st,src:wRef.n,note:gv.note});
    if(gv.st==='mismatch')issues.push('총 중량 — '+wRef.n+'('+fmt(wRef.d.totalGw,2)+'kg)이 CO('+fmt(co.totalGw,2)+'kg)보다 큽니다');
  }
  if(bl){
    if(bl.totalGw!=null){
      var gb=gwVerdict(co.totalGw,bl.totalGw);
      head.push({f:'총 중량 G.W (kg)',a:fmt(co.totalGw,2),b:fmt(bl.totalGw,2),st:gb.st,src:'B/L',note:gb.note});
      if(gb.st==='mismatch')issues.push('총 중량 — B/L이 CO보다 큽니다');
    }
    addH('총 카톤 수',co.totalCtns,bl.totalCtns,'B/L',{num:true,tol:0.5,fmt:function(v){return fmt(v)}});
    if(bl.vessel)addH('선박(Vessel)',co.vessel,bl.vessel,'B/L');
  }
  if(ref){
    addH('수하인(Consignee)',co.consignee,ref.consignee,inv?'Invoice':'Packing List');
    addH('선박(Vessel)',co.vessel,ref.vessel,inv?'Invoice':'Packing List');
  }
  if(inv&&inv.origin)addH('원산지',co.origin,inv.origin,'Invoice');
  if(inv&&pl&&inv.totalQty!=null&&pl.totalQty!=null&&Math.abs(inv.totalQty-pl.totalQty)>0.5){
    head.push({f:'총 수량 (Invoice vs P/L)',a:fmt(inv.totalQty),b:fmt(pl.totalQty),st:'mismatch',src:'교차',note:'두 서류 간 불일치'});
    issues.push('Invoice와 Packing List의 총 수량이 다릅니다');
  }
  var hsRef=(inv&&inv.hs.length)?inv:((pl&&pl.hs.length)?pl:null);
  if(co.hs.length&&hsRef){
    var oh=hsRef.hs;
    var onlyCo=co.hs.filter(function(x){return oh.indexOf(x)===-1});
    var onlyOt=oh.filter(function(x){return co.hs.indexOf(x)===-1});
    var st=(onlyCo.length||onlyOt.length)?'mismatch':'match';
    head.push({f:'HS 코드 (6자리)',a:co.hs.join(', '),b:oh.join(', '),st:st,
      src:hsRef.role==='Invoice'?'Invoice':'Packing List',
      note:st==='mismatch'?('CO만 '+(onlyCo.join(',')||'-')+' / 상대만 '+(onlyOt.join(',')||'-')):''});
    if(st==='mismatch')issues.push('HS 코드가 서로 다릅니다');
  } else if(co.hs.length){
    head.push({f:'HS 코드 (6자리)',a:co.hs.join(', '),b:'—',st:'check',src:'—',note:'상대 서류에 HS 코드 없음 (대조 불가)'});
  }

  /* 품목 단위 */
  var codes=co.order.slice();
  [inv,pl].forEach(function(d){ if(d)d.order.forEach(function(c){if(codes.indexOf(c)===-1)codes.push(c)}); });
  codes.forEach(function(c){
    var a=co.items[c]||null, b=(inv&&inv.items[c])||null, p=(pl&&pl.items[c])||null;
    var otherGw=(b&&b.gw!=null)?b.gw:((p&&p.gw!=null)?p.gw:null);
    var gwSrc=(b&&b.gw!=null)?'Invoice':'P/L';
    var nos=(a&&a.nos)?a.nos.filter(function(v){return v!=null}):[];
    var pages=(a&&a.pages)?a.pages.filter(function(v){return v!=null}):[];
    var r={code:c,coVal:a?a.val:null,invVal:b?b.val:null,coGw:a?a.gw:null,plGw:p?p.gw:null,
           qtyI:b?b.qty:null,qtyP:p?p.qty:null,ctnI:b?b.ctns:null,ctnP:p?p.ctns:null,
           otherGw:otherGw,gwSrc:gwSrc,nos:nos,pages:pages,
           coRows:a?(a.rows||1):0,invRows:b?(b.rows||1):0,plRows:p?(p.rows||1):0,flags:[]};
    r.noLabel=nos.length?('#'+nos.join(', #')):'—';
    var tag=(nos.length?('CO 항목 '+r.noLabel+(pages.length?' (p.'+pages[0]+')':'')+' · '):'')+c;
    if(!a)r.flags.push('CO 누락');
    if(inv&&!b)r.flags.push('Invoice 누락');
    if(pl&&!p)r.flags.push('P/L 누락');
    if(r.coRows>1||r.invRows>1||r.plRows>1)r.flags.push('중복 라인 합산(CO '+r.coRows+'/INV '+r.invRows+'/PL '+r.plRows+')');
    r.valOk=(r.coVal!=null&&r.invVal!=null)?(Math.abs(r.coVal-r.invVal)<0.01):null;
    var gv=gwVerdict(r.coGw,r.otherGw);
    r.gwSt=gv.st; r.gwOver=(r.coGw!=null&&r.otherGw!=null)?(r.otherGw-r.coGw):null;
    r.qtyOk=(r.qtyI!=null&&r.qtyP!=null)?(Math.abs(r.qtyI-r.qtyP)<0.5):null;
    r.ctnOk=(r.ctnI!=null&&r.ctnP!=null)?(Math.abs(r.ctnI-r.ctnP)<0.5):null;
    r.bad=(r.valOk===false)||(r.qtyOk===false)||(r.ctnOk===false)||(r.gwSt==='mismatch');
    items.push(r);
    if(r.valOk===false)issues.push(tag+' 금액 불일치 — CO '+fmt(r.coVal,2)+' / Invoice '+fmt(r.invVal,2));
    if(r.qtyOk===false)issues.push(tag+' 수량 불일치 — Invoice '+fmt(r.qtyI)+' / P/L '+fmt(r.qtyP));
    if(r.ctnOk===false)issues.push(tag+' 카톤 불일치 — Invoice '+fmt(r.ctnI)+' / P/L '+fmt(r.ctnP));
    if(r.gwSt==='mismatch')
      issues.push(tag+' 중량 역전 — CO '+fmt(r.coGw,2)+'kg < '+r.gwSrc+' '+fmt(r.otherGw,2)+'kg (초과 '+fmt(r.gwOver,2)+'kg)');
    var miss=r.flags.filter(function(x){return /누락/.test(x)});
    if(miss.length)issues.push(tag+' — '+miss.join(', '));
  });
  return {head:head,items:items,issues:issues};
}

/* ===== 파일 UI ===== */
function addFiles(list){
  var arr=Array.prototype.slice.call(list).filter(function(f){
    return /pdf$/i.test(f.type)||/\.pdf$/i.test(f.name);
  });
  if(!arr.length){showErr('PDF 파일만 지원합니다.');return}
  errBox.innerHTML='';
  statusLine.innerHTML='<div class="info-box"><span class="spin"></span>파일 분석 중…</div>';
  var jobs=arr.map(function(f){
    return readPdf(f).then(function(r){
      var t=r.lines.join('\n');
      var empty=r.lines.length<3;
      var role=empty?'unknown':detectRole(t);
      files.push({name:f.name,size:f.size,lines:r.lines,text:t,dropped:r.dropped,
        role:role,doc:empty?null:parseDoc(t,role),empty:empty});
    }).catch(function(e){
      files.push({name:f.name,size:f.size,lines:[],text:'',role:'unknown',err:e.message,doc:null});
    });
  });
  Promise.all(jobs).then(function(){statusLine.innerHTML='';renderFiles()});
}
function renderFiles(){
  var scanned=0;
  fileList.innerHTML=files.map(function(f,i){
    var map={CO:['co','CO'],Invoice:['inv','INVOICE'],PL:['pl','PACKING'],BL:['bl','B/L']};
    var m=map[f.role]||['un','미판별'];
    if(f.empty)scanned++;
    var rows=f.doc&&f.doc.rowCount!=null?(' · 품목 '+f.doc.rowCount+'행'):'';
    var meta=f.err?('오류: '+f.err)
      :(f.empty?'스캔 PDF · 텍스트 없음 (OCR 필요)'
      :(f.lines.length+'줄'+rows+(f.dropped?' · 워터마크 '+f.dropped+'조각 제외':'')));
    return '<div class="frow">'
      +'<span class="frole '+m[0]+'">'+m[1]+'</span>'
      +'<span class="fname" title="'+esc(f.name)+'">'+esc(f.name)+'</span>'
      +'<span class="fmeta">'+esc(meta)+'</span>'
      +'<select class="fsel" data-i="'+i+'"'+(f.empty?' disabled':'')+'>'
      +[['CO','CO'],['Invoice','Invoice'],['PL','Packing List'],['BL','B/L'],['unknown','미판별']].map(function(r){
          return '<option value="'+r[0]+'"'+(f.role===r[0]?' selected':'')+'>'+r[1]+'</option>';
        }).join('')
      +'</select><button class="fdel" data-del="'+i+'">✕</button></div>';
  }).join('');
  fileList.querySelectorAll('[data-del]').forEach(function(b){
    b.addEventListener('click',function(){files.splice(+b.dataset.del,1);renderFiles()});
  });
  fileList.querySelectorAll('.fsel').forEach(function(s){
    s.addEventListener('change',function(){
      var f=files[+s.dataset.i]; f.role=s.value;
      if(f.text)f.doc=parseDoc(f.text,f.role);
      renderFiles();
    });
  });
  dz.classList.toggle('filled',files.length>0);
  var n={CO:0,Invoice:0,PL:0,BL:0};
  files.forEach(function(f){if(n[f.role]!==undefined&&f.doc)n[f.role]++});
  runBtn.disabled=!(n.CO>=1&&(n.Invoice>=1||n.PL>=1));
  var scanMsg=scanned?(' · 스캔본 '+scanned+'건은 대조에서 제외됩니다'):'';
  hintRow.textContent=files.length
    ?('CO '+n.CO+' · Invoice '+n.Invoice+' · Packing '+n.PL+' · B/L '+n.BL
      +(runBtn.disabled?' — CO와 Invoice(또는 P/L)가 필요합니다':'')+scanMsg)
    :'CO draft와 Invoice 또는 Packing List가 필요합니다';
}
function showErr(m){errBox.innerHTML='<div class="err-box">'+esc(m)+'</div>'}

dz.addEventListener('click',function(e){if(e.target!==fileInput)fileInput.click()});
fileInput.addEventListener('change',function(){addFiles(fileInput.files);fileInput.value=''});
['dragenter','dragover'].forEach(function(ev){
  dz.addEventListener(ev,function(e){e.preventDefault();e.stopPropagation();dz.classList.add('dragover')});
});
['dragleave','drop'].forEach(function(ev){
  dz.addEventListener(ev,function(e){e.preventDefault();e.stopPropagation();dz.classList.remove('dragover')});
});
dz.addEventListener('drop',function(e){if(e.dataTransfer&&e.dataTransfer.files)addFiles(e.dataTransfer.files)});
window.addEventListener('dragover',function(e){if(!e.target.closest('#dz'))e.preventDefault()});
window.addEventListener('drop',function(e){if(!e.target.closest('#dz'))e.preventDefault()});
document.getElementById('clearBtn').addEventListener('click',function(){
  files=[];renderFiles();results.innerHTML='';errBox.innerHTML='';
});

/* ===== 실행 ===== */
runBtn.addEventListener('click',function(){
  var g=function(r){return files.filter(function(f){return f.role===r&&f.doc})};
  var cos=g('CO'),invs=g('Invoice'),pls=g('PL'),bls=g('BL');
  if(!cos.length||(!invs.length&&!pls.length)){showErr('CO와 Invoice(또는 Packing List)를 지정해 주세요.');return}
  errBox.innerHTML='';
  var coDoc=mergeDocs(cos.map(function(f){return f.doc}));
  var invDoc=mergeDocs(invs.map(function(f){return f.doc}));
  var plDoc=mergeDocs(pls.map(function(f){return f.doc}));
  var blDoc=mergeDocs(bls.map(function(f){return f.doc}));
  var R=buildReport(coDoc,invDoc,plDoc,blDoc);
  var mm=R.head.filter(function(x){return x.st==='mismatch'}).length
        +R.items.filter(function(x){return x.bad||x.flags.filter(function(s){return /누락/.test(s)}).length}).length;
  var mt=R.head.filter(function(x){return x.st==='match'}).length
        +R.items.filter(function(x){return !x.bad}).length;
  var ck=R.head.filter(function(x){return x.st==='check'}).length;
  var pass=mm===0;

  var h='';
  var scanned=files.filter(function(f){return f.empty});
  if(scanned.length)h+='<div class="info-box">스캔 PDF '+scanned.length+'건('
    +esc(scanned.map(function(f){return f.name}).join(', '))+')은 텍스트가 없어 대조에서 제외했습니다. OCR 후 다시 올리거나 육안으로 확인해 주세요.</div>';
  var mnote=[];
  if(cos.length>1)mnote.push('CO '+cos.length+'개');
  if(invs.length>1)mnote.push('Invoice '+invs.length+'개');
  if(pls.length>1)mnote.push('Packing List '+pls.length+'개');
  if(bls.length>1)mnote.push('B/L '+bls.length+'개');
  if(mnote.length)h+='<div class="info-box">'+mnote.join(' · ')+'를 합산해 대조했습니다. (품목별 수량·중량·금액 합계 기준)</div>';
  var dupN=R.items.filter(function(x){return x.coRows>1||x.invRows>1||x.plRows>1}).length;
  if(dupN)h+='<div class="info-box">같은 품목코드가 여러 줄에 나뉜 항목 '+dupN+'건은 합산해서 비교했습니다.</div>';
  h+='<div class="verdict '+(pass?'pass':'fail')+'"><span>'+(pass?'✅':'⚠️')+'</span><span>'
    +(pass?'주요 항목과 전 품목에서 불일치가 발견되지 않았습니다.':'확인이 필요한 항목이 '+mm+'건 있습니다.')+'</span></div>';
  h+='<div class="summary">'
    +'<div class="scard ok"><div class="num">'+mt+'</div><div class="lbl">일치</div></div>'
    +'<div class="scard bad"><div class="num">'+mm+'</div><div class="lbl">불일치</div></div>'
    +'<div class="scard warn"><div class="num">'+ck+'</div><div class="lbl">확인필요</div></div>'
    +'<div class="scard"><div class="num">'+R.items.length+'</div><div class="lbl">대조 품목</div></div></div>';

  h+='<div class="section-title">헤더 항목</div>';
  h+='<table><thead><tr><th>항목</th><th>CO Draft</th><th>대조 값</th><th>기준</th><th>결과</th><th>비고</th></tr></thead><tbody>';
  R.head.forEach(function(x){
    var bt=x.st==='match'?'일치':(x.st==='mismatch'?'불일치':'확인필요');
    h+='<tr'+(x.st==='mismatch'?' class="bad"':'')+'><td class="field">'+esc(x.f)+'</td>'
      +'<td class="val">'+esc(x.a||'—')+'</td><td class="val">'+esc(x.b||'—')+'</td>'
      +'<td class="src">'+esc(x.src||'')+'</td>'
      +'<td><span class="badge '+x.st+'">'+bt+'</span></td>'
      +'<td class="note">'+esc(x.note||'')+'</td></tr>';
  });
  h+='</tbody></table>';

  h+='<div class="section-title">품목별 대조 ('+R.items.length+'개)</div>';
  h+='<table><thead><tr><th>CO #</th><th>품목코드</th><th class="num">CO 금액</th><th class="num">INV 금액</th><th>금액</th>'
    +'<th class="num">CO 중량</th><th class="num">CI·P/L 중량</th><th>중량 판정</th>'
    +'<th class="num">수량 I/P</th><th class="num">카톤 I/P</th><th>비고</th></tr></thead><tbody>';
  R.items.forEach(function(x){
    var vb=x.valOk===true?'<span class="badge match">일치</span>'
      :(x.valOk===false?'<span class="badge mismatch">불일치</span>':'<span class="badge check">—</span>');
    var gwCell,gwBadge;
    if(x.gwSt==='mismatch'){
      gwBadge='<span class="badge mismatch">초과 '+fmt(x.gwOver,2)+'kg</span>';
      gwCell='<td class="num" style="color:var(--bad);font-weight:800">'+fmt(x.otherGw,2)+' ▲</td>';
    } else if(x.gwSt==='match'){
      gwBadge='<span class="badge match">정상</span>';
      gwCell='<td class="num">'+fmt(x.otherGw,2)+'</td>';
    } else {
      gwBadge='<span class="badge check">확인</span>';
      gwCell='<td class="num">'+fmt(x.otherGw,2)+'</td>';
    }
    var qty=(x.qtyI!=null||x.qtyP!=null)
      ?fmt(x.qtyI)+' / '+fmt(x.qtyP)+(x.qtyOk===false?' ⚠':''):'—';
    var ctn=(x.ctnI!=null||x.ctnP!=null)
      ?fmt(x.ctnI)+' / '+fmt(x.ctnP)+(x.ctnOk===false?' ⚠':''):'—';
    h+='<tr'+(x.bad?' class="bad"':'')+'><td class="src">'+esc(x.noLabel)+'</td>'
      +'<td class="field">'+esc(x.code)+'</td>'
      +'<td class="num">'+fmt(x.coVal,2)+'</td><td class="num">'+fmt(x.invVal,2)+'</td><td>'+vb+'</td>'
      +'<td class="num">'+fmt(x.coGw,2)+'</td>'+gwCell+'<td>'+gwBadge+'</td>'
      +'<td class="num">'+qty+'</td><td class="num">'+ctn+'</td>'
      +'<td class="note">'+esc(x.flags.join(', '))+'</td></tr>';
  });
  h+='</tbody></table>';

  if(R.issues.length){
    h+='<div class="section-title">발견된 이슈 ('+R.issues.length+')</div><ul class="issues">';
    R.issues.slice(0,40).forEach(function(i){h+='<li>⚠️ '+esc(i)+'</li>'});
    if(R.issues.length>40)h+='<li>… 외 '+(R.issues.length-40)+'건</li>';
    h+='</ul>';
  }
  h+='<div class="info-box" style="margin-top:18px">중량 판정 기준: <b>CO 중량 ≥ Invoice·Packing List 중량</b>이어야 정상입니다. 상대 서류 중량이 CO보다 크면 <b>빨간색 ▲</b>로 표시되며 CO 수정이 필요합니다. 자동 추출 결과이므로 표시된 항목은 원문과 최종 대조하시기 바랍니다.</div>';
  h+='<details class="raw"><summary>추출된 원문 보기</summary><pre>';
  [['CO',cos],['INVOICE',invs],['PACKING LIST',pls],['B/L',bls]].forEach(function(p){
    p[1].forEach(function(f){
      h+='['+p[0]+'] '+esc(f.name)+'\n'+esc(f.lines.slice(0,50).join('\n'))+'\n\n';
    });
  });
  h+='</pre></details>';
  results.innerHTML=h;
  results.scrollIntoView({behavior:'smooth',block:'start'});
});

renderFiles();
</script>
</body>
</html>
