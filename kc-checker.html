<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가이아 KC×SM 크로스체커</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#0B3D2C; --paper:#F4F5F4; --card:#ffffff; --line:#E2E6E4;
  --ok:#1B7A4F; --ok-bg:#DFF3E8; --fail:#CF3B3B; --fail-bg:#FCEDED;
  --warn:#8C6111; --warn-bg:#FCF3E2; --mute:#616B6E; --mute-bg:#F1F2F4;
  --kc:#14603F; --kc-bg:#DFF3E8; --sm:#4A72C4; --sm-bg:#EDF1FA;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard Variable',Pretendard,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5}
header{background:var(--ink);color:#fff;padding:16px 28px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header .back{color:#A9DCC3;font-size:13px;font-weight:700;text-decoration:none;background:rgba(255,255,255,.1);padding:7px 14px;border-radius:10px}
header .back:hover{background:rgba(255,255,255,.18)}
header .sp{flex:1}
header h1{font-size:19px;font-weight:800;letter-spacing:-.3px}
header .sub{font-size:12.5px;color:#9fb0c7}
main{max-width:1120px;margin:0 auto;padding:24px 20px 80px}

/* 업로드 */
#drop{border:2px dashed #b8c2d0;border-radius:12px;background:var(--card);padding:34px 20px;text-align:center;cursor:pointer;transition:.15s}
#drop.over{border-color:var(--ink);background:#eef1f6}
#drop .big{font-size:15.5px;font-weight:700}
#drop .hint{font-size:12.5px;color:var(--mute);margin-top:6px}
#filelist{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12.5px}
.chip b{font-weight:700}
.tag{font-size:11px;font-weight:800;padding:2px 8px;border-radius:10px;letter-spacing:.3px}
.tag.KC{background:var(--kc-bg);color:var(--kc)}
.tag.SM{background:var(--sm-bg);color:var(--sm)}
.tag.XLSX{background:var(--warn-bg);color:var(--warn)}
.tag.UNK{background:var(--mute-bg);color:var(--mute)}
.chip .rm{cursor:pointer;color:var(--mute);font-weight:700;padding:0 2px}
.chip .rm:hover{color:var(--fail)}
#actions{margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button.primary{background:var(--ink);color:#fff;border:none;border-radius:8px;padding:11px 26px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit}
button.primary:disabled{background:#b8c2d0;cursor:default}
button.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:10px 18px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--mute)}
#status{font-size:12.5px;color:var(--mute)}

/* 요약 */
#summary{display:none;margin:26px 0 8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px;gap:26px;align-items:center;flex-wrap:wrap}
#summary .stat{display:flex;flex-direction:column;gap:2px}
#summary .stat .n{font-size:24px;font-weight:800;line-height:1.1}
#summary .stat .l{font-size:11.5px;color:var(--mute);font-weight:600}
#summary .n.ok{color:var(--ok)} #summary .n.fail{color:var(--fail)} #summary .n.warn{color:var(--warn)}
#refnote{font-size:12px;color:var(--mute);margin:6px 2px 0}

/* 탭 */
#tabs{display:none;margin-top:22px;gap:0;border-bottom:2px solid var(--line)}
.tab-btn{background:none;border:none;font-family:inherit;font-size:14.5px;font-weight:700;color:var(--mute);padding:11px 22px;cursor:pointer;position:relative;display:inline-flex;align-items:center;gap:8px}
.tab-btn.active{color:var(--ink)}
.tab-btn.active::after{content:'';position:absolute;left:0;right:0;bottom:-2px;height:3px;background:var(--ink);border-radius:2px 2px 0 0}
.tab-btn .cnt{font-size:11px;font-weight:800;padding:2px 8px;border-radius:10px;background:var(--mute-bg);color:var(--mute)}
.tab-btn .cnt.fail{background:var(--fail-bg);color:var(--fail)}
.tab-btn .cnt.ok{background:var(--ok-bg);color:var(--ok)}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* 아이템 카드 */
.item-card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:16px;overflow:hidden}
.item-head{padding:13px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.item-head .code{font-size:16px;font-weight:800;letter-spacing:-.2px}
.item-head .files{font-size:12px;color:var(--mute)}
.verdict-pill{margin-left:auto;font-size:12.5px;font-weight:800;padding:5px 14px;border-radius:20px}
.verdict-pill.ok{background:var(--ok-bg);color:var(--ok)}
.verdict-pill.fail{background:var(--fail-bg);color:var(--fail)}
.verdict-pill.warn{background:var(--warn-bg);color:var(--warn)}

table{width:100%;border-collapse:collapse}
th,td{padding:9px 14px;font-size:13px;border-bottom:1px solid #eef1f5;text-align:left;vertical-align:top;word-break:break-all}
th{background:#f8f9fb;font-size:11.5px;color:var(--mute);font-weight:700;letter-spacing:.2px}
tr:last-child td{border-bottom:none}
td.field{font-weight:700;white-space:nowrap;width:150px}
td.src{color:#3a4354}
td.v{width:96px;white-space:nowrap}
.badge{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:12px}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.fail{background:var(--fail-bg);color:var(--fail)}
.badge.missing{background:var(--warn-bg);color:var(--warn)}
.badge.noref{background:var(--mute-bg);color:var(--mute)}
.sec-label{padding:7px 14px;background:#f0f2f6;font-size:11px;font-weight:800;color:#5a6478;letter-spacing:.6px}
tr.fail-row td{background:#fff8f9}
.empty-note{padding:22px 20px;font-size:13px;color:var(--mute);background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:16px}
@media(max-width:640px){td.field{width:auto}}
</style>
</head>
<body>
<header>
  <h1>KC × SM 크로스체커</h1>
  <span class="sub">KC 라벨 · 쉽핑마크 · 작업요청서 정합성 검증</span>
  <span class="sp"></span>
  <a class="back" href="../">← GAIA 포털</a>
</header>
<main>
  <div id="drop">
    <div class="big">KC 라벨 PDF · SM PDF · 작업요청서 XLSX를 한꺼번에 끌어다 놓으세요</div>
    <div class="hint">파일명/내용으로 자동 분류됩니다 (KC_… / SM_…). XLSX는 기준값(요청서)으로 사용됩니다.</div>
    <input type="file" id="fileInput" multiple accept=".pdf,.xlsx,.xls" style="display:none">
  </div>
  <div id="filelist"></div>
  <div id="actions">
    <button class="primary" id="runBtn" disabled>검증 실행</button>
    <button class="ghost" id="clearBtn">초기화</button>
    <span id="status"></span>
  </div>

  <div id="summary" style="display:none"></div>
  <div id="refnote"></div>

  <div id="tabs">
    <button class="tab-btn active" data-tab="kc">KC 확인 <span class="cnt" id="kcCnt">0</span></button>
    <button class="tab-btn" data-tab="sm">SM 확인 <span class="cnt" id="smCnt">0</span></button>
  </div>
  <div class="tab-panel active" id="panel-kc"></div>
  <div class="tab-panel" id="panel-sm"></div>
</main>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ---------------- 상태 ---------------- */
const store = { files: [] }; // {name, kind:'KC'|'SM'|'XLSX'|'UNK', text?, wb?}

/* ---------------- 유틸/정규화 ---------------- */
const ns      = s => (s||'').toString().replace(/\s+/g,'');
const normCo  = s => ns(s).replace(/㈜/g,'(주)');
const normTel = s => (s||'').toString().replace(/[^0-9]/g,'');
const normDate= s => { const m=(s||'').toString().match(/(\d{4})\s*년\s*(\d{1,2})\s*월/); return m? m[1]+'-'+String(+m[2]).padStart(2,'0') : ns(s); };
const normCountry = s => { const t=ns(s).toLowerCase(); if(/중국|china/.test(t))return 'CN'; if(/한국|korea/.test(t))return 'KR'; if(/베트남|vietnam/.test(t))return 'VN'; return t; };
const itemKey = code => { if(!code) return null; const m=String(code).toUpperCase().match(/([A-Z]{1,6}\d{2,4}[A-Z]?)\s*$/); return m? m[1] : ns(String(code).toUpperCase()); };
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------------- PDF 텍스트 추출 ---------------- */
async function extractPdfText(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  let out=[];
  for(let p=1;p<=pdf.numPages;p++){
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    out.push(tc.items.map(i=>i.str).join(' '));
  }
  return out.join(' ').replace(/\s+/g,' ');
}

/* ---------------- 파일 분류 ---------------- */
function classify(name, text){
  const n = name.toUpperCase();
  if(/\.(XLSX|XLS)$/.test(n)) return 'XLSX';
  if(/^KC[_\-]/.test(n) || /KC라벨/.test(name)) return 'KC';
  if(/^SM[_\-]/.test(n) || /쉽마크|쉬핑마크/.test(name)) return 'SM';
  if(text){
    if(/어린이제품|안전특별법|수입자명|안전확인/.test(text)) return 'KC';
    if(/Q.?TY\s*[:：]?\s*\d+\s*PCS/i.test(text) || /Made in/i.test(text)) return 'SM';
  }
  return 'UNK';
}

/* ---------------- KC 라벨 파싱 ---------------- */
const KC_TERM = '(?=모\\s*델\\s*명|제\\s*조\\s*년\\s*월|제\\s*조\\s*연\\s*월|수입자명|제조자명|주\\s*소\\s*[:：]|전화번호|제\\s*조\\s*국|사용연령|내포장재|A\\/S|안전확인|ITEM#|•|·|\\*|“|"|$)';
function kcField(t,label){
  const m = t.match(new RegExp(label+'\\s*[:：]\\s*(.+?)'+KC_TERM));
  return m ? m[1].trim() : null;
}
function parseKC(text, filename){
  const f = {};
  f.모델명   = kcField(text,'모\\s*델\\s*명');
  f.제조년월 = kcField(text,'제\\s*조\\s*[년연]\\s*월');
  f.수입자명 = kcField(text,'수입자명');
  f.주소     = kcField(text,'주\\s*소');
  f.전화번호 = kcField(text,'전화번호');
  f.제조국   = kcField(text,'제\\s*조\\s*국');
  f.사용연령 = kcField(text,'사용연령');
  f.KC번호   = (text.match(/\b[A-Z]{2}\d{3}[A-Z]\d{4}-\d{4}[A-Z]?\b/)||[])[0]||null;
  f.전파인증 = (text.match(/\bR-R-[A-Z0-9]+-[A-Z0-9\-]+\b/)||[])[0]||null;
  f.ITEM     = (text.match(/ITEM#\s*([A-Z0-9\-]+)/)||[])[1]||null;
  if(!f.ITEM){ const m=filename.toUpperCase().match(/ITEM[_\-]?([A-Z]{1,6}\d{2,4})/); if(m) f.ITEM=m[1]; }
  const fm = filename.match(/KC[_\-](\d{2})[_\-](\d{2})/i);
  f.파일명제조년월 = fm ? '20'+fm[1]+'-'+fm[2] : null;
  f._raw = text;
  return f;
}

/* 여러 줄로 분산되는 필드(주소 등): 기준값의 모든 어절이 라벨 텍스트에 존재하면 일치 */
function judgeTokens(refVal, rawText){
  if(refVal==null || refVal==='') return {v:'noref'};
  if(!rawText) return {v:'missing'};
  const full = ns(rawText);
  const toks = String(refVal).split(/\s+/).filter(Boolean);
  return { v: toks.length && toks.every(t=>full.includes(ns(t))) ? 'ok' : 'fail' };
}

/* ---------------- SM 파싱 ---------------- */
function mostFrequent(arr){
  if(!arr||!arr.length) return null;
  const c={}; arr.forEach(v=>c[v]=(c[v]||0)+1);
  return Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0];
}
function parseSM(text, filename){
  const f = {};
  f.ITEM   = mostFrequent(text.match(/\b[A-Z]{3,}-[A-Z]{1,5}\d{2,4}\b/g));
  if(!f.ITEM){ const m=filename.toUpperCase().match(/ITEM[_\-]?([A-Z]{1,6}\d{2,4})/); if(m) f.ITEM=m[1]; }
  f.바코드 = mostFrequent(text.match(/\b\d{13,14}\b/g));
  f.QTY    = (text.match(/Q.?TY\s*[:：]?\s*(\d+)\s*PCS/i)||[])[1]||null;
  f.제조국 = (text.match(/Made in (\w+)/i)||[])[1]||null;
  f._raw = text;
  return f;
}

/* ---------------- XLSX (요청서) 파싱 ---------------- */
function parseWorkbook(wb){
  const ref = { ship:{}, specs:[] };
  const ITEM_RE = /^[A-Z]{2,}-[A-Z]{1,5}\d{2,4}$/;
  wb.SheetNames.forEach(sn=>{
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, defval:null});
    if(!rows.length) return;
    const hIdx = rows.findIndex(r => r && r.some(c=>String(c||'').includes('아이템번호')) && r.some(c=>String(c||'').includes('바코드')));
    if(hIdx >= 0){
      const h = rows[hIdx].map(c=>String(c||''));
      const col = name => h.findIndex(c=>c.includes(name));
      const cE=col('영문'), cK=col('한글'), cI=col('아이템번호'), cQ=h.findIndex(c=>/q.?ty/i.test(c)), cB=col('바코드');
      for(let i=hIdx+1;i<rows.length;i++){
        const r=rows[i]; if(!r) continue;
        const it = r[cI]; if(!it || !ITEM_RE.test(String(it).trim().toUpperCase())) continue;
        const key = itemKey(it);
        ref.ship[key] = {
          영문명: cE>=0? r[cE]:null, 한글명: cK>=0? r[cK]:null,
          ITEM: String(it).trim().toUpperCase(),
          QTY: cQ>=0 && r[cQ]!=null ? String(r[cQ]).trim() : null,
          바코드: cB>=0 && r[cB]!=null ? String(r[cB]).replace(/\D/g,'') : null
        };
      }
      return;
    }
    const kv = {}; const items = new Set();
    rows.forEach(r=>{
      if(!r) return;
      const k = String(r[0]||'').replace(/\s/g,'');
      const v = r[1];
      if(k && v!=null && v!=='') kv[k]=String(v).trim();
      r.forEach(c=>{
        const s=String(c||'').trim().toUpperCase();
        if(ITEM_RE.test(s)) items.add(itemKey(s));
      });
    });
    if(kv['모델명']||kv['수입자명']||kv['KC번호']){
      if(kv['ITEM#']) items.add(itemKey(kv['ITEM#']));
      ref.specs.push({sheet:sn, kv, items:[...items]});
    }
  });
  return ref;
}
function findSpec(ref, key){
  const hit = ref.specs.filter(s=>s.items.includes(key));
  if(!hit.length) return null;
  return hit.sort((a,b)=>a.items.length-b.items.length)[0];
}

/* ---------------- 비교 판정 ---------------- */
function judge(refVal, pdfVal, normFn, mode){
  if(refVal==null || refVal==='') return {v:'noref'};
  if(pdfVal==null || pdfVal==='') return {v:'missing'};
  const n = normFn || ns;
  if(mode==='contains') return { v: n(pdfVal).includes(n(refVal)) ? 'ok':'fail' };
  return { v: n(refVal)===n(pdfVal) ? 'ok':'fail' };
}
const B = {ok:'일치', fail:'불일치', missing:'미검출', noref:'기준없음'};
const badge = v => `<span class="badge ${v}">${B[v]}</span>`;
function row(field, refVal, pdfVal, res){
  const cls = res.v==='fail' ? ' class="fail-row"' : '';
  return `<tr${cls}><td class="field">${esc(field)}</td><td class="src">${esc(refVal??'—')}</td><td class="src">${esc(pdfVal??'—')}</td><td class="v">${badge(res.v)}</td></tr>`;
}
const secLabel = t => `<tr><td colspan="4" class="sec-label">${t}</td></tr>`;
const noteRow = t => `<tr><td colspan="4" style="color:var(--warn);font-size:12.5px">${t}</td></tr>`;

function card(key, filesTxt, verdicts, rowsHtml, srcHeader){
  const pill = verdicts.includes('fail') ? ['fail','불일치 있음']
             : verdicts.includes('missing') ? ['warn','미검출 있음']
             : ['ok','전체 일치'];
  return `
    <div class="item-card">
      <div class="item-head">
        <span class="code">${esc(key)}</span>
        <span class="files">${esc(filesTxt)}</span>
        <span class="verdict-pill ${pill[0]}">${pill[1]}</span>
      </div>
      <table>
        <thead><tr><th style="width:150px">항목</th><th>기준값 (요청서)</th><th>${srcHeader}</th><th style="width:96px">판정</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>`;
}

/* ---------------- 실행 ---------------- */
function run(){
  const panelKC = document.getElementById('panel-kc');
  const panelSM = document.getElementById('panel-sm');
  const summary = document.getElementById('summary');
  const refnote = document.getElementById('refnote');
  panelKC.innerHTML=''; panelSM.innerHTML='';

  const xf = store.files.find(f=>f.kind==='XLSX');
  const ref = xf ? parseWorkbook(xf.wb) : null;
  refnote.textContent = xf
    ? `기준값: ${xf.name} (쉽마크 ${Object.keys(ref.ship).length}품목 / KC스펙 ${ref.specs.length}시트)`
    : '작업요청서(XLSX) 미업로드 — 요청서 대조(바코드 포함)는 생략되고 KC↔SM 교차 비교만 수행됩니다.';

  // 파싱 및 그룹핑
  const kcDocs=[], smDocs=[];
  store.files.forEach(f=>{
    if(f.kind==='KC') kcDocs.push({file:f.name, d:parseKC(f.text,f.name)});
    if(f.kind==='SM') smDocs.push({file:f.name, d:parseSM(f.text,f.name)});
  });
  const smByKey = {}; smDocs.forEach(s=>{ smByKey[itemKey(s.d.ITEM)||s.file]=s; });
  const kcByKey = {}; kcDocs.forEach(k=>{ kcByKey[itemKey(k.d.ITEM)||k.file]=k; });

  const cnt = {kc:{ok:0,fail:0,missing:0,noref:0}, sm:{ok:0,fail:0,missing:0,noref:0}};

  /* ===== KC 확인탭 ===== */
  if(!kcDocs.length){
    panelKC.innerHTML = '<div class="empty-note">KC 라벨 PDF가 없습니다.</div>';
  }
  kcDocs.sort((a,b)=>(a.d.ITEM||'').localeCompare(b.d.ITEM||'')).forEach(({file,d})=>{
    const key = itemKey(d.ITEM) || '(아이템 미확인)';
    const verdicts=[]; let html='';
    const add = r => { cnt.kc[r.v]++; verdicts.push(r.v); return r; };

    html += secLabel('KC 라벨 ↔ 요청서 (KC 스펙 시트)');
    const spec = ref ? findSpec(ref, key) : null;
    if(!ref){
      html += noteRow('요청서 미업로드 — 라벨 표시사항 대조 생략');
    } else if(!spec){
      html += noteRow(`요청서에서 ${esc(key)}에 해당하는 KC 스펙 시트를 찾지 못했습니다.`);
    } else {
      const kv = spec.kv;
      const checks = [
        ['모델명',   kv['모델명'],                   d.모델명,   ns],
        ['제조연월', kv['제조연월']||kv['제조년월'],  d.제조년월, normDate],
        ['수입자명', kv['수입자명'],                 d.수입자명, normCo],
        ['전화번호', kv['전화번호'],                 d.전화번호, normTel],
        ['사용연령', kv['사용연령'],                 d.사용연령, ns],
        ['제조국',   kv['제조국'],                   d.제조국,   normCountry],
        ['KC번호',   kv['KC번호'],                   d.KC번호,   ns],
      ];
      if(kv['전파인증']) checks.push(['전파인증', kv['전파인증'], d.전파인증, ns]);
      checks.forEach(([f,rv,pv,n])=>{ const r=add(judge(rv,pv,n)); html+=row(f,rv,pv,r); });
      /* 주소: 여러 줄 표기라 pdf.js 추출 시 줄이 분산될 수 있음 → 1차 연속 비교, 실패 시 어절 존재 검사 */
      {
        let r = judge(kv['주소'], d.주소, ns);
        let disp = d.주소;
        if(r.v==='fail' || r.v==='missing'){
          const t = judgeTokens(kv['주소'], d._raw);
          if(t.v==='ok'){ r = t; disp = (d.주소? d.주소+' …' : '')+'(줄바꿈 분산 — 어절 단위로 전체 확인됨)'; }
        }
        add(r); html += row('주소', kv['주소'], disp, r);
      }
      html += `<tr><td colspan="4" style="font-size:11.5px;color:var(--mute)">기준 시트: ${esc(spec.sheet)}</td></tr>`;
    }

    if(d.파일명제조년월){
      html += secLabel('KC 파일명 정합성');
      const r = add(judge(d.파일명제조년월, d.제조년월, normDate));
      html += row('제조년월 (파일명↔라벨)', d.파일명제조년월, d.제조년월, r);
    }

    html += secLabel('KC ↔ SM 교차 (ITEM# 매칭)');
    const smPair = smByKey[key];
    if(smPair){
      let r = add(judge(smPair.d.ITEM, d.ITEM, itemKey));
      html += row('ITEM#', smPair.d.ITEM, d.ITEM, r);
      r = add(judge(smPair.d.제조국, d.제조국, normCountry));
      html += row('제조국', smPair.d.제조국 ? 'Made in '+smPair.d.제조국 : null, d.제조국, r);
    } else {
      html += noteRow('같은 ITEM#의 SM 파일이 없어 교차 비교를 건너뜁니다.');
    }

    panelKC.insertAdjacentHTML('beforeend', card(key, 'KC: '+file, verdicts, html, 'KC 라벨 추출값'));
  });

  /* ===== SM 확인탭 ===== */
  if(!smDocs.length){
    panelSM.innerHTML = '<div class="empty-note">SM(쉽핑마크) PDF가 없습니다.</div>';
  }
  smDocs.sort((a,b)=>(a.d.ITEM||'').localeCompare(b.d.ITEM||'')).forEach(({file,d})=>{
    const key = itemKey(d.ITEM) || '(아이템 미확인)';
    const verdicts=[]; let html='';
    const add = r => { cnt.sm[r.v]++; verdicts.push(r.v); return r; };

    html += secLabel('SM ↔ 요청서 (쉽마크 시트) — 바코드 포함');
    const s = ref ? ref.ship[key] : null;
    if(!ref){
      html += noteRow('요청서 미업로드 — 바코드/명칭/Q\'TY 대조 생략');
    } else if(!s){
      html += noteRow(`요청서 쉽마크 시트에서 ${esc(key)} 품목을 찾지 못했습니다.`);
    } else {
      let r;
      r = add(judge(s.ITEM, d.ITEM, x=>ns(String(x).toUpperCase())));       html += row('아이템번호', s.ITEM, d.ITEM, r);
      r = add(judge(s.바코드, d.바코드, x=>String(x).replace(/\D/g,'')));   html += row('바코드', s.바코드, d.바코드, r);
      r = add(judge(s.QTY, d.QTY, x=>String(parseInt(x))));                 html += row("Q'TY", s.QTY, d.QTY, r);
      r = add(judge(s.영문명, d._raw, x=>ns(String(x).toLowerCase()), 'contains'));
      html += row('영문명', s.영문명, r.v==='ok'?'SM 내 표기 확인':(r.v==='fail'?'SM 내 미확인':null), r);
      r = add(judge(s.한글명, d._raw, ns, 'contains'));
      html += row('한글상품명', s.한글명, r.v==='ok'?'SM 내 표기 확인':(r.v==='fail'?'SM 내 미확인':null), r);
    }

    html += secLabel('SM ↔ KC 교차 (ITEM# 매칭)');
    const kcPair = kcByKey[key];
    if(kcPair){
      let r = add(judge(kcPair.d.ITEM, d.ITEM, itemKey));
      html += row('ITEM#', kcPair.d.ITEM, d.ITEM, r);
      r = add(judge(kcPair.d.제조국, d.제조국, normCountry));
      html += row('제조국', kcPair.d.제조국, d.제조국 ? 'Made in '+d.제조국 : null, r);
    } else {
      html += noteRow('같은 ITEM#의 KC 라벨 파일이 없어 교차 비교를 건너뜁니다.');
    }

    panelSM.insertAdjacentHTML('beforeend', card(key, 'SM: '+file, verdicts, html, 'SM 추출값'));
  });

  /* ===== 요약/탭 카운트 ===== */
  const total = k => cnt[k].ok+cnt[k].fail+cnt[k].missing+cnt[k].noref;
  summary.style.display='flex';
  summary.innerHTML = `
    <div class="stat"><span class="n">${kcDocs.length} / ${smDocs.length}</span><span class="l">KC / SM 파일</span></div>
    <div class="stat"><span class="n ok">${cnt.kc.ok+cnt.sm.ok}</span><span class="l">일치</span></div>
    <div class="stat"><span class="n fail">${cnt.kc.fail+cnt.sm.fail}</span><span class="l">불일치</span></div>
    <div class="stat"><span class="n warn">${cnt.kc.missing+cnt.sm.missing}</span><span class="l">미검출</span></div>
    <div class="stat"><span class="n" style="color:var(--mute)">${cnt.kc.noref+cnt.sm.noref}</span><span class="l">기준없음</span></div>`;

  const setCnt = (id,c) => {
    const el = document.getElementById(id);
    if(c.fail>0){ el.textContent = '불일치 '+c.fail; el.className='cnt fail'; }
    else if(c.missing>0){ el.textContent = '미검출 '+c.missing; el.className='cnt'; }
    else { el.textContent = '이상 없음'; el.className='cnt ok'; }
  };
  setCnt('kcCnt', cnt.kc); setCnt('smCnt', cnt.sm);
  document.getElementById('tabs').style.display='flex';

  // 불일치가 있는 탭을 우선 표시
  if(cnt.kc.fail===0 && cnt.sm.fail>0) switchTab('sm');
  else switchTab('kc');
}

/* ---------------- 탭 전환 ---------------- */
function switchTab(name){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active', p.id==='panel-'+name));
}
document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));

/* ---------------- 파일 입출력 ---------------- */
async function addFiles(list){
  const status = document.getElementById('status');
  for(const file of list){
    if(store.files.some(f=>f.name===file.name)) continue;
    status.textContent = `읽는 중: ${file.name}`;
    try{
      if(/\.(xlsx|xls)$/i.test(file.name)){
        const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});
        store.files = store.files.filter(f=>f.kind!=='XLSX');
        store.files.push({name:file.name, kind:'XLSX', wb});
      } else if(/\.pdf$/i.test(file.name)){
        const text = await extractPdfText(file);
        const kind = classify(file.name, text);
        if(text.replace(/\s/g,'').length < 10){
          store.files.push({name:file.name, kind:'UNK', text, warn:'텍스트 추출 불가(아웃라인 PDF 가능성)'});
        } else {
          store.files.push({name:file.name, kind, text});
        }
      }
    }catch(e){
      store.files.push({name:file.name, kind:'UNK', warn:'읽기 실패: '+e.message});
    }
  }
  status.textContent = '';
  renderChips();
}
function renderChips(){
  const el = document.getElementById('filelist');
  el.innerHTML = store.files.map((f,i)=>`
    <span class="chip"><span class="tag ${f.kind}">${f.kind==='XLSX'?'기준':f.kind}</span><b>${esc(f.name)}</b>${f.warn?` <span style="color:var(--fail);font-size:11px">${esc(f.warn)}</span>`:''}<span class="rm" data-i="${i}">×</span></span>`).join('');
  el.querySelectorAll('.rm').forEach(x=>x.onclick=()=>{store.files.splice(+x.dataset.i,1);renderChips();});
  document.getElementById('runBtn').disabled = !store.files.some(f=>f.kind==='KC'||f.kind==='SM');
}

const drop = document.getElementById('drop');
const input = document.getElementById('fileInput');
drop.onclick = ()=>input.click();
input.onchange = e=>{ addFiles([...e.target.files]); input.value=''; };
['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop', e=>addFiles([...e.dataTransfer.files]));
document.getElementById('runBtn').onclick = run;
document.getElementById('clearBtn').onclick = ()=>{
  store.files=[]; renderChips();
  document.getElementById('panel-kc').innerHTML='';
  document.getElementById('panel-sm').innerHTML='';
  document.getElementById('summary').style.display='none';
  document.getElementById('tabs').style.display='none';
  document.getElementById('refnote').textContent='';
};
</script>
